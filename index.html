          <button type="button" id="gc-sleep-btn" title="Participants en veille" aria-label="Participants en veille" style="display:none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg><span>En veille</span></button>
          <button type="button" id="gc-bls-btn" title="BLS rapide (son uniquement)" aria-label="BLS rapide"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg><span>BLS</span></button>
          <button type="button" id="gc-hist-btn" title="Historique des consensus" aria-label="Historique des consensus">${GC_SHAKE(18)}<span>Consensus</span></button>
          <button type="button" id="gc-parts-btn" title="Participants" aria-label="Participants"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.2 2.7-5.5 6-5.5s6 2.3 6 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M17 13.8c2.4 0 4 1.7 4 4.2"/></svg><span>Participants</span></button>
        </div>
      </div>
      <div class="gc-search" id="gc-search" style="display:none;">
        <input type="search" id="gc-q" placeholder="Rechercher dans la conversation…" autocomplete="off">
        <span id="gc-count"></span>
        <button type="button" id="gc-q-close" title="Fermer la recherche">✕</button>
      </div>
      <div class="gc-thread" id="gc-thread"></div>
      <div class="gc-compose">
        <div class="gc-mention-box" id="gc-mention" style="display:none;"></div>
        <div class="gc-reply" id="gc-reply" style="display:none;"></div>
        <div class="gc-senders" id="gc-senders"></div>
        <div class="gc-row">
          <button type="button" id="gc-shake" title="Rédiger un message de consensus" aria-label="Message de consensus">${GC_SHAKE(22)}</button>
          <button type="button" id="gc-rule" title="Rappeler un commandement" aria-label="Rappeler un commandement"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="5" cy="7" r="1.3" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="5" cy="17" r="1.3" fill="currentColor" stroke="none"/><path d="M10 7h11M10 12h11M10 17h11"/></svg></button>
          <button type="button" id="gc-drift" class="gc-drift-btn" title="Signaler une dérive" aria-label="Alerte dérive"><b>⚠</b></button>
          <textarea id="gc-text" rows="1"></textarea>
          <button type="button" id="gc-send" title="Envoyer" aria-label="Envoyer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg></button>
        </div>
      </div>
    </div>`;
  const $q = sel=> s.querySelector(sel);
  const thread = $q('#gc-thread'), ta = $q('#gc-text'), qInput = $q('#gc-q');
  /* le clavier ne doit pas piloter l'écran (flèches = retour, Entrée = suivant) */
  s.addEventListener('keydown', e=>{ if(e.target.matches('input,textarea')) e.stopPropagation(); });
  forwardAction = null; spaceAction = null;

  const autoGrow = ()=>{ if(!ta.value){ ta.style.height=''; return; } ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight,140)+'px'; };
  const toBottom = ()=>{ thread.scrollTop = thread.scrollHeight; };
  const msgById = id=> groupchat.messages.find(m=>m.id===id);

  function msgHtml(m, q){
    if(m.kind==='join'){ const jp = gcPart(m.from); return `<div class="gc-join" data-id="${m.id}"><span>${escapeHtml(jp ? jp.name : (m.name||'Un participant'))} a rejoint la conversation</span></div>`; }
    const acts = `<div class="gc-actions"><button type="button" data-reply="${m.id}" title="Répondre">↩</button><button type="button" data-react="${m.id}" title="Réagir">☺</button>${m.kind==='rule' ? '' : `<button type="button" data-edit="${m.id}" title="Modifier">✎</button>`}<button type="button" data-del="${m.id}" title="Supprimer">✕</button></div>`;
    const reacts = (()=>{
      const rs = m.reactions||[]; if(!rs.length) return '';
      const by = {}; rs.forEach(r=>{ (by[r.e] = by[r.e]||[]).push(r.by); });
      return '<div class="gc-reacts">'+Object.keys(by).map(e=>{
        const names = by[e].map(id=>gcWho(id).name).join(', ');
        return `<button type="button" class="gc-react${by[e].includes(gcSender)?' mine':''}" data-chip="${m.id}|${e}" title="${escapeHtml(names)}">${e}${by[e].length>1?' <i>'+by[e].length+'</i>':''}</button>`;
      }).join('')+'</div>';
    })();
    const goto = q ? `<button type="button" class="gc-goto" data-goto="${m.id}">Voir dans la conversation</button>` : '';
    let quote = '';
    if(m.replyTo){
      const r = msgById(m.replyTo);
      if(r){
        const rw = gcQWho(r);
        quote = `<div class="gc-quote" data-jump="${r.id}" style="--qc:${rw.color||'var(--teal-deep)'}"><b>${escapeHtml(rw.name)}</b><span>${escapeHtml(gcSnippet(r,120))}</span></div>`;
      } else quote = `<div class="gc-quote gc-quote-gone"><span>Message supprimé</span></div>`;
    }
    if(m.kind==='consensus'){
      return `<div class="gc-msg gc-cons-wrap" data-id="${m.id}"><div class="gc-consensus">
        <div class="gc-cons-label">${GC_SHAKE(16)}<span>Consensus du groupe</span></div>
        ${quote}
        <div class="gc-cons-text">${gcHighlight(m.text, q)}</div>
        ${reacts}
        <div class="gc-meta">${gcDateTime(m.ts)}${m.edited?' · modifié':''}</div>
        ${goto}${acts}</div></div>`;
    }
    if(m.kind==='drift'){
      const tw = gcWho(m.target), aw = gcWho(m.from);
      return `<div class="gc-msg gc-drift-wrap" data-id="${m.id}"><div class="gc-drift${gcJustAlert===m.id?' gc-drift-new':''}">
        <div class="gc-drift-label">⚠ Alerte dérive</div>
        <div class="gc-drift-who"><span class="gc-av-btn" data-card="${m.target}">${gcAvatar(tw,26)}</span><b style="color:${tw.color||'var(--ink)'}" data-card="${m.target}">${escapeHtml(tw.name)}</b><span class="gc-drift-arrow">dérive vers</span><span class="gc-drift-tag">${gcHighlight(m.tag||'', q)}</span></div>
        <div class="gc-drift-by">signalé par ${escapeHtml(aw.name)}</div>
        ${quote}
        <div class="gc-cons-text">${gcHighlight(m.text, q)}</div>
        ${reacts}
        <div class="gc-meta">${gcDateTime(m.ts)}${m.edited?' · modifié':''}</div>
        ${goto}${acts}</div></div>`;
    }
    const w = gcWho(m.from);
    const c = w.me ? 'var(--teal)' : w.color;
    const bg = `color-mix(in srgb, ${c} ${w.me?42:30}%, var(--bg))`;
    return `<div class="gc-msg ${w.me?'me':'part'}" data-id="${m.id}">
      ${w.me ? '' : `<span class="gc-av-btn" data-card="${m.from}" title="Voir le profil">${gcAvatar(w, 30)}</span>`}
      <div class="gc-bubble" style="--c:${c};--bc:${bg}">
        ${w.me ? '' : `<div class="gc-name" style="color:${c}" data-card="${m.from}">${escapeHtml(w.name)}</div>`}
        ${m.kind==='rule' ? `<div class="gc-rule-label">Commandement n°${m.num}</div>` : ''}
        ${quote}
        <div class="gc-text">${gcHighlight(m.text, q)}</div>
        ${reacts}
        <div class="gc-meta">${gcTime(m.ts)}${m.edited?' · modifié':''}</div>
        ${goto}${acts}
      </div></div>`;
  }

  function drawThread(keepScroll){
    const q = gcQuery.trim();
    const all = groupchat.messages;
    let list = all, more = false;
    if(q){ list = all.filter(m=> m.kind!=='join' && (gcMatches(m.text||'',q).length || (m.tag && gcMatches(m.tag,q).length) || ((m.kind==='msg' || m.kind==='rule') && gcMatches(gcWho(m.from).name,q).length))); }
    else if(all.length>gcLimit){ list = all.slice(all.length-gcLimit); more = true; }
    $q('#gc-count').textContent = q ? (list.length+' résultat'+(list.length>1?'s':'')) : '';
    const prevH = thread.scrollHeight, prevTop = thread.scrollTop;
    if(!all.length){
      thread.innerHTML = `<p class="gc-empty">${groupchat.parts.length ? 'La conversation est vide. Choisissez un participant en bas et écrivez le premier message.' : 'Commencez par ajouter des participants avec le bouton « Participants » en haut. Vous écrirez ensuite tous les messages en choisissant à chaque fois qui parle.'}</p>`;
      return;
    }
    if(q && !list.length){ thread.innerHTML = `<p class="gc-empty">Aucun message ne correspond à « ${escapeHtml(q)} ».</p>`; return; }
    let html = more ? `<button type="button" class="gc-more" id="gc-more">Afficher les messages précédents</button>` : '';
    let lastDay = '';
    list.forEach(m=>{
      const d = gcDay(m.ts);
      if(d!==lastDay){ html += `<div class="gc-day"><span>${escapeHtml(d)}</span></div>`; lastDay = d; }
      html += msgHtml(m, q);
    });
    thread.innerHTML = html; gcJustAlert = null;
    if(keepScroll) thread.scrollTop = prevTop + (thread.scrollHeight - prevH);
  }

  function toggleReaction(id, e){
    const m = msgById(id); if(!m) return;
    m.reactions = m.reactions||[];
    const i = m.reactions.findIndex(r=>r.e===e && r.by===gcSender);
    if(i>=0) m.reactions.splice(i,1); else m.reactions.push({e, by:gcSender});
    if(!m.reactions.length) delete m.reactions;
    saveGC(); drawThread(true);
  }
  function jump(id){
    if(gcQuery){ gcQuery = ''; qInput.value = ''; $q('#gc-search').style.display='none'; }
    const idx = groupchat.messages.findIndex(m=>m.id===id);
    if(idx<0) return;
    const needed = groupchat.messages.length - idx;
    if(needed>gcLimit) gcLimit = needed + 20;
    drawThread();
    const el = thread.querySelector(`[data-id="${id}"]`);
    if(!el) return;
    el.scrollIntoView({block:'center'});
    el.classList.remove('gc-flash'); void el.offsetWidth; el.classList.add('gc-flash');
  }

  function drawSenders(){
    if(gcSender!=='me' && (!gcPart(gcSender) || gcPart(gcSender).asleep)) gcSender = 'me';
    const sl = groupchat.parts.filter(p=>p.asleep).length, sb = $q('#gc-sleep-btn');
    sb.style.display = sl ? '' : 'none'; sb.querySelector('span').textContent = 'En veille ('+sl+')';
    const opts = [{id:'me', w:gcWho('me')}].concat(gcActive().map(p=>({id:p.id, w:gcWho(p.id)})));
    $q('#gc-senders').innerHTML = opts.map(o=>{
      const c = o.w.me ? 'var(--teal)' : o.w.color;
      return `<button type="button" class="gc-chip${gcSender===o.id?' on':''}" data-sender="${o.id}" style="--c:${c}" title="Écrire en tant que ${escapeHtml(o.w.name)}${gcPart(o.id)&&gcPart(o.id).role?' — '+escapeHtml(gcPart(o.id).role):''}">${gcAvatar(o.w,22)}<span>${escapeHtml(o.w.name)}</span></button>`;
    }).join('');
    const rpl = gcReplyTo && msgById(gcReplyTo);
    ta.placeholder = gcEditing ? 'Modifier le message…'
      : (rpl && rpl.kind==='drift' && rpl.target===gcSender) ? gcWho(gcSender).name+', explique pourquoi tu agis ainsi…'
      : (window.innerWidth<560 ? gcWho(gcSender).name+'…' : 'Écrire en tant que '+gcWho(gcSender).name+'…');
  }
  function drawReply(){
    const box = $q('#gc-reply');
    if(gcEditing){
      box.style.display='flex'; box.style.setProperty('--qc','var(--clay)');
      box.innerHTML = `<div><b>Modification du message</b></div><button type="button" id="gc-reply-x" title="Annuler">✕</button>`;
    } else if(gcReplyTo){
      const r = msgById(gcReplyTo);
      if(!r){ gcReplyTo = null; box.style.display='none'; return; }
      const rw = gcQWho(r);
      box.style.display='flex'; box.style.setProperty('--qc', rw.color||'var(--teal-deep)');
      box.innerHTML = `<div><b>Réponse à ${escapeHtml(rw.name)}</b><span>${escapeHtml(gcSnippet(r,100))}</span></div><button type="button" id="gc-reply-x" title="Annuler">✕</button>`;
    } else { box.style.display='none'; box.innerHTML=''; return; }
    $q('#gc-reply-x').addEventListener('click', ()=>{
      if(gcEditing){ ta.value = gcDraft = ''; autoGrow(); }
      gcEditing = null; gcReplyTo = null; drawReply(); drawSenders();
    });
  }

  function send(){
    const text = ta.value.trim();
    if(!text) return;
    if(gcEditing){
      const m = msgById(gcEditing);
      if(m){ if(m.text!==text){ m.text = text; m.edited = true; } if(m.kind!=='consensus') m.from = gcSender; saveGC(); }
      gcEditing = null;
    } else {
      groupchat.messages.push({id:gcNewId(), kind:'msg', from:gcSender, text, replyTo:gcReplyTo||null, ts:Date.now()});
      saveGC();
    }
    gcReplyTo = null; ta.value = ''; gcDraft = ''; autoGrow();
    drawReply(); drawSenders();
    if(gcQuery){ gcQuery=''; qInput.value=''; $q('#gc-search').style.display='none'; }
    drawThread(); toBottom();
    if(!sosCoarse()) ta.focus();
  }

  /* --- fil de conversation : actions déléguées --- */
  thread.addEventListener('click', e=>{
    const t = e.target;
    const more = t.closest('#gc-more'); if(more){ gcLimit += 200; drawThread(true); return; }
    const g = t.closest('[data-goto]'); if(g){ jump(g.dataset.goto); return; }
    const jp = t.closest('[data-jump]'); if(jp){ jump(jp.dataset.jump); return; }
    const cd = t.closest('[data-card]'); if(cd && gcPart(cd.dataset.card)){ openPartCard(cd.dataset.card, ()=>{ drawSenders(); drawThread(true); }); return; }
    const chip = t.closest('[data-chip]'); if(chip){ const [id,e] = chip.dataset.chip.split('|'); toggleReaction(id,e); return; }
    const pk = t.closest('[data-pick]'); if(pk){ const [id,e] = pk.dataset.pick.split('|'); toggleReaction(id,e); return; }
    const rc = t.closest('[data-react]');
    if(rc){
      const box = rc.closest('.gc-bubble, .gc-consensus');
      const had = box.querySelector('.gc-picker');
      thread.querySelectorAll('.gc-picker').forEach(x=>x.remove());
      if(had) return;
      const pick = document.createElement('div'); pick.className = 'gc-picker';
      pick.innerHTML = `<span class="gc-pick-who">en tant que ${escapeHtml(gcWho(gcSender).name)}</span>` + GC_EMOJIS.map(e=>`<button type="button" data-pick="${rc.dataset.react}|${e}">${e}</button>`).join('');
      box.appendChild(pick); box.classList.add('open');
      /* garder le menu dans l'écran */
      const pr = pick.getBoundingClientRect(), tr = thread.getBoundingClientRect();
      if(pr.left < tr.left+4){ pick.style.right = 'auto'; pick.style.left = '0'; }
      if(pr.top < tr.top+4){ pick.style.bottom = 'auto'; pick.style.top = '17px'; } /* en haut de la conversation : sous la barre d'actions */
      return;
    }
    const rp = t.closest('[data-reply]');
    if(rp){ gcEditing = null; gcReplyTo = rp.dataset.reply; drawReply(); drawSenders(); ta.focus(); return; }
    const ed = t.closest('[data-edit]');
    if(ed){
      const m = msgById(ed.dataset.edit); if(!m) return;
      if(m.kind==='consensus'){ openConsensusModal(m); return; }
      if(m.kind==='drift'){ openDriftModal(m); return; }
      gcEditing = m.id; gcReplyTo = null; gcSender = m.from;
      ta.value = m.text; autoGrow(); drawReply(); drawSenders(); ta.focus();
      return;
    }
    const dl = t.closest('[data-del]');
    if(dl){
      if(!dl.classList.contains('armed')){
        dl.classList.add('armed'); dl.textContent = 'Supprimer ?';
        setTimeout(()=>{ if(dl.isConnected){ dl.classList.remove('armed'); dl.textContent = '✕'; } }, 3000);
        return;
      }
      const id = dl.dataset.del;
      groupchat.messages = groupchat.messages.filter(m=>m.id!==id);
      if(gcReplyTo===id) gcReplyTo = null;
      if(gcEditing===id){ gcEditing = null; ta.value=''; autoGrow(); }
      saveGC(); drawReply(); drawSenders(); drawThread(true);
      return;
    }
    /* toucher une bulle affiche ses actions (mobile) */
    const msg = t.closest('.gc-msg, .gc-consensus');
    thread.querySelectorAll('.open').forEach(x=>{ if(x!==msg && !(msg && msg.contains(x))) x.classList.remove('open'); });
    const box = t.closest('.gc-bubble, .gc-consensus');
    if(box && !t.closest('button, .gc-picker')){ box.classList.toggle('open'); box.querySelectorAll('.gc-picker').forEach(x=>x.remove()); }
  });
  $q('#gc-senders').addEventListener('click', e=>{
    const b = e.target.closest('[data-sender]'); if(!b) return;
    gcSender = b.dataset.sender; drawSenders(); ta.focus();
  });
  ta.value = gcDraft;
  /* @ : citer une part (liste de suggestions) */
  const menBox = $q('#gc-mention'); let menItems = [], menIdx = 0, menStart = -1;
  const menClose = ()=>{ menBox.style.display='none'; menBox.innerHTML=''; menItems = []; menStart = -1; };
  function menDraw(){
    menBox.innerHTML = menItems.map((p,i)=>`<button type="button" class="gc-men${i===menIdx?' on':''}" data-men="${i}">${gcAvatar(p,22)}<span style="color:${p.color||'var(--teal-deep)'}">${escapeHtml(p.name)}</span></button>`).join('');
    menBox.style.display = 'flex';
  }
  function menUpdate(){
    const caret = ta.selectionStart, before = ta.value.slice(0,caret);
    const m = /(?:^|\s)@([^\s@]*(?:\s[^\s@]*)?)$/.exec(before);
    if(!m){ menClose(); return; }
    const frag = gcFold(m[1]).n;
    const members = gcActive().map(p=>({id:p.id, name:p.name, color:p.color, photo:p.photo})).concat([{id:'me', name:gcMeName(), color:null, photo:null}]);
    const list = members.filter(p=>{
      const fn = gcFold(p.name).n;
      return !frag || fn.startsWith(frag) || fn.split(/\s+/).some(w=>w.startsWith(frag));
    });
    if(!list.length){ menClose(); return; }
    menStart = caret - m[1].length - 1; menItems = list; menIdx = 0; menDraw();
  }
  function menPick(i){
    const p = menItems[i]; if(!p) return;
    const caret = ta.selectionStart, ins = '@'+p.name+' ';
    ta.value = ta.value.slice(0,menStart) + ins + ta.value.slice(caret);
    const pos = menStart + ins.length; ta.setSelectionRange(pos,pos);
    menClose(); gcDraft = ta.value; autoGrow(); ta.focus();
  }
  menBox.addEventListener('mousedown', e=> e.preventDefault());
  menBox.addEventListener('click', e=>{ const b = e.target.closest('[data-men]'); if(b) menPick(+b.dataset.men); });
  ta.addEventListener('blur', ()=> setTimeout(menClose, 150));
  ta.addEventListener('click', menUpdate);
  ta.addEventListener('input', ()=>{ gcDraft = ta.value; autoGrow(); menUpdate(); });
  ta.addEventListener('keydown', e=>{
    if(menItems.length){
      if(e.key==='ArrowDown'){ e.preventDefault(); menIdx = (menIdx+1)%menItems.length; menDraw(); return; }
      if(e.key==='ArrowUp'){ e.preventDefault(); menIdx = (menIdx-1+menItems.length)%menItems.length; menDraw(); return; }
      if(e.key==='Enter' || e.key==='Tab'){ e.preventDefault(); menPick(menIdx); return; }
      if(e.key==='Escape'){ e.preventDefault(); menClose(); return; }
    }
    if(e.key==='Enter' && !e.shiftKey && !sosCoarse() && !e.isComposing){ e.preventDefault(); send(); }
  });
  $q('#gc-send').addEventListener('click', send);
  $q('#gc-shake').addEventListener('click', ()=> openConsensusModal(null));
  $q('#gc-drift').addEventListener('click', ()=> openDriftModal(null));
  $q('#gc-hist-btn').addEventListener('click', ()=> openConsensusHistory());
  $q('#gc-sleep-btn').addEventListener('click', ()=> openSleepModal(()=>{ drawSenders(); drawThread(true); }));
  $q('#gc-bls-btn').addEventListener('click', ()=> openQuickBls());
  $q('#gc-rule').addEventListener('click', ()=> openRulePicker());
  $q('#gc-parts-btn').addEventListener('click', ()=> openPartsModal(()=>{ drawSenders(); drawThread(); toBottom(); }));

  const searchBox = $q('#gc-search');
  $q('#gc-search-btn').addEventListener('click', ()=>{
    const open = searchBox.style.display==='none';
    searchBox.style.display = open ? 'flex' : 'none';
    if(open) qInput.focus(); else { gcQuery=''; qInput.value=''; drawThread(); toBottom(); }
  });
  qInput.addEventListener('input', ()=>{ gcQuery = qInput.value; drawThread(); if(!gcQuery.trim()) toBottom(); else thread.scrollTop = 0; });
  qInput.addEventListener('keydown', e=>{ if(e.key==='Escape') $q('#gc-q-close').click(); });
  $q('#gc-q-close').addEventListener('click', ()=>{ searchBox.style.display='none'; gcQuery=''; qInput.value=''; drawThread(); toBottom(); });

  /* modales exposées à l'écran pour pouvoir le redessiner */
  function openConsensusModal(existing){
    const ov = document.createElement('div'); ov.className = 'modal-overlay';
    const lastCons = [...groupchat.messages].reverse().find(m=>m.kind==='consensus' && (!existing || m.ts < existing.ts));
    const since = groupchat.messages.filter(m=> (m.kind==='msg' || m.kind==='drift' || m.kind==='rule') && (!lastCons || m.ts>lastCons.ts) && (!existing || m.ts<existing.ts));
    ov.innerHTML = `
      <div class="modal-panel" role="dialog" aria-label="Message de consensus">
        <div class="modal-head"><h3>${GC_SHAKE(16)} Message de consensus</h3></div>
        <div class="modal-body">
          <p class="sub" style="margin:0;text-align:left;">Rédigez une synthèse au nom de tous les membres du groupe pour conclure ce dialogue.</p>
          ${since.length ? `<details class="gc-recap"><summary>Relire les ${since.length} message${since.length>1?'s':''} depuis le dernier consensus</summary><div class="gc-recap-list">${since.map(m=>{if(m.kind==='drift'){ const tw=gcWho(m.target); return `<p><b style="color:${GC_RED}">⚠ Alerte</b> ${escapeHtml(tw.name)} → ${escapeHtml(m.tag)} : ${escapeHtml(gcSnippet(m,300))}</p>`; } const w=gcWho(m.from);return `<p><b style="color:${w.color||'var(--teal-deep)'}">${escapeHtml(w.name)}</b> ${escapeHtml(gcSnippet(m,400))}</p>`;}).join('')}</div></details>` : ''}
          <textarea id="gc-cons-text" rows="6" placeholder="Ensemble, nous avons conclu que…"></textarea>
        </div>
        <div class="modal-foot"><button type="button" id="gc-cons-cancel">Annuler</button><button type="button" id="gc-cons-ok" class="primary">${existing?'Enregistrer':'Insérer dans la conversation'}</button></div>
      </div>`;
    document.body.appendChild(ov);
    const cta = ov.querySelector('#gc-cons-text'); cta.value = existing ? existing.text : '';
    const close = ()=> ov.remove();
    ov.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
    ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
    ov.querySelector('#gc-cons-cancel').addEventListener('click', close);
    ov.querySelector('#gc-cons-ok').addEventListener('click', ()=>{
      const text = cta.value.trim(); if(!text) return;
      if(existing){ if(existing.text!==text){ existing.text = text; existing.edited = true; } saveGC(); close(); drawThread(true); return; }
      const m = {id:gcNewId(), kind:'consensus', text, replyTo:null, ts:Date.now()};
      groupchat.messages.push(m); saveGC(); close();
      if(gcQuery){ gcQuery=''; qInput.value=''; searchBox.style.display='none'; }
      drawThread(); toBottom();
    });
    cta.focus();
  }
  function openDriftModal(existing){
    if(!gcActive().length && !(existing && gcPart(existing.target))){ alert('Aucun participant disponible : ajoutez-en ou réveillez-en un avec les boutons « Participants » / « En veille ».'); return; }
    let target = existing && gcPart(existing.target) ? existing.target : (gcActive().find(p=>p.id!==gcSender)||gcActive()[0]).id;
    const pool = ()=> groupchat.parts.filter(p=>!p.asleep || p.id===target);
    let author = existing ? existing.from : (gcSender===target ? 'me' : gcSender);
    let tag = existing ? existing.tag : '';
    const ov = document.createElement('div'); ov.className = 'modal-overlay';
    ov.innerHTML = `
      <div class="modal-panel" role="dialog" aria-label="Alerte dérive">
        <div class="modal-head"><h3 style="color:${GC_RED}">⚠ Alerte dérive !</h3></div>
        <div class="modal-body">
          <p class="gd-l">Qui est en train de dériver ?</p><div class="gd-chips" id="gd-target"></div>
          <p class="gd-l">Quelle dérive ?</p><div class="gd-chips" id="gd-tags"></div>
          <input type="text" id="gd-newtag" class="gd-input" placeholder="…ou proposer un nouveau tag" maxlength="40">
          <p class="gd-l">Signalé par</p><div class="gd-chips" id="gd-author"></div>
          <p class="gd-l">Pourquoi pense-t-on qu'il y a dérive ?</p>
          <textarea id="gd-text" class="gd-input" rows="4" placeholder="Explique ce que tu observes…"></textarea>
        </div>
        <div class="modal-foot"><button type="button" id="gd-cancel">Annuler</button><button type="button" id="gd-ok" class="primary" style="background:${GC_RED};border-color:${GC_RED};">${existing?'Enregistrer':'Lancer l’alerte'}</button></div>
      </div>`;
    document.body.appendChild(ov);
    const el = sel=> ov.querySelector(sel), nt = el('#gd-newtag'), tx = el('#gd-text');
    nt.value = ''; tx.value = existing ? existing.text : '';
    const chip = (attr, id, w, on)=> `<button type="button" class="gc-chip${on?' on':''}" ${attr}="${id}" style="--c:${w.color||'var(--teal)'}">${gcAvatar(w,22)}<span>${escapeHtml(w.name)}</span></button>`;
    function draw(){
      el('#gd-target').innerHTML = pool().map(p=> chip('data-t', p.id, gcWho(p.id), p.id===target)).join('');
      const tp = gcPart(target), tags = (tp && tp.drifts) || [];
      el('#gd-tags').innerHTML = tags.length ? tags.map((t,i)=>`<button type="button" class="gd-tag${t===tag && !nt.value.trim()?' on':''}" data-tag="${i}">${escapeHtml(t)}</button>`).join('')
        : `<span class="sub" style="font-size:12.5px;">Aucune dérive enregistrée pour ce participant : proposez-en une ci-dessous (elle sera ajoutée à son profil).</span>`;
      el('#gd-author').innerHTML = [chip('data-a','me',gcWho('me'),author==='me')].concat(gcActive().filter(p=>p.id!==target).map(p=> chip('data-a', p.id, gcWho(p.id), p.id===author))).join('');
    }
    draw();
    ov.addEventListener('click', e=>{
      if(e.target===ov){ ov.remove(); return; }
      const t = e.target.closest('[data-t]'); if(t){ target = t.dataset.t; tag = ''; if(author===target) author = 'me'; draw(); return; }
      const g = e.target.closest('[data-tag]'); if(g){ const tp = gcPart(target); tag = tp.drifts[+g.dataset.tag]; nt.value = ''; draw(); return; }
      const a = e.target.closest('[data-a]'); if(a){ author = a.dataset.a; draw(); }
    });
    nt.addEventListener('input', draw);
    ov.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Escape') ov.remove(); });
    el('#gd-cancel').addEventListener('click', ()=> ov.remove());
    el('#gd-ok').addEventListener('click', ()=>{
      const finalTag = nt.value.trim() || tag, text = tx.value.trim();
      if(!finalTag){ nt.focus(); return; }
      if(!text){ tx.focus(); return; }
      const tp = gcPart(target);
      if(tp && !tp.drifts.some(t=>t.toLowerCase()===finalTag.toLowerCase())) tp.drifts.push(finalTag);
      const canon = (tp && tp.drifts.find(t=>t.toLowerCase()===finalTag.toLowerCase())) || finalTag;
      if(existing){
        Object.assign(existing, {target, tag:canon, from:author, text}); existing.edited = true;
        saveGC(); ov.remove(); drawThread(true); return;
      }
      const m = {id:gcNewId(), kind:'drift', target, tag:canon, from:author, text, replyTo:null, ts:Date.now()};
      groupchat.messages.push(m); saveGC(); ov.remove();
      if(gcQuery){ gcQuery=''; qInput.value=''; searchBox.style.display='none'; }
      /* la part visée doit se défendre : on prépare sa réponse */
      gcSender = target; gcReplyTo = m.id; gcEditing = null; gcJustAlert = m.id;
      drawReply(); drawSenders(); drawThread(); toBottom(); gcAlertAnim(m);
      if(!sosCoarse()) ta.focus();
    });
    (existing ? tx : nt).focus();
  }
  function openRulePicker(){
    const rules = rulesItems.filter(x=> x.text.trim());
    const ov = document.createElement('div'); ov.className = 'modal-overlay';
    ov.innerHTML = `<div class="modal-panel" role="dialog" aria-label="Rappeler un commandement">
      <div class="modal-head"><h3>Rappeler un commandement</h3></div>
      <div class="modal-body">${rules.length ? `<p class="sub" style="margin:0;text-align:left;">Choisis la règle à citer dans la conversation (elle sera postée en ton nom).</p>`
        + rules.map((r,i)=>`<button type="button" class="gc-rule-pick" data-r="${i}"><b>${i+1}</b><span>${escapeHtml(r.text).replace(/\n/g,'<br>')}</span></button>`).join('')
        : `<p class="emb-empty">Aucun commandement pour l'instant. Ajoutez-les dans l'onglet Commandements.</p>`}</div>
      <div class="modal-foot"><button type="button" id="gr-close" class="primary">Fermer</button></div></div>`;
    document.body.appendChild(ov);
    const close = ()=> ov.remove();
    ov.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
    ov.addEventListener('click', e=>{
      if(e.target===ov){ close(); return; }
      const b = e.target.closest('[data-r]'); if(!b) return;
      const i = +b.dataset.r;
      groupchat.messages.push({id:gcNewId(), kind:'rule', from:'me', num:i+1, text:rules[i].text, replyTo:gcReplyTo||null, ts:Date.now()});
      gcReplyTo = null; saveGC(); close();
      if(gcQuery){ gcQuery=''; qInput.value=''; searchBox.style.display='none'; }
      drawReply(); drawSenders(); drawThread(); toBottom();
    });
    ov.querySelector('#gr-close').addEventListener('click', close);
  }
  function openConsensusHistory(){
    const ov = document.createElement('div'); ov.className = 'modal-overlay';
    const list = groupchat.messages.filter(m=>m.kind==='consensus').slice().reverse();
    ov.innerHTML = `
      <div class="modal-panel" role="dialog" aria-label="Historique des consensus">
        <div class="modal-head"><h3>${GC_SHAKE(16)} Historique des consensus</h3></div>
        <div class="modal-body">${list.length ? list.map(m=>`
          <div class="gc-hist-item"><div class="gc-hist-date">${gcDateTime(m.ts)}</div><div class="gc-hist-text">${escapeHtml(m.text).replace(/\n/g,'<br>')}</div>
          <button type="button" data-go="${m.id}">Voir dans la conversation</button></div>`).join('')
          : `<p class="emb-empty">Aucun consensus pour l'instant. Utilisez le bouton ${GC_SHAKE(14)} dans la conversation pour en rédiger un.</p>`}</div>
        <div class="modal-foot"><button type="button" id="gc-hist-done" class="primary">Fermer</button></div>
      </div>`;
    document.body.appendChild(ov);
    const close = ()=> ov.remove();
    ov.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
    ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
    ov.querySelector('#gc-hist-done').addEventListener('click', close);
    ov.querySelectorAll('[data-go]').forEach(b=> b.addEventListener('click', ()=>{ close(); jump(b.dataset.go); }));
  }

  drawSenders(); drawReply(); drawThread(); toBottom(); autoGrow();
  if(!vaultRestoreDone) vaultRestorePromise.then(()=>{ if(currentPhase==='groupchat') renderGroupChat(); });
}

/* --- profils en veille --- */
function openSleepModal(onClose){
  const ov = document.createElement('div'); ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal-panel" role="dialog" aria-label="Participants en veille" style="width:min(460px,100%);">
    <div class="modal-head"><h3>☾ Participants en veille</h3></div><div class="modal-body" id="sl-list"></div>
    <div class="modal-foot"><button type="button" id="sl-done" class="primary">Fermer</button></div></div>`;
  document.body.appendChild(ov);
  const list = ov.querySelector('#sl-list');
  function draw(){
    const ps = groupchat.parts.filter(p=>p.asleep);
    list.innerHTML = ps.length ? ps.map(p=>`<div class="gp-row"><span>${gcAvatar(p,40)}</span><div class="gp-main"><b style="color:${p.color}">${escapeHtml(p.name)}</b>${p.role?`<span class="sub" style="font-size:12.5px;text-align:left;">${escapeHtml(p.role)}</span>`:''}</div><button type="button" class="gc-hist-item-btn" data-wake="${p.id}">☀ Réafficher</button></div>`).join('')
      : `<p class="emb-empty">Aucun participant en veille.</p>`;
  }
  draw();
  const close = ()=>{ ov.remove(); if(onClose) onClose(); };
  list.addEventListener('click', e=>{ const b = e.target.closest('[data-wake]'); if(!b) return; const p = gcPart(b.dataset.wake); if(p){ p.asleep = false; saveGC(); draw(); } });
  ov.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
  ov.querySelector('#sl-done').addEventListener('click', close);
}

/* --- BLS rapide : stimulation sonore seule, sans image --- */
function openQuickBls(){
  const ov = document.createElement('div'); ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal-panel" role="dialog" aria-label="BLS rapide" style="width:min(420px,100%);">
    <div class="modal-head"><h3>🎧 BLS rapide · son</h3></div>
    <div class="modal-body">
      <p class="sub" style="margin:0;text-align:left;">Stimulation sonore alternée gauche / droite, sans image. Mets un casque ou des écouteurs.</p>
      <div class="qb-time" id="qb-time">—</div>
      <div class="control-group"><label>Vitesse : <span id="qb-speed-v"></span> passages/min</label><input type="range" id="qb-speed" min="10" max="70"></div>
      <div class="control-group"><label>Volume : <span id="qb-vol-v"></span> %</label><input type="range" id="qb-vol" min="0" max="100"></div>
      <div class="control-group"><label>Durée : <span id="qb-dur-v"></span> s</label><input type="range" id="qb-dur" min="20" max="180"></div>
    </div>
    <div class="modal-foot"><button type="button" id="qb-close">Fermer</button><button type="button" id="qb-go" class="primary">Démarrer</button></div></div>`;
  document.body.appendChild(ov);
  const q = id=> ov.querySelector(id);
  q('#qb-speed').value = settings.speed; q('#qb-speed-v').textContent = settings.speed;
  q('#qb-vol').value = Math.round(soundVolume()*100); q('#qb-vol-v').textContent = q('#qb-vol').value;
  q('#qb-dur').value = settings.duration; q('#qb-dur-v').textContent = settings.duration;
  let running = false, timer = null, tick = null, endAt = 0, side = 'L', next = 0;
  const fmt = ms=>{ const t = Math.max(0,Math.ceil(ms/1000)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
  function stop(done){
    running = false; clearTimeout(tick); clearInterval(timer);
    q('#qb-go').textContent = 'Démarrer';
    q('#qb-time').textContent = done ? 'Terminé' : '—';
  }
  function schedule(){
    if(!running) return;
    const half = 60000/settings.speed/2, now = performance.now();
    if(now >= endAt){ stop(true); return; }
    playTick(side, true); if(settings.haptic && navigator.vibrate) navigator.vibrate(25);
    side = side==='L' ? 'R' : 'L';
    next += half; if(next < now - half) next = now + half; /* rattrape un retard (onglet en arrière-plan) */
    tick = setTimeout(schedule, Math.max(0, next - performance.now()));
  }
  function start(){
    ensureAudioCtx();
    running = true; side = 'L'; endAt = performance.now() + settings.duration*1000; next = performance.now();
    q('#qb-go').textContent = 'Arrêter';
    timer = setInterval(()=>{ q('#qb-time').textContent = fmt(endAt - performance.now()); }, 250);
    q('#qb-time').textContent = fmt(settings.duration*1000);
    schedule();
  }
  q('#qb-go').addEventListener('click', ()=> running ? stop(false) : start());
  q('#qb-speed').addEventListener('input', e=>{ settings.speed = +e.target.value; q('#qb-speed-v').textContent = settings.speed; saveSettings(); refreshSettingsPanelInputs(); });
  q('#qb-vol').addEventListener('input', e=>{ settings.volume = +e.target.value/100; q('#qb-vol-v').textContent = e.target.value; saveSettings(); refreshSettingsPanelInputs(); });
  q('#qb-dur').addEventListener('input', e=>{ settings.duration = +e.target.value; q('#qb-dur-v').textContent = settings.duration; saveSettings(); refreshSettingsPanelInputs();
    if(running) endAt = performance.now() + settings.duration*1000; });
  const close = ()=>{ stop(false); ov.remove(); };
  ov.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
  q('#qb-close').addEventListener('click', close);
}

/* --- profils des parts --- */
function openPartsModal(onClose){
  const ov = document.createElement('div'); ov.className = 'modal-overlay';
  ov.innerHTML = `
    <div class="modal-panel" role="dialog" aria-label="Participants">
      <div class="modal-head"><h3>Participants</h3></div>
      <div class="modal-body" id="gp-list"></div>
      <div class="modal-foot"><button type="button" id="gp-add">+ Ajouter un participant</button><button type="button" id="gp-done" class="primary">Terminer</button></div>
    </div>`;
  document.body.appendChild(ov);
  const listEl = ov.querySelector('#gp-list');
  let showSleep = false, addingTag = null; const newIds = []; const openColor = new Set();
  const vis = ()=> showSleep ? groupchat.parts : groupchat.parts.filter(p=>!p.asleep);
  function draw(focusId, kind){
    const ps = vis(), nSleep = groupchat.parts.filter(p=>p.asleep).length;
    const toggle = nSleep ? `<button type="button" class="gp-sleep-toggle" data-togglesleep>${showSleep ? 'Masquer les éléments en veille' : 'Afficher les éléments en veille ('+nSleep+')'}</button>` : '';
    if(!ps.length){ listEl.innerHTML = `<p class="emb-empty">${groupchat.parts.length ? 'Aucun participant affiché.' : 'Aucun participant. Ajoutez-en un : nom, couleur, photo.'}</p>` + toggle; return; }
    listEl.innerHTML = ps.map((p,i)=>`
      <div class="gp-row${p.asleep?' asleep':''}" data-id="${p.id}">
        <button type="button" class="gp-photo" data-colortoggle="${p.id}" title="Choisir la couleur">${gcAvatar(p,48)}</button>
        <div class="gp-main">
          <input type="text" class="gp-name" data-name="${p.id}" value="${escapeHtml(p.name)}" placeholder="Nom du participant" maxlength="40">
          ${p.asleep ? '<span class="gp-sleepbadge">☾ en veille : masqué au-dessus du champ de texte</span>' : ''}
          ${openColor.has(p.id) ? `<div class="gp-colors">${GC_PALETTE.map(c=>`<button type="button" class="gp-sw${p.color.toLowerCase()===c.toLowerCase()?' on':''}" data-color="${p.id}|${c}" style="background:${c}" title="${c}"></button>`).join('')}
            <input type="color" class="gp-cpick" data-cpick="${p.id}" value="${/^#[0-9a-f]{6}$/i.test(p.color)?p.color:'#888888'}" title="Autre couleur"></div>` : ''}
          <input type="text" class="gp-name gp-role" data-role="${p.id}" value="${escapeHtml(p.role||'')}" placeholder="Rôle (ex. : me protège de l'abandon)" maxlength="160">
          <div class="gp-tags"><span class="gp-dl">Dérives</span>${(p.drifts||[]).map((t,i)=>`<span class="gp-tag">${escapeHtml(t)}<button type="button" data-rmtag="${p.id}|${i}" title="Retirer">✕</button></span>`).join('')}${addingTag===p.id ? `<input type="text" class="gp-tagin" data-tagin="${p.id}" placeholder="Nouvelle dérive" maxlength="40">` : `<button type="button" class="gp-tagadd" data-addtag="${p.id}" title="Ajouter une dérive" aria-label="Ajouter une dérive">+</button>`}</div>
        </div>
        <div class="emb-row-actions">
          <button type="button" data-up="${p.id}" ${i===0?'disabled':''} title="Monter">↑</button>
          <button type="button" data-down="${p.id}" ${i===ps.length-1?'disabled':''} title="Descendre">↓</button>
          <button type="button" data-sleep="${p.id}" title="${p.asleep?'Réafficher':'Mettre en veille'}">${p.asleep?'☀':'☾'}</button>
          <button type="button" data-delpart="${p.id}" title="Supprimer">✕</button>
        </div>
      </div>`).join('') + toggle;
    if(focusId){ const t = listEl.querySelector(`[data-${kind||'name'}="${focusId}"]`); if(t){ t.focus(); if(!kind) t.select(); t.scrollIntoView({block:'nearest'}); } }
  }
  draw();
  listEl.addEventListener('input', e=>{
    const n = e.target.closest('[data-name]');
    if(n){ const p = gcPart(n.dataset.name); if(p){ p.name = n.value; saveGC(); } return; }
    const rl = e.target.closest('[data-role]');
    if(rl){ const p = gcPart(rl.dataset.role); if(p){ p.role = rl.value; saveGC(); } return; }
    const c = e.target.closest('[data-cpick]');
    if(c){ const p = gcPart(c.dataset.cpick); if(p){ p.color = c.value; saveGC(); } }
  });
  const addTag = (id, val, refocus)=>{
    const p = gcPart(id), v = (val||'').trim().replace(/,+$/,'').trim(); if(!p || !v) return false;
    if(!p.drifts.some(t=>t.toLowerCase()===v.toLowerCase())){ p.drifts.push(v); saveGC(); }
    if(!refocus) addingTag = null;
    draw(refocus ? id : undefined, refocus ? 'tagin' : undefined); return true;
  };
  listEl.addEventListener('keydown', e=>{
    const ti = e.target.closest('[data-tagin]');
    if(ti && (e.key==='Enter' || e.key===',')){ e.preventDefault(); if(ti.value.trim()) addTag(ti.dataset.tagin, ti.value, true); else { addingTag = null; draw(); } }
    else if(ti && e.key==='Escape'){ e.stopPropagation(); addingTag = null; draw(); }
  });
  /* champ de saisie fermé quand on le quitte sans rien écrire */
  listEl.addEventListener('focusout', e=>{
    const ti = e.target.closest && e.target.closest('[data-tagin]'); if(!ti) return;
    setTimeout(()=>{ if(addingTag===ti.dataset.tagin && ti.isConnected && !ti.value.trim()){ addingTag = null; draw(); } }, 160);
  });
  listEl.addEventListener('change', e=>{
    if(e.target.closest('[data-cpick]')){ draw(); return; }
    const ti = e.target.closest('[data-tagin]'); if(ti && ti.value.trim()) addTag(ti.dataset.tagin, ti.value, false);
  });
  listEl.addEventListener('click', e=>{
    const t = e.target;
    const col = t.closest('[data-color]');
    if(col){ const [id,c] = col.dataset.color.split('|'); const p = gcPart(id); if(p){ p.color = c; saveGC(); draw(); } return; }
    const rt = t.closest('[data-rmtag]'); if(rt){ const [id,i] = rt.dataset.rmtag.split('|'); const p = gcPart(id); if(p){ p.drifts.splice(+i,1); saveGC(); draw(); } return; }
    const ct = t.closest('[data-colortoggle]'); if(ct){ const id = ct.dataset.colortoggle; if(openColor.has(id)) openColor.delete(id); else openColor.add(id); draw(); return; }
    const at = t.closest('[data-addtag]'); if(at){ addingTag = at.dataset.addtag; draw(addingTag, 'tagin'); return; }
    const tg = t.closest('[data-togglesleep]'); if(tg){ showSleep = !showSleep; draw(); return; }
    const mv = (id,dir)=>{ /* on échange avec le voisin visible (les participants en veille masqués ne comptent pas) */
      const v = vis(), vi = v.findIndex(x=>x.id===id), nb = v[vi+dir]; if(vi<0 || !nb) return;
      const ps = groupchat.parts, i = ps.findIndex(x=>x.id===id), j = ps.findIndex(x=>x.id===nb.id);
      [ps[i],ps[j]] = [ps[j],ps[i]]; saveGC(); draw(); };
    const up = t.closest('[data-up]'); if(up){ mv(up.dataset.up,-1); return; }
    const dn = t.closest('[data-down]'); if(dn){ mv(dn.dataset.down,1); return; }
    const sl = t.closest('[data-sleep]'); if(sl){ const p = gcPart(sl.dataset.sleep); if(p){ p.asleep = !p.asleep; saveGC(); draw(); } return; }
    const dl = t.closest('[data-delpart]');
    if(dl){
      if(!dl.classList.contains('armed')){
        dl.classList.add('armed'); dl.textContent = 'Supprimer ? (ses messages restent)';
        setTimeout(()=>{ if(dl.isConnected){ dl.classList.remove('armed'); dl.textContent = '✕'; } }, 3500);
        return;
      }
      groupchat.parts = groupchat.parts.filter(x=>x.id!==dl.dataset.delpart); saveGC(); draw();
    }
  });
  ov.querySelector('#gp-add').addEventListener('click', ()=>{
    const p = {id:gcNewId(), name:'Nouveau participant', color:GC_PALETTE[groupchat.parts.length % GC_PALETTE.length], photo:null, role:'', drifts:[]};
    groupchat.parts.push(p); newIds.push(p.id); saveGC(); draw(p.id);
    listEl.scrollTop = listEl.scrollHeight;
  });
  const close = ()=>{
    groupchat.parts.forEach(p=>{ if(!p.name.trim()) p.name = 'Sans nom'; });
    newIds.forEach(id=>{ const p = gcPart(id); if(p) groupchat.messages.push({id:gcNewId(), kind:'join', from:id, name:p.name, ts:Date.now()}); });
    saveGC(); ov.remove(); if(onClose) onClose();
  };
  ov.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
  ov.addEventListener('click', e=>{ if(e.target===ov) close(); });
  ov.querySelector('#gp-done').addEventListener('click', close);
}

/* ================= SOS ================= */
/* Navigue vers un nouvel écran avec un nouvel état de session. L'état n'est appliqué qu'au premier
   affichage : le retour arrière restaure l'ancien instantané sans le réécraser. */
function navWith(next, phase, render){
  let applied = false;
  goTo(phase, ()=>{ if(!applied){ session = next; applied = true; } render(); });
}
const SOS_T = {
  ressens:'Ressens-le, ne fuis pas', vent:'Vide tout, exprime tout', respire:'Respire, reste avec toi-même',
  aff:'Rappels d’affirmations positives'
};
const SOS_STEPS = [
  {id:'intro'},
  {id:'isole', title:'Isole-toi', body:'Si tu peux. Mets-toi au calme. Loin du trigger s’il y en a un extérieur.'},
  {id:'ressens', title:SOS_T.ressens, body:'Laisse tes émotions pénétrer ton corps. Tu n’es pas elles, mais elles sont là. Ressens-les à fond.', bls:'Ressens à fond.'},
  {id:'ou', title:SOS_T.ressens, body:'Elles sont où ? Plexus ? Crâne ? Ventre ? Ressens à fond.', bls:'Ressens à fond.'},
  {id:'extra', title:SOS_T.ressens, body:'S’il le faut, extrapole-les physiquement : trembler de peur, pleurer de tristesse ou de colère, serrer les dents, hurler…', bls:'Laisse ton corps s’exprimer.'},
  {id:'vent', type:'text', field:'vent', title:SOS_T.vent, body:'Ne te juge pas, ne te bride pas. Dis les horreurs que tu penses, formule toutes les pensées limitantes, dis-le :', placeholder:'JE SUIS NULLE BORDEL, J’EN PEUX PLUS, À QUOI BON???'},
  {id:'ventbls', title:SOS_T.vent, body:'Rien, rien de tout ça n’est honteux. Sors-le. Sans réfléchir, instinctivement.', recall:'vent', bls:'Sors-le.'},
  {id:'respire', title:SOS_T.respire, body:'Envoie-toi de l’affection et de l’amour. Envoie de l’amour à l’endroit où t’avais mal. Si tu veux, enlace-toi.', bls:'Envoie-toi de l’amour.'},
  {id:'racines', title:'Racines', body:'Ne te juge pas. D’où ça vient ? Tout ça n’est pas ton identité. Ça va passer. Tout passe.', bls:'Tout passe.'},
  {id:'affedit', type:'affedit'},
  {id:'affloop', type:'affloop'},
  {id:'ancrage', type:'anchor'},
  {id:'presence', type:'text', field:'presence', title:'Pleine présence', body:'De quoi tu as envie ? Comment tu te sens ? Qu’est-ce que ton corps a envie de faire ?', placeholder:'Écris ici...'},
  {id:'fin', type:'end'}
];
function sosIdx(id){ return SOS_STEPS.findIndex(x=> x.id===id); }
function sosCoarse(){ return !!(window.matchMedia && matchMedia('(pointer:coarse)').matches); }
function sosNext(patch){
  navWith(Object.assign({}, session, {ball:'', affIndex:0}, patch), 'sos_step', renderSosStep);
}
function renderSos(){
  session = {kind:'sos', step:0, vent:'', presence:'', affIndex:0, ball:''};
  renderSosStep();
}
function endSos(){ session = null; history = []; currentPhase = null; goTo('home', renderHome); }

function renderSosStep(){
  if(!session || session.kind!=='sos'){ renderSos(); return; }
  const st = SOS_STEPS[session.step];
  if(!st){ endSos(); return; }
  const s = stageBase();
  const head = t=> `<h2 class="instruction fs">${escapeHtml(t)}</h2>`;
  const sub = (t,d)=> `<p class="sub fs" style="animation-delay:${d||.25}s; max-width:560px;">${escapeHtml(t)}</p>`;
  const btn = (id,label,d)=> `<button class="pill-btn fs" id="${id}" style="animation-delay:${d}s; font-size:14px; padding:10px 26px;">${label}</button>`;
  const next = ()=> sosNext({step: session.step+1});
  let go = next;
  const type = st.type || (st.bls ? 'bls' : 'info');

  if(st.id==='intro'){
    s.innerHTML = head('SOS') + sub('L’objectif n’est pas de te sentir SUPER BIEN, mais de ne pas te perdre. De te sentir au moins 10 % mieux. Tu n’as peut-être pas envie ou la possibilité d’aller bien tout de suite et c’est complètement acceptable.') + btn('sos-go','Commencer',.6);
  } else if(type==='info'){
    s.innerHTML = head(st.title) + sub(st.body) + btn('sos-go','Continuer',.6);
  } else if(type==='bls'){
    s.innerHTML = head(st.title) + sub(st.body)
      + (st.recall && session[st.recall] ? `<div class="sos-quote fs" style="animation-delay:.4s">${escapeHtml(session[st.recall])}</div>` : '')
      + btn('sos-go','Commencer la stimulation',.7);
    go = ()=> navWith(Object.assign({}, session, {ball:st.bls}), 'sos_ball', ()=> showBall('sos'));
  } else if(type==='text'){
    s.innerHTML = head(st.title) + sub(st.body)
      + `<div class="free-text-wrap fs" style="animation-delay:.4s"><textarea id="sos-ta" placeholder="${escapeHtml(st.placeholder)}"></textarea></div>`
      + btn('sos-go','Continuer',.6);
    const ta = s.querySelector('#sos-ta');
    ta.value = session[st.field] || '';
    if(sosCoarse()) ta.addEventListener('keydown', e=>{ if(e.key==='Enter') e.stopPropagation(); }); /* mobile : Entrée = saut de ligne */
    setTimeout(()=>{ try{ ta.focus(); }catch(e){} }, 120);
    go = ()=>{ session[st.field] = ta.value.trim(); sosNext({step: session.step+1}); };
  } else if(type==='affedit'){
    s.innerHTML = head(SOS_T.aff) + sub('Écris-les sous forme de liste, une par ligne. Elles seront gardées pour la prochaine fois.')
      + `<div class="free-text-wrap fs" style="animation-delay:.4s"><textarea id="sos-ta" style="min-height:150px" placeholder="Je suis en sécurité.&#10;Ça va passer.&#10;..."></textarea></div>`
      + btn('sos-go','Continuer',.6);
    const ta = s.querySelector('#sos-ta');
    ta.value = sosAffirmations.join('\n');
    ta.addEventListener('keydown', e=>{ if(e.key==='Enter') e.stopPropagation(); }); /* ici Entrée = nouvelle ligne */
    go = ()=>{
      sosAffirmations = ta.value.split(/\r?\n/).map(l=> l.trim().replace(/^[*•\-–]\s+/,'')).filter(Boolean);
      saveSosAff(sosAffirmations);
      sosNext({step: session.step + (sosAffirmations.length ? 1 : 2)});
    };
  } else if(type==='affloop'){
    const a = sosAffirmations[session.affIndex];
    if(!a){ sosNext({step: session.step+1}); return; }
    s.innerHTML = head(SOS_T.aff) + `<p class="sos-big fs" style="animation-delay:.3s">${escapeHtml(a).replace(/\n/g,'<br>')}</p>` + btn('sos-go','Commencer la stimulation',.7);
    go = ()=> navWith(Object.assign({}, session, {ball:a}), 'sos_ball', ()=> showBall('sos'));
  } else if(type==='anchor'){
    const hasEmb = embodimentItems.some(x=> x.text.trim());
    if(!hasEmb){
      s.innerHTML = head('Ancrage') + sub('Redirige ta pensée. Réaligne-toi sur tes valeurs profondes.') + btn('sos-go','Continuer',.6);
    } else {
      s.innerHTML = head('Ancrage') + sub('Redirige ta pensée. Réaligne-toi sur tes valeurs profondes.')
        + sub('Décoche les états qui ne sont pas pertinents maintenant, puis lance la routine « Embodiment ».', .35)
        + `<div class="sos-checks fs" style="animation-delay:.45s">${embodimentItems.filter(x=>x.text.trim()).map(x=>
            `<label class="sos-check"><input type="checkbox" checked data-id="${x.id}"><span>${escapeHtml(x.text).replace(/\n/g,'<br>')}</span></label>`).join('')}</div>`
        + `<div class="sos-row fs" style="animation-delay:.6s">${btn('sos-go','Lancer l’embodiment',0).replace(' fs"','"').replace('animation-delay:0s;','')}</div>`
        + `<button class="sel-alt fs" id="sos-skip" style="animation-delay:.7s">Passer cette étape</button>`;
      s.querySelector('#sos-skip').addEventListener('click', next);
      go = ()=>{
        const ids = [...s.querySelectorAll('.sos-check input:checked')].map(i=> i.dataset.id);
        if(!ids.length){ next(); return; }
        navWith({kind:'embodiment', ids, index:0, sos:true}, 'emb_point', renderEmbodimentPoint);
      };
    }
  } else if(type==='end'){
    s.innerHTML = `<p class="sos-big fs">Ce qui compte, c’est toi.</p>`
      + `<p class="sos-big fs" style="animation-delay:.8s">Ça va passer.</p>`
      + `<p class="sos-big fs" style="animation-delay:1.6s">Je te le promets ♥</p>`
      + btn('sos-go','Terminer',2.6);
    go = endSos;
  }
  const g = s.querySelector('#sos-go');
  if(g) g.addEventListener('click', ()=> go());
  forwardAction = ()=> go();
}

function renderSosAfter(){
  if(!session || session.kind!=='sos'){ renderSos(); return; }
  const s = stageBase();
  s.innerHTML = `
    <h2 class="instruction fs">Encore un peu, ou on continue ?</h2>
    <div class="sos-row fs" style="animation-delay:.4s">
      <button class="pill-btn" id="sos-again" style="font-size:14px; padding:10px 22px;">Encore un peu</button>
      <button class="pill-btn" id="sos-continue" style="font-size:14px; padding:10px 22px;">Continuer</button>
    </div>`;
  const again = ()=> navWith(Object.assign({}, session), 'sos_ball', ()=> showBall('sos'));
  const cont = ()=>{
    const st = SOS_STEPS[session.step];
    if(st && st.type==='affloop' && session.affIndex+1 < sosAffirmations.length) sosNext({step: session.step, affIndex: session.affIndex+1});
    else sosNext({step: session.step+1});
  };
  s.querySelector('#sos-again').addEventListener('click', again);
  s.querySelector('#sos-continue').addEventListener('click', cont);
  forwardAction = cont;
}

function renderModeChoice(){
  const s = stageBase();
  s.innerHTML = `
    <h2 class="instruction fs">Quel type de séance ?</h2>
    <div class="fs" style="animation-delay:.4s; display:flex; gap:12px; justify-content:center; margin-top:14px; flex-wrap:wrap;">

      ${RTEP_ENABLED ? '<button class="sel-add" id="mode-rtep">R-TEP (trauma récent)</button>' : ''}
      <button class="sel-add" id="mode-bls">Stimulation bilatérale</button>
    </div>
  `;

function renderOfflineGate(freeSessionFn, withModeBtn, msg){

const STATUS_LABEL = {a_traiter:'À traiter', en_cours:'En cours', traite:'Traité'};

function sessionsHistoryHtml(t){
  const sessions = t.sessions || [];
  if(!sessions.length) return '';
  const rows = [...sessions].reverse().map((sess,i)=>{
    const d = new Date(sess.at);
    const dateStr = d.toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric'});
    const timeStr = d.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
    const startStr = sess.startDistress!=null ? sess.startDistress : '—';
    const endStr = sess.endDistress!=null ? sess.endDistress : '—';
    const detailRows = [
      sess.feltText ? `<div class="session-detail-row"><span>Cognition négative</span><span>${escapeHtml(sess.feltText)}</span></div>` : '',
      sess.desiredText ? `<div class="session-detail-row"><span>Cognition positive</span><span>${escapeHtml(sess.desiredText)}</span></div>` : '',
      sess.level2!=null ? `<div class="session-detail-row"><span>VOC initial</span><span>${sess.level2}/10</span></div>` : '',
      sess.endVoc!=null ? `<div class="session-detail-row"><span>VOC final</span><span>${sess.endVoc}/10</span></div>` : '',
      sess.negSets!=null ? `<div class="session-detail-row"><span>Séries (phase négative)</span><span>${sess.negSets}</span></div>` : '',
      sess.posSets!=null ? `<div class="session-detail-row"><span>Séries (phase positive)</span><span>${sess.posSets}</span></div>` : '',
    ].filter(Boolean).join('');
    return `<div class="session-entry" data-session-toggle="${i}">
        <div class="session-entry-main"><span class="session-date">${dateStr} · ${timeStr}</span><span>Début : ${startStr}/10 → Fin : ${endStr}/10</span></div>
        <span class="session-chevron">›</span>
      </div>
      ${detailRows ? `<div class="session-detail">${detailRows}</div>` : ''}`;
  }).join('');
  return `<div class="sessions-history"><div><div class="sessions-history-title">Historique des séances</div>${rows}</div></div>`;
}

function isDarkColor(hex){
  if(!hex) return false;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b)/255 < 0.55;
}
function folderTileHtml(f){
  const items = traumas.filter(t=>t.folderId===f.id);
  const allDone = items.length>0 && items.every(t=>t.status==='traite');
  const dark = f.color && isDarkColor(f.color);
  const bgStyle = f.color ? ` style="background:${f.color};"` : '';
  const textStyle = f.color ? (dark ? ' style="color:#F5F2E8;"' : ' style="color:#24313A;"') : '';
  const countStyle = f.color ? (dark ? ' style="color:rgba(245,242,232,.75);"' : ' style="color:#5B6B72;"') : '';
  return `
    <div class="folder-tile ${!f.color && allDone ? 'all-done' : ''}${f.color ? ' folder-colored' : ''}" data-folder-id="${f.id}"${bgStyle}>
      <div class="folder-name"${textStyle}>${escapeHtml(f.name)}</div>
      <div class="folder-count"${countStyle}>${items.length} souvenir${items.length>1?'s':''}</div>
      <div class="folder-actions">
        <button data-edit-folder="${f.id}" title="Modifier">✎</button>
        <button data-del-folder="${f.id}" title="Supprimer">✕</button>
      </div>
    </div>`;
}

const LS_LIBSORT = 'soloemdr_libsort';
const LS_LIBSORT_COLOR = 'soloemdr_libsort_color';
const LS_HIDE_FOLDERS = 'soloemdr_hide_folders';
let libSortCriterion = localStorage.getItem(LS_LIBSORT) || 'alpha';
let libSortColor = localStorage.getItem(LS_LIBSORT_COLOR) === '1';
let hideFolders = localStorage.getItem(LS_HIDE_FOLDERS) === '1';
function toggleFoldersBtnHtml(){

function wireToggleFoldersBtn(container, refreshFn){

  if(!btn) return;
  btn.addEventListener('click', ()=>{

    localStorage.setItem(LS_HIDE_FOLDERS, hideFolders ? '1' : '0');

    refreshFn();

}
if(libSortCriterion==='color'){ libSortColor = true; libSortCriterion = 'alpha'; }
const SORT_OPTIONS = [
  {value:'alpha', label:'Alphabétique'},
  {value:'created', label:'Date de création'},
  {value:'modified', label:'Date de modification'},
  {value:'count', label:'Nombre de souvenirs'},
  {value:'status', label:'Statut'},
  {value:'priority', label:'Priorité'},
];
const STATUS_ORDER = {a_traiter:0, en_cours:1, traite:2};

function folderCompareFn(criterion){
  const countOf = f=> traumas.filter(t=>t.folderId===f.id).length;
  const isDone = f=>{ const items = traumas.filter(t=>t.folderId===f.id); return items.length>0 && items.every(t=>t.status==='traite'); };
  if(criterion==='created') return (a,b)=> (b.createdAt||0) - (a.createdAt||0);
  if(criterion==='modified') return (a,b)=> (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0);
  if(criterion==='count') return (a,b)=> countOf(b) - countOf(a);
  if(criterion==='priority') return (a,b)=> (b.priority||0) - (a.priority||0) || a.name.localeCompare(b.name);
  if(criterion==='status') return (a,b)=> (isDone(a)?1:0) - (isDone(b)?1:0) || a.name.localeCompare(b.name);
  return (a,b)=> a.name.localeCompare(b.name);
}

function sortFolders(list, criterion, byColor){
  const arr = [...list];
  const cmp = folderCompareFn(criterion);
  if(!byColor){ arr.sort(cmp); return arr; }
  const groups = new Map();
  arr.forEach(f=>{
    const key = f.color || 'default';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(f);
  });
  const groupList = [...groups.entries()].map(([key, items])=>{
    items.sort(cmp);
    return {items, isDefault: key==='default'};
  });
  groupList.sort((a,b)=> (a.isDefault?1:0) - (b.isDefault?1:0) || cmp(a.items[0], b.items[0]));
  return groupList.flatMap(g=> g.items);
}
function sortTraumas(list, mode){
  const arr = [...list];
  if(mode==='alpha') arr.sort((a,b)=> a.title.localeCompare(b.title));
  else if(mode==='created') arr.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  else if(mode==='modified') arr.sort((a,b)=> (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0));
  else if(mode==='status') arr.sort((a,b)=> (STATUS_ORDER[a.status]??0) - (STATUS_ORDER[b.status]??0));
  else if(mode==='priority') arr.sort((a,b)=> (b.priority||0) - (a.priority||0) || a.title.localeCompare(b.title));
  if(mode!=='status'){ arr.sort((a,b)=> (a.status==='traite'?1:0) - (b.status==='traite'?1:0)); }
  return arr;
}

function traumaListByKind(kind){ return kind==='recent' ? recentTraumas : traumas; }
function traumaSaveFnByKind(kind){ return kind==='recent' ? saveRecentTraumas : saveTraumas; }
function addCrossLink(idA, kindA, idB, kindB){
  const a = traumaListByKind(kindA).find(x=>x.id===idA);
  const b = traumaListByKind(kindB).find(x=>x.id===idB);
  if(!a || !b) return;
  if(!a.linkedTraumas) a.linkedTraumas = [];
  if(!b.linkedTraumas) b.linkedTraumas = [];
  if(!a.linkedTraumas.some(l=>l.id===idB && l.kind===kindB)) a.linkedTraumas.push({id:idB, kind:kindB});
  if(!b.linkedTraumas.some(l=>l.id===idA && l.kind===kindA)) b.linkedTraumas.push({id:idA, kind:kindA});
  traumaSaveFnByKind(kindA)(traumaListByKind(kindA));
  if(kindA!==kindB) traumaSaveFnByKind(kindB)(traumaListByKind(kindB));
}
function removeCrossLink(idA, kindA, idB, kindB){
  const a = traumaListByKind(kindA).find(x=>x.id===idA);
  const b = traumaListByKind(kindB).find(x=>x.id===idB);
  if(a && a.linkedTraumas) a.linkedTraumas = a.linkedTraumas.filter(l=> !(l.id===idB && l.kind===kindB));
  if(b && b.linkedTraumas) b.linkedTraumas = b.linkedTraumas.filter(l=> !(l.id===idA && l.kind===kindA));
  traumaSaveFnByKind(kindA)(traumaListByKind(kindA));
  if(kindA!==kindB) traumaSaveFnByKind(kindB)(traumaListByKind(kindB));
}
function unlinkTraumaEverywhere(id, kind){
  [traumas, recentTraumas].forEach(list=>{
    list.forEach(t=>{ if(t.linkedTraumas) t.linkedTraumas = t.linkedTraumas.filter(l=> !(l.id===id && l.kind===kind)); });
  });
  saveTraumas(traumas); saveRecentTraumas(recentTraumas);
}
function linkedTraumasHtml(t){
  const links = (t.linkedTraumas || []).filter(l=> RTEP_ENABLED || l.kind!=='recent');
  const names = links.map(l=>{
    const item = traumaListByKind(l.kind).find(x=>x.id===l.id);
    return item ? escapeHtml(item.title) : null;
  }).filter(Boolean);
  if(!names.length) return '';
  return `<div class="linked-traumas"><div><div class="sessions-history-title">Souvenir${names.length>1?'s':''} lié${names.length>1?'s':''}</div><div class="linked-traumas-names">${names.join(', ')}</div></div></div>`;
}

  /* la cognition négative donnée à la 1re séance sur ce souvenir est gardée sur le souvenir

  const savedT = traumaId ? traumas.find(x=>x.id===traumaId) : null;
  const savedNeg = (savedT && savedT.negCognition) || '';
  session = { traumaId, title, description, feltText:savedNeg, negCognitionLocked:!!savedNeg, level1:null, level1Detail:'',
    desiredText:'', level2:null, level2Detail:'', negSets:0, posSets:0, closureStep:0,
    startDistress:null, endVoc:null, endVocDetail:'', endDistress:null, endDistressDetail:'' };
  goTo('loading1', ()=> renderLoading({phase:'connect', fn:renderConnect}));
}

function renderScaleScreen(title, storeKey, detailKey, nextPhase, nextFn, showDetail, introHtml){
  const s = stageBase();

  const numbersHtml = Array.from({length:11},(_,i)=>i).map(n=>`<button class="scale-num" data-v="${n}">${n}</button>`).join('');
  s.innerHTML = `

    </div>
  `;
  let touched = session[storeKey]!=null;
  let currentValue = touched ? session[storeKey] : null;
  const buttons = s.querySelectorAll('.scale-num');
  function selectValue(v){
    buttons.forEach(b=> b.classList.toggle('selected', +b.dataset.v===v));
    s.querySelector('#sl-label').textContent = labelFn(v);

}

let bls = { running:false, mode:null, accumulated:0, resumeTime:0, lastSide:null, anim:null, timer:null, audioCtx:null };

function computeXY(t){
  const swing=Math.sin(t*Math.PI*2);
  return {x:0.5+swing*0.42, y:0.5};
}
/* iOS : par défaut le son Web Audio est coupé par le bouton silencieux ; 'playback' l'en affranchit */
try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
/* Vieux Safari : le contexte ne se débloque que si un son (même muet) est lancé pendant le geste */
let silentUnlocked = false;
function unlockSilentBuffer(c){
  if(silentUnlocked || !c) return;
  try{ const b=c.createBuffer(1,1,22050), src=c.createBufferSource(); src.buffer=b; src.connect(c.destination); src.start(0); silentUnlocked = true; }catch(e){}
}
function ensureAudioCtx(){
  try{
    if(bls.audioCtx && bls.audioCtx.state==='closed') bls.audioCtx = null;
    if(!bls.audioCtx) bls.audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    /* 'suspended' mais aussi 'interrupted' (iOS : après un changement d'appli, un verrouillage…) */
    if(bls.audioCtx.state!=='running'){ const p = bls.audioCtx.resume(); if(p && p.catch) p.catch(()=>{}); }
  }catch(e){}
  return bls.audioCtx;
}
/* débloque le contexte audio dès la toute première interaction avec la page, pas seulement
   au lancement d'une série : certains navigateurs n'autorisent la lecture que si le contexte
   a été créé/repris tôt, au plus près d'un vrai geste utilisateur. */
['keydown','mousedown','pointerdown','touchstart','touchend','click'].forEach(evt=>{
  document.addEventListener(evt, function unlockAudioOnFirstGesture(){ if(settings.audio){ const c = ensureAudioCtx(); unlockSilentBuffer(c); } }, {capture:true});
});
/* Si le navigateur refuse de lancer le son (politique de lecture automatique), on le dit
   au lieu d'échouer en silence : un clic sur le message suffit à le débloquer. */
function showAudioBlockedHint(){
  const inner = $('bls-inner');
  if(!inner || $('audio-hint')) return;
  const b = document.createElement('button');
  b.id = 'audio-hint'; b.className = 'audio-hint'; b.type = 'button';
  b.textContent = "Son bloqué par le navigateur — cliquez ici pour l'activer";
  b.addEventListener('click', ()=>{
    ensureAudioCtx();
    setTimeout(()=>{ if(bls.audioCtx && bls.audioCtx.state==='running') b.remove(); }, 300);
  });
  inner.appendChild(b);
}
function soundVolume(){ return typeof settings.volume==='number' ? Math.max(0, Math.min(1, settings.volume)) : 0.8; }
/* Le son d'origine (sinusoïde douce de 420 Hz, ~0,1 s) : doux et non distrayant. Le curseur de volume
   le règle de façon progressive (80 % = niveau d'origine, 100 % = ~5 fois plus fort).
   Le côté (gauche/droite) passe par un fusionneur de canaux, supporté partout. */
function tickPeak(vol){ return vol<=0.8 ? 0.18*(vol/0.8) : 0.18*Math.pow(5, (vol-0.8)/0.2); }
function buildTick(ctx, dest, side, when, vol){
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type='sine'; osc.frequency.value=420;
  gain.gain.setValueAtTime(0, when);
  gain.gain.linearRampToValueAtTime(tickPeak(vol), when+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, when+0.11);
  const merger=ctx.createChannelMerger(2);
  osc.connect(gain); gain.connect(merger, 0, side==='L' ? 0 : 1); merger.connect(dest);
  osc.start(when); osc.stop(when+0.13);
}
/* Repli : le même tock en petit fichier WAV joué par une balise <audio>. Sert quand Web Audio est
   indisponible/bloqué, et sur les vieux iPhone (iOS < 17) où Web Audio est coupé par le bouton
   silencieux alors qu'une balise <audio> ne l'est pas. */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const PREFER_MEDIA_TICKS = IS_IOS && !navigator.audioSession;
function wavUrl(int16, channels, rate){
  const bytes = 44 + int16.length*2, buf = new ArrayBuffer(bytes), dv = new DataView(buf);
  const w = (o,str)=>{ for(let i=0;i<str.length;i++) dv.setUint8(o+i, str.charCodeAt(i)); };
  w(0,'RIFF'); dv.setUint32(4,bytes-8,true); w(8,'WAVE'); w(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,channels,true);
  dv.setUint32(24,rate,true); dv.setUint32(28,rate*channels*2,true); dv.setUint16(32,channels*2,true); dv.setUint16(34,16,true); w(36,'data'); dv.setUint32(40,int16.length*2,true);
  for(let i=0;i<int16.length;i++) dv.setInt16(44+i*2, int16[i], true);
  return URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
}
let tickWavUrls = {}, beepUrl = null;
function tickWavUrl(side){
  if(tickWavUrls[side]) return tickWavUrls[side];
  const rate=22050, n=Math.floor(rate*0.2), data=new Int16Array(n*2);
  for(let i=0;i<n;i++){
    const t=i/rate;
    const env = t<0.012 ? t/0.012 : t<0.11 ? Math.exp(-(t-0.012)*76.5) : 0;
    const v=Math.sin(2*Math.PI*420*t)*env*0.7*32767;
    data[i*2] = side==='L' ? v : 0; data[i*2+1] = side==='L' ? 0 : v;
  }
  return (tickWavUrls[side] = wavUrl(data, 2, rate));
}
function beepWavUrl(){
  if(beepUrl) return beepUrl;
  const rate=22050, n=rate, data=new Int16Array(n);
  for(let i=0;i<n;i++){ const t=i/rate, env=Math.min(1,t/0.02)*Math.min(1,(1-t)/0.05); data[i]=Math.sin(2*Math.PI*440*t)*env*0.9*32767; }
  return (beepUrl = wavUrl(data, 1, rate));
}
const tickPool = {};
function playTickMedia(side){
  /* éléments <audio> créés une fois et réutilisés : en créer un par top faisait saccader la balle */
  const pool = tickPool[side] || (tickPool[side] = {i:0, els:[0,1].map(()=>{ const e=new Audio(tickWavUrl(side)); e.preload='auto'; return e; })});
  const a = pool.els[pool.i++ % pool.els.length];
  a.volume = Math.min(1, tickPeak(soundVolume())/0.7); /* le fichier a un pic de 0,7 */
  try{ a.currentTime = 0; }catch(e){}
  const p = a.play();
  return p && p.catch ? p : Promise.resolve();
}
function playTick(side, force){
  if(!settings.audio && !force) return;
  if(PREFER_MEDIA_TICKS || settings.soundEngine==='media'){ playTickMedia(side).catch(()=>{ if(!force) showAudioBlockedHint(); }); return; }
  try{
    const ctx=ensureAudioCtx();
    if(ctx && ctx.state==='running'){
      const hint=$('audio-hint'); if(hint) hint.remove();
      buildTick(ctx, ctx.destination, side, ctx.currentTime, soundVolume());
      return;
    }
  }catch(e){}
  /* Web Audio indisponible ou pas encore débloqué : on essaie la balise <audio> */
  try{ playTickMedia(side).catch(()=>{ if(!force) showAudioBlockedHint(); }); }
  catch(e){ if(!force) showAudioBlockedHint(); }
}

const RTEP_HOTSPOT_DURATION = 20; /* secondes — "série courte", ~8-12 passages */
function showBall(mode, resp){

  else if(mode==='sos' && session && session.ball) keepText = session.ball;

  inner.innerHTML = `

      : isFirst ? `<div id="bls-instruction">${txt}</div>` : ''}

  });
  spaceAction = ()=> startBLS(mode);
}

function startBLS(mode){
  if(settings.audio) ensureAudioCtx();
  spaceAction = ()=> requestStop();
  bls.mode=mode; bls.running=true; bls.accumulated=0; bls.resumeTime=performance.now(); bls.lastSide=null;
  if(mode==='neg') session.negSets++;
  else if(mode==='pos') session.posSets++;
  else if(mode==='rtep_worst') session.negSets++;
  else if(mode==='rtep_pos') session.posSets++;
  else if(mode==='rtep_hotspot'){
    const h = session.hotspots[session.hotspotIndex];
    if(h){
      if(!session.hotspotWork[h.id]) session.hotspotWork[h.id] = {sensation:'', sud:null, negCognition:'', sets:0, lastSud:null};
      session.hotspotWork[h.id].sets++;
    }
  }
  const ins = $('bls-instruction'); if(ins) ins.style.opacity='0';
  const duration = mode==='rtep_hotspot' ? RTEP_HOTSPOT_DURATION : settings.duration;
  bls.timer = setTimeout(()=> requestStop(), duration*1000);
  runLoop();
}

function runLoop(){
  const dot=$('bls-dot'); const bstage=$('bls-stage');
  const speed=settings.speed, periodMs=60000/speed;
  function frame(now){
    if(!bls.running) return;
    const elapsed = bls.accumulated + (now-bls.resumeTime);
    const t = (elapsed%periodMs)/periodMs;
    const {x,y} = computeXY(t);
    const w=bstage.clientWidth, h=bstage.clientHeight;
    /* déplacement par transform (pas de recalcul de mise en page à chaque image) */
    dot._dx=(x-0.5)*w; dot._dy=(y-0.5)*h;
    dot.style.transform='translate3d('+dot._dx+'px,'+dot._dy+'px,0) translate(-50%,-50%)';
    const side = x<0.5?'L':'R';
    if(side!==bls.lastSide){
      if(bls.lastSide!==null){ playTick(side); if(settings.haptic && navigator.vibrate) navigator.vibrate(25); }
      bls.lastSide=side;
    }
    bls.anim = requestAnimationFrame(frame);
  }
  bls.anim = requestAnimationFrame(frame);
}

function requestStop(){
  if(!bls.running) return;
  bls.running=false; spaceAction=null;
  if(bls.timer) clearTimeout(bls.timer);
  if(bls.anim) cancelAnimationFrame(bls.anim);
  const dot=$('bls-dot'), bstage=$('bls-stage');
  const startX=dot._dx||0, startY=dot._dy||0, dur=1200, t0=performance.now();
  function decel(now){
    let p=Math.min(1,(now-t0)/dur); const ease=1-Math.pow(1-p,3);
    dot.style.transform='translate3d('+(startX*(1-ease))+'px,'+(startY*(1-ease))+'px,0) translate(-50%,-50%)';
    if(p<1) requestAnimationFrame(decel); else afterStop();
  }
  requestAnimationFrame(decel);
}

function afterStop(){
  const mode = bls.mode;
  if(mode==='rtep_hotspot'){ $('bls-stage').style.display='none'; $('stage').style.display='flex'; document.body.classList.remove('hide-l','hide-r'); crossfadeToFormRtepHotspot(); return; }
  if(mode==='embodiment'){
    /* l'animation d'arrêt peut finir après qu'on a quitté l'écran : on ne force pas le choix dans ce cas */
    if(currentPhase==='emb_ball' && session && session.kind==='embodiment') goTo('emb_choice', renderEmbodimentChoice);
    return;
  }
  if(mode==='sos'){
    if(currentPhase==='sos_ball' && session && session.kind==='sos') goTo('sos_after', renderSosAfter);
    return;
  }
  if(mode==='bodyscan'){ $('bls-stage').style.display='none'; $('stage').style.display='flex'; document.body.classList.remove('hide-l','hide-r'); renderBodyScan(); return; }
  if(mode==='simple'){ showBall('simple'); return; }
  crossfadeToForm(mode);
}

/* ==================================================================
   R-TEP — protocole dédié aux traumas récents.
   Réutilise les mécaniques BLS/checkpoint partagées ci-dessus (modes
   'rtep_hotspot' / 'rtep_worst' / 'rtep_pos') ainsi que la fin de
   parcours EMDR (renderVocRecap -> renderEndDistress -> renderBodyScan
   -> renderClosure -> renderSessionEnd, tous génériques via session.kind).
   ================================================================== */
/* Une séance R-TEP peut s'étaler sur plusieurs fois : la liste des points
   chauds (et le travail déjà fait dessus) est donc réenregistrée sur le
   trauma lui-même au fil de l'eau, séparément de l'historique des séances
   terminées, pour ne jamais perdre ce travail si la séance n'est pas finie
   d'un coup. */
function saveRtepProgress(){
  if(!session || session.kind!=='rtep' || !session.traumaId) return;
  const t = recentTraumas.find(x=>x.id===session.traumaId);
  if(!t) return;
  t.rtepProgress = { hotspots: session.hotspots, hotspotWork: session.hotspotWork, hotspotIndex: session.hotspotIndex, updatedAt: Date.now() };
  if(t.status!=='traite') t.status = 'en_cours';
  t.updatedAt = Date.now();
  saveRecentTraumas(recentTraumas);
}

function beginRtepSession(traumaId, title, description){
  const t = traumaId ? recentTraumas.find(x=>x.id===traumaId) : null;
  const progress = t && t.rtepProgress;
  session = { kind:'rtep', traumaId, title, description,
    hotspots: progress ? progress.hotspots : [], hotspotIndex: progress ? progress.hotspotIndex : 0,
    hotspotWork: progress ? progress.hotspotWork : {},
    hotspotSudScratch: null, hotspotSudScratchDetail: '',
    worstMoments: [], negSets: 0,
    desiredText:'', level2:null, level2Detail:'', posSets:0,
    endVoc:null, endVocDetail:'', endDistress:null, endDistressDetail:'',
    startDistress: null, recontextText:'', stagedLinks: [],
    feltText:'' };
  if(t){ if(t.status!=='traite') t.status = 'en_cours'; t.updatedAt = Date.now(); saveRecentTraumas(recentTraumas); }
  goTo('rtep_loading1', ()=> renderLoading({phase:'rtep_stabilize', fn:renderRtepStabilize}));
}

  }
  function renderList(query){
    const q=(query||'').trim().toLowerCase();
    const rows = [
      ...oldCandidates.filter(t=>!q||t.title.toLowerCase().includes(q)).map(t=>({id:t.id,kind:'old',title:t.title})),
      ...recentCandidates.filter(t=>!q||t.title.toLowerCase().includes(q)).map(t=>({id:t.id,kind:'recent',title:t.title})),
    ];
    listEl.innerHTML = rows.map(r=>`
      <div class="sel-card" data-id="${r.id}" data-kind="${r.kind}">
        <div><div class="t">${escapeHtml(r.title)}</div></div>
        <div class="actions"><button data-pick="${r.id}" data-pick-kind="${r.kind}">${session.stagedLinks.some(l=>l.id===r.id&&l.kind===r.kind)?'Retirer':'Lier'}</button></div>
      </div>`).join('') || `<p class="sub">Aucun résultat.</p>`;
    listEl.querySelectorAll('[data-pick]').forEach(b=> b.addEventListener('click', (e)=>{

      renderList(q); renderSelected();
    }));

  renderList(''); renderSelected();
  s.querySelector('#rtep-link-search').addEventListener('input', (e)=> renderList(e.target.value));
