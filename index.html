function renderSessionEnd(){
  const s = stageBase();
  document.body.classList.add('hide-r');
  s.innerHTML = `
    <h2 class="instruction fs">Séance terminée</h2>
    <p class="sub fs" style="animation-delay:.4s">Prenez un moment avant de vous relever.</p>
    <div class="btn-row fs" id="status-row" style="animation-delay:.7s; display:flex; gap:10px;"></div>
  `;
  const finish = ()=>{ session=null; history=[]; currentPhase=null; goTo('loading0final', ()=> renderLoading({phase:'home',fn:renderHome})); };
  let autoAdvance = true;
  const kind = session.kind==='rtep' ? 'recent' : 'old';
  const list = traumaListByKind(kind);
  const save = traumaSaveFnByKind(kind);
  if(session.traumaId){
    const t = list.find(x=>x.id===session.traumaId);
    if(t){
      if(!t.sessions) t.sessions = [];
      t.sessions.push({
        at: Date.now(),
        startDistress: session.startDistress,
        endDistress: session.endDistress,
        level2: session.level2,
        endVoc: session.endVoc,
        feltText: session.feltText,
        desiredText: session.desiredText,
        negSets: session.negSets,
        posSets: session.posSets
      });
      t.status = 'en_cours'; t.updatedAt = Date.now();
      if(kind==='recent') delete t.rtepProgress;
      if(session.stagedLinks && session.stagedLinks.length){
        session.stagedLinks.forEach(l=> addCrossLink(t.id, kind, l.id, l.kind));
      }
      save(list);
      const success = session.endDistress!=null && session.endDistress<=1;
      if(success){
        autoAdvance = false;
        s.querySelector('#status-row').innerHTML = `
          <div class="fs" style="animation-delay:.7s; text-align:center;">
            <p class="sub" style="margin-bottom:10px;">Félicitations, ce souvenir ne semble plus vous déranger. On le marque comme traité ?</p>
            <div style="display:flex; gap:10px; justify-content:center;">
              <button class="sel-add" id="mark-done">Marquer comme traité</button>
              <button class="sel-add" id="mark-not-yet">Pas encore</button>
            </div>
          </div>`;
        s.querySelector('#mark-done').addEventListener('click', ()=>{ t.status='traite'; t.updatedAt=Date.now(); save(list); finish(); });
        s.querySelector('#mark-not-yet').addEventListener('click', finish);
      } else {
        s.querySelector('#status-row').innerHTML = '<p class="sub">Souvenir marqué : en cours.</p>';
      }
    }
  }
  if(autoAdvance) setTimeout(finish, 6000);
}

/* ---------------- account / sync screens ---------------- */
function lastRestoreHtml(){
  try{
    const r = JSON.parse(localStorage.getItem(LS_LAST_RESTORE)||'null');
    if(!r) return '';
    return `<p class="sub" style="font-size:11px;">Reconnexion automatique : ${escapeHtml(r.msg)}.</p>`;
  }catch(e){ return ''; }
}
function updateConnDot(){
  const dot = $('connDot');
  if(!dot) return;
  if(!supa){ dot.className = 'conn-dot'; dot.title = 'Synchronisation non configurée'; return; }
  if(!vault.userId){ dot.className = 'conn-dot'; dot.title = "Non connecté·e — vos souvenirs restent uniquement sur cet appareil"; return; }
  if(lastSyncError){ dot.className = 'conn-dot err'; dot.title = 'La dernière synchronisation a échoué'; return; }
  dot.className = 'conn-dot ok'; dot.title = 'Connecté·e et synchronisé·e';
}

function accountBackupHtml(){
  return `
  <div class="account-backup">
    <button type="button" id="acc-export-btn">Télécharger une sauvegarde</button>
    <button type="button" id="acc-import-btn">Restaurer une sauvegarde</button>
    <input type="file" id="acc-import-input" accept="application/json" style="display:none;">
    <p class="sub" id="acc-import-status" style="font-size:11px;margin:6px 0 0;"></p>
  </div>`;
}

function wireBackupControls(panel){
  panel.querySelector('#acc-export-btn').addEventListener('click', ()=>{
    const data = {traumas, folders, recentTraumas, settings, embodiment: embodimentItems, sosAffirmations, commandments: rulesItems, groupchat};
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'soloemdr_sauvegarde_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  const importInput = panel.querySelector('#acc-import-input');
  panel.querySelector('#acc-import-btn').addEventListener('click', ()=> importInput.click());
  importInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    const statusEl = panel.querySelector('#acc-import-status');
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!Array.isArray(data.traumas) && !Array.isArray(data.recentTraumas) && !Array.isArray(data.folders)){
        statusEl.textContent = 'Fichier invalide.';
        return;
      }
      traumas = data.traumas || [];
      folders = data.folders || [];
      recentTraumas = data.recentTraumas || [];
      if(Array.isArray(data.embodiment)){ embodimentItems = data.embodiment; saveEmbodiment(embodimentItems); }
      if(data.groupchat && Array.isArray(data.groupchat.parts) && Array.isArray(data.groupchat.messages)){ groupchat = gcFix(data.groupchat); saveGC(); }
      if(Array.isArray(data.commandments)){ rulesItems = data.commandments; saveRules(rulesItems); }
      if(Array.isArray(data.sosAffirmations)){ sosAffirmations = data.sosAffirmations; saveSosAff(sosAffirmations); }
      if(data.settings) settings = Object.assign(settings, data.settings);
      saveTraumas(traumas);
      saveFolders(folders);
      saveRecentTraumas(recentTraumas);
      saveSettings();
      refreshSettingsPanelInputs();
      statusEl.textContent = `Restauré : ${traumas.length} souvenir(s), ${folders.length} dossier(s), ${recentTraumas.length} trauma(s) récent(s).` +
        (vault.userId ? ' Synchronisation avec votre compte en cours...' : ' (non connecté·e pour le moment : restera uniquement sur cet appareil tant que vous ne vous connectez pas)');
    }catch(err){
      statusEl.textContent = 'Erreur de lecture du fichier : ' + err.message;
    }
    importInput.value = '';
  });
}

function renderAccountPanel(){
  const panel = $('account-panel');
  updateConnDot();
  if(!supa){
    panel.innerHTML = `<p class="sub">Synchronisation non configurée.</p>` + accountBackupHtml();
    wireBackupControls(panel);
    return;
  }
  if(vault.userId){
    panel.innerHTML = `
      <p class="sub">Connecté·e : ${escapeHtml(vault.email)}</p>
      <label class="sub" for="acc-firstname" style="display:block;margin:8px 0 3px;">Prénom (affiché dans Conversation)</label>
      <input type="text" id="acc-firstname" value="${escapeHtml(settings.firstName||'')}" placeholder="Votre prénom" maxlength="40" style="width:100%;box-sizing:border-box;background:var(--bg-soft);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:13.5px;font-family:inherit;margin-bottom:8px;">
      ${lastSyncError ? `<p class="sub" style="color:#c0554a;">La dernière synchronisation a échoué. Vos changements récents ne sont peut-être pas enregistrés sur votre compte.</p>` : ''}
      <div class="sync-diag"><p class="sub" id="sync-info" style="font-size:11.5px;line-height:1.5;"></p><button type="button" id="sync-now">Synchroniser maintenant</button></div>
      <button id="acc-panel-logout">Se déconnecter</button>
      ${accountBackupHtml()}
    `;
    const sInfo = panel.querySelector('#sync-info'), sBtn = panel.querySelector('#sync-now');
    const sRender = (extra)=>{
      sInfo.innerHTML = `Version du site : ${APP_BUILD}<br>Sur cet appareil : ${groupchat.messages.length} messages · ${groupchat.parts.length} participants · ${traumas.length} souvenirs`
        + (lastSyncErrorMsg ? `<br><span style="color:#c0554a">Dernière erreur : ${escapeHtml(lastSyncErrorMsg)}</span>` : '') + (extra ? '<br>'+extra : '');
    };
    sRender();
    sBtn.addEventListener('click', async ()=>{
      sBtn.disabled = true; sRender('Synchronisation…');
      try{
        const {data:row, error} = await supa.from('vaults').select('data_iv,ciphertext,updated_at').eq('user_id', vault.userId).maybeSingle();
        if(error) throw error;
        let cloudTxt = 'aucune version en ligne';
        if(row){
          const c = JSON.parse(await decryptWithDEK(vault.dek, row.data_iv, row.ciphertext));
          const cg = c.groupchat || {};
          cloudTxt = `En ligne : ${(cg.messages||[]).length} messages · ${(cg.parts||[]).length} participants · ${(c.traumas||[]).length} souvenirs (modifié le ${new Date(row.updated_at).toLocaleString('fr-FR')})`;
        }
        await vaultMergeFromCloud(true);
        dirtyVer++; try{ localStorage.setItem(LS_DIRTY,'1'); }catch(e){}
        await vaultPush();
        refreshAfterSync();
        sRender(cloudTxt + '<br>' + (lastSyncError ? 'Envoi : échec' : 'Après fusion, envoi réussi : ' + groupchat.messages.length + ' messages · ' + groupchat.parts.length + ' participants'));
      }catch(e){
        sRender('Erreur : ' + escapeHtml(String((e && (e.message || e.details || e.code)) || e)));
      }
      sBtn.disabled = false;
    });
    const fn = panel.querySelector('#acc-firstname');
    fn.addEventListener('keydown', e=> e.stopPropagation());
    fn.addEventListener('input', ()=>{ settings.firstName = fn.value.trim(); saveSettings(); });
    fn.addEventListener('change', ()=>{ if(currentPhase==='groupchat') renderGroupChat(); });
    panel.querySelector('#acc-panel-logout').addEventListener('click', ()=>{
      vaultLogout();
      panel.classList.remove('open');
      if(currentFn) currentFn();
    });
  } else {
    panel.innerHTML = `
      <p class="sub">Non connecté·e — vos souvenirs restent uniquement sur cet appareil tant que vous n'êtes pas connecté·e.</p>
      ${lastRestoreHtml()}
      <button id="acc-panel-login">Se connecter</button>
      ${accountBackupHtml()}
    `;
    panel.querySelector('#acc-panel-login').addEventListener('click', ()=>{
      panel.classList.remove('open');
      goTo('authlogin', ()=> renderAuthForm('login'));
    });
  }
  wireBackupControls(panel);
}

function renderAuthForm(mode){
  const s = stageBase();
  const isSignup = mode==='signup';
  s.innerHTML = `
    <h2 class="instruction fs">${isSignup ? 'Créer un compte' : 'Se connecter'}</h2>
    <div class="free-text-wrap fs" style="animation-delay:.3s"><input type="text" id="auth-email" placeholder="Email"></div>
    <div class="free-text-wrap fs" style="animation-delay:.4s"><input type="password" id="auth-pw" placeholder="Mot de passe"></div>
    <p class="form-error" id="auth-error"></p>
    <button class="pill-btn fs" id="auth-submit" style="animation-delay:.5s;">${isSignup ? 'Créer mon compte' : 'Se connecter'}</button>
    ${!isSignup ? `
      <button class="sel-alt fs" id="auth-forgot" style="animation-delay:.6s;">Mot de passe oublié ?</button>
      <button class="sel-alt fs" id="auth-toggle-signup" style="animation-delay:.65s;">Pas de compte ? Créer un compte</button>
    ` : `
      <button class="sel-alt fs" id="auth-toggle-login" style="animation-delay:.6s;">Déjà un compte ? Se connecter</button>
    `}
  `;
  document.body.classList.add('hide-r');
  const errEl = s.querySelector('#auth-error');
  const submit = async ()=>{
    const email = s.querySelector('#auth-email').value.trim();
    const password = s.querySelector('#auth-pw').value;
    if(!email || !password){ errEl.textContent = 'Email et mot de passe requis.'; return; }
    errEl.textContent = 'Un instant...';
    try{
      if(isSignup){
        const res = await vaultSignUp(email, password);
        if(res.needsConfirmation){
          s.innerHTML = `<h2 class="instruction fs">Vérifie ta boîte mail</h2><p class="sub fs" style="animation-delay:.3s">Clique sur le lien de confirmation reçu par email, puis reviens te connecter.</p>`;
          return;
        }
        goTo('recoveryreveal', ()=> renderRecoveryPhraseReveal(res.recoveryPhrase, 'home', renderHome));
      } else {
        const res = await vaultLogin(email, password);
        if(res.conflict){
          goTo('syncchoice', ()=> renderSyncChoice(res.row));
        } else if(res.freshlyCreated){
          goTo('recoveryreveal', ()=> renderRecoveryPhraseReveal(res.recoveryPhrase, 'home', renderHome));
        } else {
          session=null; history=[]; currentPhase=null;
          goTo('home', renderHome);
        }
      }
    }catch(e){
      errEl.textContent = translateAuthError(e);
    }
  };
  s.querySelector('#auth-submit').addEventListener('click', submit);
  forwardAction = submit;
  if(!isSignup){
    s.querySelector('#auth-forgot').addEventListener('click', ()=> goTo('forgotpw', renderForgotPassword));
    s.querySelector('#auth-toggle-signup').addEventListener('click', ()=> goTo('authsignup', ()=> renderAuthForm('signup')));
  } else {
    s.querySelector('#auth-toggle-login').addEventListener('click', ()=> goTo('authlogin', ()=> renderAuthForm('login')));
  }
}

function renderRecoveryPhraseReveal(phrase, returnPhase, returnFn){
  const s = stageBase();
  s.innerHTML = `
    <h2 class="instruction fs">Ta phrase de récupération</h2>
    <p class="sub fs" style="animation-delay:.3s">Note-la maintenant dans un endroit sûr (gestionnaire de mots de passe, papier...). Elle ne sera plus jamais affichée. Sans elle et sans ton mot de passe, tes souvenirs seraient perdus définitivement.</p>
    <div class="fs" style="animation-delay:.4s; font-family:monospace; font-size:17px; letter-spacing:1px; background:var(--surface); border:1px solid var(--line);
      border-radius:12px; padding:16px 20px; margin:8px auto 0; width:min(420px,90%); word-break:break-all;">${escapeHtml(phrase)}</div>
    <div class="check-row fs" style="animation-delay:.6s"><input type="checkbox" id="phrase-ack"> <label for="phrase-ack">J'ai noté ma phrase de récupération en lieu sûr</label></div>
    <button class="sel-add fs" id="phrase-continue" style="animation-delay:.7s; opacity:.4;">Continuer</button>
  `;
  document.body.classList.add('hide-l','hide-r');
  const ack = s.querySelector('#phrase-ack');
  const btn = s.querySelector('#phrase-continue');
  ack.addEventListener('change', ()=>{ btn.style.opacity = ack.checked ? '1' : '.4'; });
  const proceed = ()=>{
    if(!ack.checked) return;
    session=null; history=[]; currentPhase=null;
    goTo(returnPhase, returnFn);
  };
  btn.addEventListener('click', proceed);
}

function renderForgotPassword(){
  const s = stageBase();
  s.innerHTML = `
    <h2 class="instruction fs">Mot de passe oublié</h2>
    <p class="sub fs" style="animation-delay:.3s">On t'envoie un lien par email pour choisir un nouveau mot de passe. Tu auras ensuite besoin de ta phrase de récupération pour redéchiffrer tes souvenirs.</p>
    <div class="free-text-wrap fs" style="animation-delay:.4s"><input type="text" id="forgot-email" placeholder="Email"></div>
    <p class="form-error" id="forgot-error"></p>
    <button class="sel-add fs" id="forgot-submit" style="animation-delay:.5s;">Envoyer le lien</button>
  `;
  document.body.classList.add('hide-r');
  const errEl = s.querySelector('#forgot-error');
  const submit = async ()=>{
    const email = s.querySelector('#forgot-email').value.trim();
    if(!email){ errEl.textContent = 'Email requis.'; return; }
    errEl.textContent = 'Envoi...';
    try{
      await requestPasswordReset(email);
      s.innerHTML = `<h2 class="instruction fs">Vérifie ta boîte mail</h2><p class="sub fs" style="animation-delay:.3s">Clique sur le lien reçu par email pour choisir un nouveau mot de passe.</p>`;
    }catch(e){ errEl.textContent = translateAuthError(e); }
  };
  s.querySelector('#forgot-submit').addEventListener('click', submit);
  forwardAction = submit;
}

function renderSetNewPasswordAfterRecovery(){
  const s = stageBase();
  s.innerHTML = `
    <h2 class="instruction fs">Choisir un nouveau mot de passe</h2>
    <p class="sub fs" style="animation-delay:.3s">Entre ta phrase de récupération pour redéchiffrer tes souvenirs, et le nouveau mot de passe que tu veux utiliser.</p>
    <div class="free-text-wrap fs" style="animation-delay:.4s"><input type="text" id="rec-phrase" placeholder="Phrase de récupération"></div>
    <div class="free-text-wrap fs" style="animation-delay:.5s"><input type="password" id="rec-newpw" placeholder="Nouveau mot de passe"></div>
    <p class="form-error" id="rec-error"></p>
    <button class="sel-add fs" id="rec-submit" style="animation-delay:.6s;">Valider</button>
  `;
  document.body.classList.add('hide-l','hide-r');
  const errEl = s.querySelector('#rec-error');
  const submit = async ()=>{
    const phrase = s.querySelector('#rec-phrase').value.trim();
    const newPw = s.querySelector('#rec-newpw').value;
    if(!phrase || !newPw){ errEl.textContent = 'Les deux champs sont requis.'; return; }
    errEl.textContent = 'Un instant...';
    try{
      await completeRecovery(phrase, newPw);
      session=null; history=[]; currentPhase=null;
      goTo('home', renderHome);
    }catch(e){ errEl.textContent = translateAuthError(e); }
  };
  s.querySelector('#rec-submit').addEventListener('click', submit);
  forwardAction = submit;
}

function renderSyncChoice(row){
  const s = stageBase();
  s.innerHTML = `
    <h2 class="instruction fs">Des souvenirs existent aux deux endroits</h2>
    <p class="sub fs" style="animation-delay:.3s">Cet appareil a déjà des souvenirs en local, et ton compte en a aussi. Lequel veux-tu garder ? L'autre sera remplacé.</p>
    <div class="fs" style="animation-delay:.5s; display:flex; gap:12px; justify-content:center; margin-top:10px;">
      <button class="sel-add" id="sync-local">Garder ceux de cet appareil</button>
      <button class="sel-add" id="sync-cloud">Garder ceux du compte</button>
    </div>
  `;
  document.body.classList.add('hide-l','hide-r');
  s.querySelector('#sync-local').addEventListener('click', async ()=>{
    await vaultResolveKeepLocal();
    session=null; history=[]; currentPhase=null;
    goTo('home', renderHome);
  });
  s.querySelector('#sync-cloud').addEventListener('click', async ()=>{
    await vaultResolveUseCloud(row);
    session=null; history=[]; currentPhase=null;
    goTo('home', renderHome);
  });
}

/* boot : affichage immédiat de l'écran (l'accueil, ou le dernier écran "sûr") */
(function(){
  const restored = restorableTargetForPhase(sessionStorage.getItem(SS_LAST_PHASE));
  goTo(restored ? restored.phase : 'home', restored ? restored.fn : renderHome);
})();
function renderPhase(phase){ }
</script>
