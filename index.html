<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E181E">
<title>SoloEMDR</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    color-scheme: dark;
    --bg:#0E181E; --bg-soft:#16242C; --surface:#18272F; --ink:#E2DED4; --ink-soft:#97A5AB;
    --teal:#3E8582; --teal-deep:#86CBC5; --clay:#C9825F; --clay-soft:#D9A98B;
    --line:#2B3E47; --dusk:#0F1E27; --dusk-2:#16303B;
    --bg-violet:#14121F; --bg-soft-violet:#1B1830; --teal-soft:#1E3B3B; --folder-neutral:#1F313A;
    --aurora-1:#4C8B88; --aurora-2:#E7A97C; --aurora-3:#B9A6D9; --aurora-4:#7FB0AC;
    --font-display: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:linear-gradient(120deg,var(--bg) 0%,var(--bg-soft) 50%,var(--bg) 100%); background-size:220% 220%;
    color:var(--ink); font-family:var(--font-body); overflow:hidden; animation:tide 40s ease-in-out infinite; }
  body.phase-positive{ background-image:linear-gradient(120deg,var(--bg-violet) 0%,var(--bg-soft-violet) 50%,var(--bg-violet) 100%); }
  @media (prefers-reduced-motion: reduce){ body{ animation:none; } }
  body.stage-dark{ animation:none; }
  @keyframes tide{ 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
  #app{ height:100vh; width:100vw; position:relative; display:flex; flex-direction:column; }

  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .fs{ opacity:0; animation:fadeIn 0.9s ease forwards; }

  .icon-btn{ position:fixed; top:14px; z-index:60; background:none; border:none; cursor:pointer; opacity:.75; padding:6px; color:var(--ink); }
  .icon-btn:hover{ opacity:1; }
  .icon-btn svg{ display:block; }
  body.stage-dark .icon-btn{ color:#EFE8DA; }
  #homeIcon{ left:14px; }
  #libraryIcon{ left:56px; }
  #embodimentIcon{ left:98px; }
  #sosIcon{ left:140px; }
  #rulesIcon{ left:182px; }
  #groupchatIcon{ left:224px; }
  #recentLibraryIcon{ left:266px; }
  #settingsIcon{ left:320px; display:none; }
  body.stage-dark #settingsIcon{ display:block; }
  #barDivider{ position:fixed; top:18px; left:309px; width:1px; height:24px; background:#EFE8DA; opacity:.28; z-index:60; display:none; pointer-events:none; }
  body.stage-dark #barDivider{ display:block; }
  #musicIcon{ left:362px; display:none; }
  body.stage-dark.music-ctx #musicIcon{ display:block; }
  body.music-on #musicIcon{ color:var(--teal); opacity:1; }
  body.no-rtep #recentLibraryIcon{ display:none; }
  body.no-rtep #settingsIcon{ left:278px; }
  body.no-rtep #barDivider{ left:267px; }
  body.no-rtep #musicIcon{ left:320px; }

  .account-wrap{ position:fixed; top:14px; right:14px; z-index:60; }
  .account-wrap #accountIcon{ position:static; }
  .conn-dot{ position:absolute; top:2px; right:2px; width:8px; height:8px; border-radius:50%; background:#b8b0a0; border:1.5px solid var(--bg,#fff); }
  .conn-dot.ok{ background:#5f9e7a; }
  .conn-dot.err{ background:#c0554a; }
  body.stage-dark .conn-dot{ border-color:var(--dusk,#0b0b0d); }
  #account-panel{ position:absolute; top:34px; right:-6px; width:220px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.12); display:none; text-align:left; }
  #account-panel.open{ display:block; }
  #account-panel .sub{ margin:0 0 10px; font-size:12.5px; max-width:none; }
  #account-panel button{ width:100%; margin-top:0; }
  #account-panel button + button{ margin-top:8px; }
  .sync-diag{ margin:6px 0 10px; } .sync-diag button{ width:100%; margin-bottom:4px; }

  #settings-panel{ position:fixed; top:56px; left:320px; z-index:60; width:290px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,0.12); display:none; }
  #settings-panel.open{ display:block; }
  #music-panel{ position:fixed; top:56px; left:362px; z-index:60; width:310px; max-width:calc(100vw - 24px); background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,0.3); display:none; text-align:left; }
  body.no-rtep #music-panel{ left:320px; }
  #music-panel.open{ display:block; }
  body:not(.stage-dark) #music-panel, body:not(.music-ctx) #music-panel{ display:none; }
  #music-panel h3, .music-box-title{ font-size:13px; margin:0 0 10px; }
  .music-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .music-row{ display:flex; align-items:center; gap:8px; }
  .music-row.missing .music-name{ opacity:.55; }
  .music-name{ flex:1; min-width:0; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .music-name em{ font-style:normal; font-size:11.5px; }
  .music-play, .music-del, .music-add, .music-stop{ font-size:12.5px; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg-soft); color:var(--ink); cursor:pointer; }
  .music-play{ width:34px; padding:6px 0; }
  .music-play:disabled, .music-add:disabled, .music-stop:disabled{ opacity:.4; cursor:default; }
  .music-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .music-note{ font-size:12px; margin:8px 0 0; color:var(--ink-soft); min-height:1em; }
  #settings-panel h3{ font-size:13px; margin:0 0 10px; }
  .control-group{ margin-bottom:12px; }
  .control-group label{ font-size:12.5px; color:var(--ink-soft); display:block; margin-bottom:4px; }
  select, textarea, input[type=text], input[type=password]{ width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    font-family:var(--font-body); font-size:13.5px; background:var(--surface); color:var(--ink); }
  textarea{ resize:vertical; min-height:70px; }
  input[type=range]{ width:100%; accent-color:var(--teal); }

  .chev{ position:fixed; top:50%; transform:translateY(-50%); z-index:40; background:none; border:none;
    font-size:28px; color:var(--ink-soft); opacity:.28; cursor:pointer; padding:14px; }
  .chev:hover{ opacity:.7; }
  #chevL{ left:2px; } #chevR{ right:2px; }
  body.hide-r #chevR{ display:none; }
  body.hide-l #chevL{ display:none; }

  #stage-wrap{ flex:1; position:relative; overflow:hidden; }
  #stage{ height:100%; width:100%; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px; overflow-y:auto; }
  .aurora-wrap{ position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .aurora-blob{ position:absolute; border-radius:50%; filter:blur(min(9vw,70px)); opacity:.28;
    animation:auroraFloat ease-in-out infinite alternate; }
  @keyframes auroraFloat{ from{ transform:translate(0,0) scale(1) rotate(0deg); } to{ transform:translate(var(--dx,40px), var(--dy,30px)) scale(var(--sc,1.1)) rotate(6deg); } }
  @media (prefers-reduced-motion: reduce){ .aurora-blob{ animation:none; } }
  .home-fg{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; }
  #stage h2.instruction{ font-family:var(--font-display); font-weight:600; font-size:clamp(21px,3vw,30px); margin:0 0 6px; max-width:640px; }
  #stage p.sub{ color:var(--ink-soft); font-size:14.5px; margin:0 0 22px; max-width:540px; }

  .breathe-circle{ width:140px; height:140px; border-radius:50%; background:radial-gradient(circle at 35% 35%, var(--clay-soft), var(--teal));
    animation:breathe 6s ease-in-out infinite; margin-bottom:26px; }
  @keyframes breathe{ 0%,100%{transform:scale(0.85);opacity:.85;} 50%{transform:scale(1.05);opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .breathe-circle{ animation:none; } }

  .free-text-wrap{ width:min(560px,90%); margin-top:6px; }
  .free-text-wrap textarea{ min-height:90px; font-size:15px; }
  .check-row{ display:flex; align-items:center; gap:8px; justify-content:center; margin:10px 0 4px; font-size:13.5px; color:var(--ink-soft); }

  .scale-wrap{ width:min(560px,90%); margin-top:6px; }
  .scale-label{ font-family:var(--font-display); font-size:22px; font-weight:600; color:var(--teal-deep); margin:4px 0 14px; min-height:28px; }
  .scale-numbers{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
  .scale-num{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    font-family:var(--font-body); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .scale-num:hover{ border-color:var(--teal); }
  .scale-num.selected{ background:var(--teal); border-color:var(--teal); color:white; }

  .priority-picker{ display:flex; gap:7px; }
  .priority-btn{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    font-family:var(--font-body); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .priority-btn:hover{ border-color:var(--teal); }
  .priority-btn.selected{ background:var(--teal); border-color:var(--teal); color:white; }
  .priority-btn:disabled{ cursor:default; opacity:.55; }
  .priority-btn:disabled:hover{ border-color:var(--line); }

  .hint-line{ font-size:12.5px; color:var(--ink-soft); margin-top:26px; }

  #bls-stage{ height:100%; width:100%; background:radial-gradient(ellipse at center, var(--dusk-2), var(--dusk)); position:relative; display:none; }
  #bls-inner{ height:100%; width:100%; position:relative; transition:opacity .35s ease; }
  #bls-dot{ position:absolute; width:34px; height:34px; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); will-change:transform;
    border:1px solid rgba(0,0,0,0.12); }
  #bls-keep{ position:absolute; top:11%; left:50%; transform:translateX(-50%); width:min(680px,90%); max-height:33%; overflow:hidden; text-align:center; color:#EFE8DA; opacity:.82; font-family:var(--font-display); line-height:1.45; pointer-events:none; }
  #bls-instruction{ position:absolute; top:16%; left:50%; transform:translate(-50%,0); color:#EFE8DA; font-family:var(--font-display);
    font-size:19px; text-align:center; width:80%; max-width:520px; transition:opacity .5s ease; }
  .dark-form{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px; }
  .dark-form h2{ font-family:var(--font-display); color:#EFE8DA; font-size:22px; margin:0 0 18px; max-width:560px; }
  .dark-form textarea{ background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); color:#EFE8DA; }
  .dark-form textarea::placeholder{ color:rgba(239,232,218,0.4); }
  .dark-form .check-row{ color:rgba(239,232,218,0.6); }

  .countdown-num{ font-family:var(--font-display); font-size:64px; color:var(--teal-deep); }

  /* selection screen */
  #stage.select-view{ align-items:center; overflow:hidden; }
  #stage.select-view h2.instruction{ flex:0 0 auto; width:100%; margin:0 0 20px; }
  .sel-scroll{ flex:1 1 auto; min-height:0; width:100%; overflow-y:auto; display:flex; flex-direction:column; align-items:center; padding-bottom:12px; }
  .sel-list{ width:min(560px,92%); display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .sel-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px; text-align:left; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; }
  .sel-card:hover{ border-color:var(--teal); }
  .sel-card .t{ font-size:14.5px; font-weight:600; }
  .sel-card .actions{ display:flex; gap:6px; }
  .pill-btn, .sel-card .actions button, .lib-toolbar-actions button, .lib-add-top, #account-panel button{
    font-size:12.5px; padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg-soft);
    color:var(--ink); font-family:var(--font-body); cursor:pointer; white-space:nowrap; transition:background-color .15s ease; }
  .pill-btn:hover, .sel-card .actions button:hover, .lib-toolbar-actions button:hover, .lib-add-top:hover, #account-panel button:hover{
    background-color:color-mix(in srgb, var(--bg-soft), white 9%); }
  .sel-alt{ margin-top:18px; font-size:13.5px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; background:none; border:none; }
  .lib-toolbar-actions .toggle-folders-btn{ font-size:11px; padding:0; border:none; background:none; color:var(--ink-soft); text-decoration:underline; }
  .lib-toolbar-actions .toggle-folders-btn:hover{ color:var(--ink); background:none; }
  .sel-add{ margin-top:6px; font-size:13px; color:var(--teal-deep); background:none; border:none; cursor:pointer; }

  .sel-card.has-status{ display:flex; flex-direction:column; align-items:stretch; }
  .sel-card-top{ display:flex; justify-content:space-between; align-items:center; width:100%; }
  .sel-card-done{ opacity:.5; }

  /* collapsible picker rows: grid-rows trick so height always matches content, never clips */
  .status-picker, .folder-picker, .priority-card-picker, .sessions-history, .trauma-quick-actions, .linked-traumas{ display:grid; grid-template-rows:0fr; opacity:0; margin-top:0; padding-top:0;
    border-top:1px solid transparent;
    transition:grid-template-rows .25s ease, opacity .2s ease, margin-top .25s ease, padding-top .25s ease, border-color .25s ease; }
  .status-picker.open, .folder-picker.open, .priority-card-picker.open, .sessions-history.open, .trauma-quick-actions.open, .linked-traumas.open{ grid-template-rows:1fr; opacity:1; margin-top:10px; padding-top:10px; border-top-color:var(--line); }
  .status-picker > div, .folder-picker > div, .priority-card-picker > div, .sessions-history > div, .trauma-quick-actions > div, .linked-traumas > div{ overflow:hidden; min-height:0; display:flex; gap:8px; flex-wrap:wrap; }
  .sessions-history > div, .linked-traumas > div{ flex-direction:column; gap:6px; }
  .sessions-history-title{ font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); }
  .linked-traumas-names{ font-size:12.5px; color:var(--ink); line-height:1.5; }
  .session-entry{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12.5px; cursor:pointer; width:100%; }
  .session-entry-main{ display:flex; gap:10px; flex-wrap:wrap; }
  .session-entry .session-date{ color:var(--ink-soft); white-space:nowrap; }
  .session-chevron{ color:var(--ink-soft); transition:transform .15s ease; flex:0 0 auto; }
  .session-entry.open .session-chevron{ transform:rotate(90deg); }
  .session-detail{ display:none; flex-direction:column; gap:4px; width:100%; margin:2px 0 6px; padding:6px 0 0 10px; border-left:2px solid var(--line); font-size:11.5px; color:var(--ink-soft); }
  .session-detail.open{ display:flex; }
  .session-detail-row{ display:flex; justify-content:space-between; gap:10px; }
  .session-detail-row span:first-child{ font-weight:600; color:var(--ink); flex:0 0 auto; }
  .session-detail-row span:last-child{ text-align:right; }
  .status-opt{ flex:1; padding:7px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg-soft);
    color:var(--ink); font-family:var(--font-body); font-size:12.5px; cursor:pointer; }
  .status-opt:hover{ border-color:var(--teal); }
  .status-opt.selected{ background:var(--teal); border-color:var(--teal); color:white; }
  .folder-opt{ padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg-soft);
    color:var(--ink); font-family:var(--font-body); font-size:12.5px; cursor:pointer; }
  .folder-opt:hover{ border-color:var(--clay); }
  .folder-opt.selected{ background:var(--clay); border-color:var(--clay); color:white; }

  /* toolbar: search + sort + add actions */
  .lib-toolbar{ width:min(920px,96%); flex:0 0 auto; margin:0 0 26px; display:flex; align-items:center; justify-content:space-between; gap:28px; flex-wrap:wrap;
    position:relative; z-index:5; }
  .lib-toolbar input[type=text]{ flex:1 1 240px; max-width:380px; width:auto; font-size:13.5px; padding:8px 16px; border-radius:20px;
    border:1px solid var(--line); background:var(--bg-soft); color:var(--ink); }
  .lib-toolbar input::placeholder{ color:var(--ink-soft); }
  .lib-toolbar input:hover{ border-color:var(--teal); }
  .lib-toolbar input:focus{ outline:none; border-color:var(--teal); background:var(--surface); }
  .lib-toolbar-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .toolbar-icon-btn{ background:var(--bg-soft); border:1px solid var(--line); border-radius:8px; padding:8px; cursor:pointer;
    color:var(--ink); display:flex; align-items:center; justify-content:center; transition:background-color .15s ease; }
  .toolbar-icon-btn:hover{ background-color:color-mix(in srgb, var(--bg-soft), white 9%); }
  .toolbar-icon-btn svg{ display:block; }
  .lib-sort-wrap{ position:relative; }
  .lib-sort-panel{ position:absolute; top:44px; left:0; z-index:40; width:210px; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:8px; box-shadow:0 10px 30px rgba(0,0,0,.12); display:none; text-align:left; }
  .lib-sort-panel.open{ display:block; }
  .lib-sort-panel button{ display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; text-align:left;
    padding:8px 10px; border-radius:8px; border:none; background:none; color:var(--ink); font-family:var(--font-body); font-size:13px; cursor:pointer; }
  .lib-sort-panel button:hover{ background:var(--bg-soft); }
  .lib-sort-panel button.selected{ font-weight:600; color:var(--teal-deep); }
  .lib-sort-panel .sort-check{ opacity:0; flex:0 0 auto; }
  .lib-sort-panel button.selected .sort-check{ opacity:1; }
  .lib-sort-color-toggle{ display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; border-radius:8px;
    color:var(--ink); font-family:var(--font-body); font-size:13px; cursor:pointer; }
  .lib-sort-color-toggle:hover{ background:var(--bg-soft); }
  .lib-sort-color-toggle input{ cursor:pointer; }
  .lib-sort-divider{ height:1px; background:var(--line); margin:4px 6px; }

  .lib-add-top-wrap{ width:min(560px,92%); display:flex; justify-content:space-between; align-items:center; margin:0 0 12px; }

  /* folder grid */
  .folder-grid{ width:min(920px,96%); display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px; margin:0 0 24px; }
  .folder-tile{ position:relative; cursor:pointer; min-height:104px; border-radius:14px; padding:14px; text-align:left;
    background:var(--folder-neutral); display:flex; flex-direction:column; justify-content:flex-start; }
  .folder-tile.all-done{ background:var(--teal-soft); }
  .folder-tile.folder-colored{ filter:brightness(.82) saturate(.92); }
  .folder-name{ font-weight:600; font-size:14px; color:var(--ink); word-break:break-word; }
  .folder-count{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }
  .folder-actions{ position:absolute; bottom:8px; right:8px; display:flex; gap:4px; opacity:0; transition:opacity .15s ease; }
  .folder-tile:hover .folder-actions{ opacity:1; }
  .folder-actions button{ width:24px; height:24px; border-radius:50%; border:1px solid rgba(255,255,255,.12); background:rgba(14,24,30,.75);
    cursor:pointer; font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
  .folder-actions button:hover{ background:var(--surface); color:var(--ink); }

  body.no-rtep #settings-panel{ left:278px; }
  body:not(.stage-dark) #settings-panel{ display:none; }


  /* groupchat */
  #stage.gc-view{ padding:54px 0 0; justify-content:flex-start; align-items:stretch; overflow:hidden; text-align:left; }
  .gc-wrap{ flex:1 1 auto; min-height:0; width:min(780px,100%); margin:0 auto; display:flex; flex-direction:column; padding:0 12px; }
  .gc-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 2px 8px; }
  .gc-head h2{ margin:0; font-family:var(--font-display); font-size:22px; font-weight:600; }
  .gc-head-actions{ display:flex; gap:6px; }
  .gc-head-actions button, .gc-search button, .gc-more, .gc-goto{ background:var(--bg-soft); border:1px solid var(--line); color:var(--ink); border-radius:10px; cursor:pointer; font-size:12.5px; padding:6px 10px; display:inline-flex; align-items:center; gap:6px; }
  .gc-head-actions button:hover, .gc-more:hover{ background:color-mix(in srgb, var(--bg-soft), white 9%); }
  .gc-search{ display:flex; align-items:center; gap:8px; padding:0 0 8px; }
  .gc-search input{ flex:1; background:var(--bg-soft); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:8px 12px; font-size:14px; font-family:inherit; }
  #gc-count{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .gc-thread{ flex:1 1 auto; min-height:0; overflow-y:auto; padding:40px 2px 10px; display:flex; flex-direction:column; }
  .gc-empty{ margin:auto; max-width:380px; text-align:center; color:var(--ink-soft); font-size:14px; line-height:1.5; }
  .gc-more{ align-self:center; margin:4px 0 10px; }
  .gc-day{ text-align:center; margin:14px 0 8px; } .gc-day span{ font-size:11.5px; color:var(--ink-soft); background:var(--bg-soft); border-radius:10px; padding:3px 10px; text-transform:capitalize; }

const LS_GC = 'soloemdr_groupchat';
function gcFix(g){
  if(!g || !Array.isArray(g.parts) || !Array.isArray(g.messages)) return null;
  g.parts.forEach(p=>{
    if(p.description && !p.role) p.role = p.description; /* ancienne « description » → « Rôle » */
    delete p.description;
    if(typeof p.role!=='string') p.role = '';
    if(!Array.isArray(p.drifts)) p.drifts = [];
  });
  return g;
}
function loadGC(){ try{ const o = gcFix(JSON.parse(localStorage.getItem(LS_GC))); if(o) return o; }catch(e){} return {parts:[], messages:[]}; }
function saveGC(){ localStorage.setItem(LS_GC, JSON.stringify(groupchat)); scheduleSync(); }

/* ================= MUSIQUE (MP3 par souvenir) =================
   Les fichiers sont gardés sur CET appareil (IndexedDB) : trop lourds pour le coffre chiffré.
   Seuls leurs noms sont rattachés au souvenir (t.music = [{id,name,size}]) et se synchronisent ;
   sur un autre appareil ils apparaissent comme « absents » tant qu'on ne les y a pas importés. */
const MUSIC_MAX = 5;
const MUSIC_DB = 'soloemdr_music';
function musicDb(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open(MUSIC_DB, 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('files', {keyPath:'id'});
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function musicTx(mode, fn){
  const db = await musicDb();
  return new Promise((res, rej)=>{
    const tx = db.transaction('files', mode); let out;
    try{ out = fn(tx.objectStore('files')); }catch(e){ rej(e); return; }
    tx.oncomplete = ()=>{ db.close(); res(out && 'result' in out ? out.result : undefined); };
    tx.onerror = tx.onabort = ()=>{ db.close(); rej(tx.error); };
  });
}
const musicPut = (id, blob)=> musicTx('readwrite', st=> st.put({id, blob}));
const musicDel = (id)=> musicTx('readwrite', st=> st.delete(id)).catch(()=>{});
async function musicGet(id){ const r = await musicTx('readonly', st=> st.get(id)); return r ? r.blob : null; }
async function musicHas(ids){
  const out = {};
  try{ await Promise.all(ids.map(async id=>{ out[id] = !!(await musicGet(id)); })); }catch(e){ ids.forEach(id=> out[id] = false); }
  return out;
}

const music = { el:null, id:null, url:null, loop:true, redraw:null };
function musicEl(){
  if(!music.el){
    music.el = new Audio(); music.el.preload = 'auto';
    ['play','pause','ended'].forEach(ev=> music.el.addEventListener(ev, ()=>{ updateMusicBadge(); if(music.redraw) music.redraw(); }));
  }
  return music.el;
}
function musicPlaying(){ return !!(music.el && music.id && !music.el.paused); }
function musicVolume(){ return typeof settings.musicVolume==='number' ? Math.max(0, Math.min(1, settings.musicVolume)) : 0.6; }
function updateMusicBadge(){ document.body.classList.toggle('music-on', musicPlaying()); }
async function musicPlay(item){
  const el = musicEl();
  if(music.id===item.id && el.src){ await el.play(); return; }
  const blob = await musicGet(item.id);
  if(!blob) throw new Error('absent');
  if(music.url) URL.revokeObjectURL(music.url);
  music.url = URL.createObjectURL(blob);
  el.src = music.url; el.loop = music.loop; el.volume = musicVolume();
  music.id = item.id;
  await el.play();
}
function musicStop(){
  if(music.el){ music.el.pause(); music.el.removeAttribute('src'); try{ music.el.load(); }catch(e){} }
  if(music.url){ URL.revokeObjectURL(music.url); music.url = null; }
  music.id = null;
  updateMusicBadge();
  if(music.redraw) music.redraw();
}

/* Liste + commandes de lecture d'un souvenir, dans n'importe quel conteneur */
function musicMount(box, getT, save, onChange){
  let notice = '';
  async function draw(){
    const t = getT();
    if(!box.isConnected){ if(music.redraw===draw) music.redraw = null; return; }
    if(!t){ box.innerHTML = '<p class="emb-empty">Aucun souvenir.</p>'; return; }
    const list = Array.isArray(t.music) ? t.music : [];
    const have = await musicHas(list.map(m=> m.id));
    const playing = musicPlaying();
    box.innerHTML = `
      <div class="music-list">${list.map(m=>{
        const ok = have[m.id], on = ok && playing && music.id===m.id;
        return `<div class="music-row${ok?'':' missing'}">
          <button type="button" class="music-play" data-play="${m.id}" ${ok?'':'disabled'} title="${on?'Pause':'Lire'}">${on?'❚❚':'▶'}</button>
          <span class="music-name" title="${escapeHtml(m.name)}">${escapeHtml(m.name)}${ok?'':' <em>(absent de cet appareil)</em>'}</span>
          <button type="button" class="music-del" data-del="${m.id}" title="Retirer">✕</button></div>`;
      }).join('') || '<p class="emb-empty">Aucun fichier. Ajoutez jusqu’à 5 MP3 pour ce souvenir.</p>'}</div>
      <div class="control-group"><label>Volume : <span class="music-vol-val">${Math.round(musicVolume()*100)}</span> %</label>
        <input type="range" class="music-vol" min="0" max="100" value="${Math.round(musicVolume()*100)}"></div>
      <div class="control-group"><label><input type="checkbox" class="music-loop" ${music.loop?'checked':''}> Lire en boucle</label></div>
      <div class="music-actions">
        <button type="button" class="music-add" ${list.length>=MUSIC_MAX?'disabled':''}>+ Ajouter un MP3 (${list.length}/${MUSIC_MAX})</button>
        <button type="button" class="music-stop" ${music.id?'':'disabled'}>Couper</button>
      </div>
      <input type="file" class="music-file" accept=".mp3,audio/mpeg" multiple hidden>
      <p class="sub music-note">${notice}</p>`;
    box.querySelectorAll('[data-play]').forEach(b=> b.addEventListener('click', async ()=>{
      const item = list.find(x=> x.id===b.dataset.play); if(!item) return;
      try{
        if(music.id===item.id && musicPlaying()) musicEl().pause();
        else{ if(music.id && music.id!==item.id) musicStop(); await musicPlay(item); }
        notice = '';
      }catch(e){ notice = 'Lecture impossible (fichier absent ou illisible).'; }
      draw();
    }));
    box.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', async ()=>{
      if(!b.classList.contains('armed')){
        b.classList.add('armed'); b.textContent = 'Retirer ?';
        setTimeout(()=>{ if(b.isConnected){ b.classList.remove('armed'); b.textContent = '✕'; } }, 3000);
        return;
      }
      if(music.id===b.dataset.del) musicStop();
      await musicDel(b.dataset.del);
      t.music = list.filter(x=> x.id!==b.dataset.del);
      save(); if(onChange) onChange(); notice = ''; draw();
    }));
    const vol = box.querySelector('.music-vol');
    vol.addEventListener('input', ()=>{
      settings.musicVolume = (+vol.value)/100; box.querySelector('.music-vol-val').textContent = vol.value;
      if(music.el) music.el.volume = musicVolume();
      saveSettings();
    });
    box.querySelector('.music-loop').addEventListener('change', e=>{ music.loop = e.target.checked; if(music.el) music.el.loop = music.loop; });
    box.querySelector('.music-stop').addEventListener('click', ()=>{ musicStop(); });
    const input = box.querySelector('.music-file');
    box.querySelector('.music-add').addEventListener('click', ()=> input.click());
    input.addEventListener('change', async ()=>{
      const files = [...input.files]; input.value = '';
      t.music = Array.isArray(t.music) ? t.music : [];
      let added = 0, skipped = [];
      for(const f of files){
        if(t.music.length >= MUSIC_MAX){ skipped.push('limite de '+MUSIC_MAX+' fichiers atteinte'); break; }
        if(!/\.mp3$/i.test(f.name) && f.type!=='audio/mpeg'){ skipped.push('« '+f.name+' » n’est pas un MP3'); continue; }
        const id = 'm_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
        try{ await musicPut(id, f); }catch(e){ skipped.push('« '+f.name+' » n’a pas pu être enregistré (espace insuffisant ?)'); continue; }
        t.music.push({id, name:f.name.replace(/\.mp3$/i,''), size:f.size}); added++;
      }
      if(added){ save(); if(onChange) onChange(); try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }
      notice = skipped.length ? 'Non ajouté : '+skipped.join(' ; ')+'.' : '';
      draw();
    });
  }
  music.redraw = draw;
  draw();
}

/* Depuis la fiche du souvenir (bibliothèque) */
function openMusicModal(t, save, onChange){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-panel" role="dialog" aria-label="Musique">
      <div class="modal-head"><h3>Musique — ${escapeHtml(t.title)}</h3></div>
      <div class="modal-body" id="music-modal-box"></div>
      <div class="modal-foot"><button type="button" id="music-modal-done" class="primary">Fermer</button></div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=>{ musicStop(); music.redraw = null; overlay.remove(); if(onChange) onChange(); };
  overlay.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#music-modal-done').addEventListener('click', close);
  musicMount(overlay.querySelector('#music-modal-box'), ()=> t, save, null);
}

/* ==================================================================
   Cloud sync: zero-knowledge encrypted vault (Supabase + Web Crypto)
   The DEK (data encryption key) is generated once per account, then
   wrapped once with a key derived from the password and once with a
   key derived from the recovery phrase. Only the wrapped copies and
   the encrypted vault ever reach the server — the DEK itself, the
   password and the recovery phrase never leave this browser.
   ================================================================== */

const cryptoEnc = new TextEncoder();
const cryptoDec = new TextDecoder();
/* par morceaux : `String.fromCharCode(...tout)` dépasse la pile d'appels (~65 000 octets sur Safari mobile)
   dès que le coffre grossit, ce qui bloquait toute synchronisation */
function b64enc(buf){
  const b = new Uint8Array(buf); let s = '';
  for(let i=0; i<b.length; i+=0x4000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x4000));
  return btoa(s);
}
function b64dec(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }
function randBytes(n){ return crypto.getRandomValues(new Uint8Array(n)); }

async function deriveKekFromPassphrase(passphrase, saltB64){
  const salt = b64dec(saltB64);
  const baseKey = await crypto.subtle.importKey('raw', cryptoEnc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'},
    baseKey, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']
  );
}
async function generateDEK(){ return crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt','decrypt']); }
async function wrapDEK(dek, kek){
  const raw = await crypto.subtle.exportKey('raw', dek);
  const iv = randBytes(12);
  const wrapped = await crypto.subtle.encrypt({name:'AES-GCM', iv}, kek, raw);
  return {ivB64:b64enc(iv), wrappedB64:b64enc(wrapped)};
}
async function unwrapDEK(ivB64, wrappedB64, kek){
  const raw = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64dec(ivB64)}, kek, b64dec(wrappedB64));
  return crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, true, ['encrypt','decrypt']);
}
async function encryptWithDEK(dek, plaintextStr){
  const iv = randBytes(12);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, dek, cryptoEnc.encode(plaintextStr));
  return {ivB64:b64enc(iv), ctB64:b64enc(ct)};
}
async function decryptWithDEK(dek, ivB64, ctB64){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64dec(ivB64)}, dek, b64dec(ctB64));
  return cryptoDec.decode(pt);
}
function generateRecoveryPhrase(){
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = randBytes(24);
  let out = '';
  for(let i=0;i<bytes.length;i++){ out += alphabet[bytes[i] % alphabet.length]; }
  return out.match(/.{1,4}/g).join('-');
}
function normalizeRecoveryPhrase(s){ return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

/* ---------- cache DEK entre rechargements (IndexedDB, clé non-exportable) ----------
   Le DEK en mémoire (vault.dek) est perdu à chaque rechargement de page ; sans ce
   cache, ça revient à se retrouver "déconnecté" silencieusement à chaque fois,
   avec la synchronisation qui s'arrête sans aucun avertissement. Une copie
   non-exportable (utilisable pour chiffrer/déchiffrer, mais jamais lisible en
   clair) est donc gardée dans IndexedDB, et re-validée contre la session
   Supabase réelle à chaque démarrage avant d'être réutilisée. */
const IDB_NAME = 'soloemdr_session', IDB_STORE = 'dek';
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(IDB_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function cacheSessionDEK(dek, userId, email){
  try{
    const raw = await crypto.subtle.exportKey('raw', dek);
    const lockedDek = await crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
    const db = await idbOpen();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put({dek:lockedDek, userId, email}, 'current');
      tx.oncomplete = resolve; tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){}
}
async function readCachedDEK(){
  try{
    const db = await idbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readonly');
      const req = tx.objectStore(IDB_STORE).get('current');
      req.onsuccess = ()=> resolve(req.result || null);
      req.onerror = ()=> reject(req.error);
    });
  }catch(e){ return null; }
}
async function clearSessionDEK(){
  try{
    const db = await idbOpen();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete('current');
      tx.oncomplete = resolve; tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){}
}
/* Essaie de restaurer une session déjà déverrouillée, sans redemander le mot de
   passe — seulement si la session Supabase sous-jacente est toujours valide et
   correspond bien au DEK mis en cache. */
const LS_LAST_RESTORE = 'soloemdr_last_restore';
function noteRestore(msg){ try{ localStorage.setItem(LS_LAST_RESTORE, JSON.stringify({at:Date.now(), msg})); }catch(e){} }
async function restoreVaultFromCache(){
  if(!supa) return false;
  const rec = await Promise.race([readCachedDEK(), new Promise(r=> setTimeout(()=> r(null), 3000))]);
  if(!rec){ noteRestore('aucune clé en cache sur cet appareil'); return false; }
  let res;
  try{
    res = await Promise.race([
      supa.auth.getSession(),
      new Promise(r=> setTimeout(()=> r({data:{session:null}, error:{transient:true, message:'délai dépassé'}}), 8000))
    ]);
  }catch(e){ res = {data:{session:null}, error:e}; }
  const session = res && res.data && res.data.session;
  if(session){
    if(session.user.id !== rec.userId){ await clearSessionDEK(); noteRestore('la session appartient à un autre compte'); return false; }
    try{ localStorage.removeItem(LS_LAST_RESTORE); }catch(e){}
  } else {
    const err = res && res.error;
    /* un raté réseau / serveur qui se réveille n'est pas une vraie déconnexion : on garde la clé */
    const transient = !!err && (err.transient || err.name==='AuthRetryableFetchError' || (typeof err.status==='number' && (err.status===0 || err.status>=500)));
    if(!transient){
      await clearSessionDEK();
      noteRestore('session expirée ou révoquée' + (err && err.message ? ' (' + err.message + ')' : ''));
      return false;
    }
    noteRestore('réseau indisponible au démarrage : session conservée, synchronisation reprise dès que possible');
  }
  vault.dek = rec.dek; vault.userId = rec.userId; vault.email = rec.email;
  return true;
}

let vault = { dek:null, userId:null, email:null };
const LS_SYNCED = 'soloemdr_synced_before';
function vaultReady(){ return !!(supa && vault.dek && vault.userId); }
let lastSyncError = false, lastSyncErrorMsg = '';
const APP_BUILD = 'sync-v2 · 18 nov.';

let syncTimer = null;
const LS_DIRTY = 'soloemdr_dirty', LS_SEEN = 'soloemdr_cloud_seen';
let dirtyVer = 0;
function scheduleSync(){
  if(vault.userId){ dirtyVer++; try{ localStorage.setItem(LS_DIRTY,'1'); }catch(e){} } /* changement pas encore envoyé */
  if(!vaultReady()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>{ syncTimer = null; vaultPush(); }, 1000);
}
/* Un changement peut rester "en attente" jusqu'à 1s (debounce) avant d'être
   réellement envoyé — si l'onglet se ferme ou passe en arrière-plan pendant
   cette fenêtre, on force l'envoi immédiatement plutôt que de le perdre. */
function flushPendingSync(){
  if(syncTimer){ clearTimeout(syncTimer); syncTimer = null; vaultPush(); }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushPendingSync(); });
window.addEventListener('pagehide', flushPendingSync);
/* ---- synchronisation entre appareils ----
   Avant, un appareil n'allait jamais relire le coffre après la connexion : il ne faisait que
   l'écraser avec sa propre version. On suit désormais la dernière version du coffre vue par cet
   appareil (LS_SEEN) ; si un autre appareil a écrit entre-temps, on la relit — en la remplaçant si
   cet appareil n'a rien en attente, en FUSIONNANT (union par identifiant) sinon, jamais en écrasant. */
function seenMs(){ const v = localStorage.getItem(LS_SEEN); return v ? +v : null; }
function setSeen(iso){ try{ const t = Date.parse(iso); if(t) localStorage.setItem(LS_SEEN, String(t)); }catch(e){} }
function currentPayloadObj(){ return {traumas, folders, settings, recentTraumas, embodiment: embodimentItems, sosAffirmations, commandments: rulesItems, groupchat}; }
function mergeById(local, cloud){
  const key = x=> (x && x.id!==undefined) ? 'id:'+x.id : 'j:'+JSON.stringify(x);
  const out = Array.isArray(local) ? local.slice() : [], have = new Set(out.map(key));
  (Array.isArray(cloud) ? cloud : []).forEach(x=>{ if(!have.has(key(x))){ out.push(x); have.add(key(x)); } });
  return out;
}
function mergeCloudInto(c){
  traumas = mergeById(traumas, c.traumas); folders = mergeById(folders, c.folders); recentTraumas = mergeById(recentTraumas, c.recentTraumas);
  if(Array.isArray(c.embodiment)) embodimentItems = mergeById(embodimentItems, c.embodiment);
  if(Array.isArray(c.commandments)) rulesItems = mergeById(rulesItems, c.commandments);
  if(Array.isArray(c.sosAffirmations)) sosAffirmations = sosAffirmations.concat(c.sosAffirmations.filter(x=> !sosAffirmations.includes(x)));
  const cg = gcFix(c.groupchat);
  if(cg){
    groupchat.parts = mergeById(groupchat.parts, cg.parts);
    const byId = new Map(groupchat.messages.map(m=>[m.id, m]));
    cg.messages.forEach(m=>{
      const l = byId.get(m.id);
      if(!l){ groupchat.messages.push(m); byId.set(m.id, m); return; }
      if(Array.isArray(m.reactions)){
        const rs = (l.reactions = l.reactions || []);
        m.reactions.forEach(r=>{ if(!rs.some(x=>x.e===r.e && x.by===r.by)) rs.push(r); });
      }
    });
    groupchat.messages.sort((x,y)=> (x.ts||0)-(y.ts||0));
  }
  try{
    localStorage.setItem(LS_TRAUMAS, JSON.stringify(traumas)); localStorage.setItem(LS_FOLDERS, JSON.stringify(folders));
    localStorage.setItem(LS_RECENT_TRAUMAS, JSON.stringify(recentTraumas)); localStorage.setItem(LS_EMBODIMENT, JSON.stringify(embodimentItems));
    localStorage.setItem(LS_RULES, JSON.stringify(rulesItems)); localStorage.setItem(LS_SOS_AFF, JSON.stringify(sosAffirmations));
    localStorage.setItem(LS_GC, JSON.stringify(groupchat));
  }catch(e){}
}
async function vaultFetchHead(){
  const {data, error} = await supa.from('vaults').select('updated_at').eq('user_id', vault.userId).maybeSingle();
  if(error) throw error;
  return data;
}
async function vaultMergeFromCloud(forceMerge){
  const {data:row, error} = await supa.from('vaults').select('data_iv,ciphertext,updated_at').eq('user_id', vault.userId).maybeSingle();
  if(error) throw error;
  if(!row) return null;
  const seen = seenMs(), dirty = !!localStorage.getItem(LS_DIRTY);
  if(!forceMerge && seen!==null && !dirty) await vaultPull(row);
  else mergeCloudInto(JSON.parse(await decryptWithDEK(vault.dek, row.data_iv, row.ciphertext)));
  setSeen(row.updated_at);
  return row;
}
const SAFE_REFRESH = /^(home|library|embodiment|rules|groupchat|recentlibrary|folder_.*)$/;
function refreshAfterSync(){
  const a = document.activeElement;
  if(SAFE_REFRESH.test(currentPhase||'') && currentFn && !document.querySelector('.modal-overlay') && !(a && a.matches && a.matches('input,textarea'))){
    try{ currentFn(); }catch(e){}
  }
}
let syncInBusy = false;
async function vaultSyncIn(){
  if(!vaultReady() || syncInBusy || syncTimer) return false;
  syncInBusy = true;
  try{
    const head = await vaultFetchHead();
    if(!head) return false;
    const seen = seenMs();
    if(seen!==null && Date.parse(head.updated_at)===seen){ if(localStorage.getItem(LS_DIRTY)) scheduleSync(); return false; }
    const before = JSON.stringify(currentPayloadObj());
    const dirty = !!localStorage.getItem(LS_DIRTY);
    await vaultMergeFromCloud(false);
    if(dirty || seen===null) scheduleSync(); /* renvoie la version fusionnée */
    const changed = JSON.stringify(currentPayloadObj()) !== before;
    if(changed) refreshAfterSync();
    return changed;
  }catch(e){ return false; }
  finally{ syncInBusy = false; }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') vaultSyncIn(); });
window.addEventListener('focus', ()=>{ vaultSyncIn(); });
setInterval(()=>{ if(document.visibilityState==='visible') vaultSyncIn(); }, 60000);

async function vaultPush(){
  if(!vaultReady()) return;
  const v = dirtyVer;
  try{
    let done = false;
    for(let attempt=0; attempt<3 && !done; attempt++){
      const head = await vaultFetchHead();
      if(!head) throw new Error('coffre introuvable');
      let guard = head.updated_at;
      if(seenMs()===null || Date.parse(head.updated_at)!==seenMs()){
        /* un autre appareil a écrit depuis notre dernière lecture : on fusionne avant d'envoyer */
        const row = await vaultMergeFromCloud(true);
        if(row){ guard = row.updated_at; refreshAfterSync(); }
      }
      const {ivB64, ctB64} = await encryptWithDEK(vault.dek, JSON.stringify(currentPayloadObj()));
      const ts = new Date().toISOString();
      const upd = {data_iv:ivB64, ciphertext:ctB64, updated_at:ts};
      const {data, error} = await supa.from('vaults').update(upd).eq('user_id', vault.userId).eq('updated_at', guard).select('updated_at');
      if(error) throw error;
      if(data && data.length){ setSeen(ts); done = true; break; }
      /* 0 ligne : soit quelqu'un a écrit juste entre-temps (on recommence), soit le filtre n'a pas
         correspondu alors que rien n'a changé (on envoie alors sans condition) */
      const h2 = await vaultFetchHead();
      if(h2 && Date.parse(h2.updated_at)===Date.parse(guard)){
        const {error:e2} = await supa.from('vaults').update(upd).eq('user_id', vault.userId);
        if(e2) throw e2;
        setSeen(ts); done = true;
      }
    }
    if(!done) throw new Error('conflit de synchronisation');
    if(v===dirtyVer){ try{ localStorage.removeItem(LS_DIRTY); }catch(e){} }
    lastSyncError = false; lastSyncErrorMsg = '';
  }catch(e){
    lastSyncError = true;
    lastSyncErrorMsg = String((e && (e.message || e.details || e.code)) || e || 'erreur inconnue').slice(0,160);
  }
  updateConnDot();
}
async function vaultPull(row){
  const json = await decryptWithDEK(vault.dek, row.data_iv, row.ciphertext);
  const parsed = JSON.parse(json);
  traumas = parsed.traumas||[]; folders = parsed.folders||[];
  recentTraumas = parsed.recentTraumas||[];
  if(Array.isArray(parsed.embodiment)){ embodimentItems = parsed.embodiment; localStorage.setItem(LS_EMBODIMENT, JSON.stringify(embodimentItems)); }
  if(parsed.groupchat && Array.isArray(parsed.groupchat.parts) && Array.isArray(parsed.groupchat.messages)){ groupchat = gcFix(parsed.groupchat); localStorage.setItem(LS_GC, JSON.stringify(groupchat)); }
  if(Array.isArray(parsed.commandments)){ rulesItems = parsed.commandments; localStorage.setItem(LS_RULES, JSON.stringify(rulesItems)); }
  if(Array.isArray(parsed.sosAffirmations)){ sosAffirmations = parsed.sosAffirmations; localStorage.setItem(LS_SOS_AFF, JSON.stringify(sosAffirmations)); }
  settings = Object.assign(settings, parsed.settings||{});
  if(row.updated_at) setSeen(row.updated_at);
  try{ localStorage.removeItem(LS_DIRTY); }catch(e){}
  localStorage.setItem(LS_TRAUMAS, JSON.stringify(traumas));
  localStorage.setItem(LS_FOLDERS, JSON.stringify(folders));
  localStorage.setItem(LS_RECENT_TRAUMAS, JSON.stringify(recentTraumas));
  localStorage.setItem(LS_SETTINGS, JSON.stringify(settings));
  refreshSettingsPanelInputs();
}

async function ensureVaultCreated(userId, email, password){
  const {data: row} = await supa.from('vaults').select('*').eq('user_id', userId).maybeSingle();
  if(row) return {created:false, row};
  const dek = await generateDEK();
  const saltPw = b64enc(randBytes(16));
  const saltRec = b64enc(randBytes(16));
  const recoveryPhrase = generateRecoveryPhrase();
  const kekPw = await deriveKekFromPassphrase(password, saltPw);
  const kekRec = await deriveKekFromPassphrase(normalizeRecoveryPhrase(recoveryPhrase), saltRec);
  const wrapPw = await wrapDEK(dek, kekPw);
  const wrapRec = await wrapDEK(dek, kekRec);
  const payload = JSON.stringify({traumas, folders, settings, recentTraumas, embodiment: embodimentItems, sosAffirmations, commandments: rulesItems, groupchat});
  const {ivB64, ctB64} = await encryptWithDEK(dek, payload);
  const newRow = { user_id:userId, salt_pw:saltPw, iv_pw:wrapPw.ivB64, wrapped_dek_pw:wrapPw.wrappedB64,
    salt_rec:saltRec, iv_rec:wrapRec.ivB64, wrapped_dek_rec:wrapRec.wrappedB64, data_iv:ivB64, ciphertext:ctB64 };
  const {error: insErr} = await supa.from('vaults').insert(newRow);
  if(insErr) throw insErr;
  vault.dek = dek; vault.userId = userId; vault.email = email;
  await cacheSessionDEK(dek, userId, email);
  localStorage.setItem(LS_SYNCED, '1');
  renderAccountPanel();
  return {created:true, recoveryPhrase, row:newRow};
}

async function vaultSignUp(email, password){
  const {data, error} = await supa.auth.signUp({email, password, options:{emailRedirectTo: location.origin+location.pathname}});
  if(error) throw error;
  if(!data.session) return {needsConfirmation:true};
  const result = await ensureVaultCreated(data.user.id, email, password);
  return {needsConfirmation:false, recoveryPhrase:result.recoveryPhrase};
}

async function vaultLogin(email, password){
  const {data, error} = await supa.auth.signInWithPassword({email, password});
  if(error) throw error;
  const userId = data.user.id;
  const result = await ensureVaultCreated(userId, email, password);
  if(result.created){
    return {conflict:false, freshlyCreated:true, recoveryPhrase:result.recoveryPhrase};
  }
  const row = result.row;
  const kekPw = await deriveKekFromPassphrase(password, row.salt_pw);
  const dek = await unwrapDEK(row.iv_pw, row.wrapped_dek_pw, kekPw);
  vault.dek = dek; vault.userId = userId; vault.email = email;
  await cacheSessionDEK(dek, userId, email);
  renderAccountPanel();
  const hasLocalData = traumas.length>0 || folders.length>0 || recentTraumas.length>0;
  if(hasLocalData){ return {conflict:true, row}; }
  await vaultPull(row);
  localStorage.setItem(LS_SYNCED, '1');
  return {conflict:false};
}

async function completeRecovery(recoveryPhrase, newPassword){
  const {data:{user}} = await supa.auth.getUser();
  if(!user) throw new Error('Session de récupération invalide, redemande un lien.');
  const {data: row, error} = await supa.from('vaults').select('*').eq('user_id', user.id).single();
  if(error) throw error;
  const kekRec = await deriveKekFromPassphrase(normalizeRecoveryPhrase(recoveryPhrase), row.salt_rec);
  let dek;
  try{ dek = await unwrapDEK(row.iv_rec, row.wrapped_dek_rec, kekRec); }
  catch(e){ throw new Error('Phrase de récupération incorrecte.'); }
  const {error: updErr} = await supa.auth.updateUser({password:newPassword});
  if(updErr) throw updErr;
  const saltPw = b64enc(randBytes(16));
  const kekPw = await deriveKekFromPassphrase(newPassword, saltPw);
  const wrapPw = await wrapDEK(dek, kekPw);
  const {error: updRowErr} = await supa.from('vaults').update({salt_pw:saltPw, iv_pw:wrapPw.ivB64, wrapped_dek_pw:wrapPw.wrappedB64}).eq('user_id', user.id);
  if(updRowErr) throw updRowErr;
  vault.dek = dek; vault.userId = user.id; vault.email = user.email;
  await cacheSessionDEK(dek, user.id, user.email);
  renderAccountPanel();
  await vaultPull(row);
  localStorage.setItem(LS_SYNCED, '1');
}

    for(let i=0; i<10 && ctx && ctx.state!=='running'; i++) await wait(100);
    if(ctx && ctx.state==='running' && !PREFER_MEDIA_TICKS){
      say('Test 1/3 : écoute…');
      buildTick(ctx, ctx.destination, 'L', ctx.currentTime+0.05, 0.8);
      buildTick(ctx, ctx.destination, 'R', ctx.currentTime+0.75, 0.8);
      await wait(1300);
      if(await ask('Test 1/3 — As-tu entendu deux tops, un à gauche puis un à droite ?')){
        settings.soundEngine = 'webaudio'; saveSettings();
        say('Le son fonctionne ✓.' + vibLine()); return;
      }
    }
    /* 2) méthode de secours (balise <audio>) */
    say('Test 2/3 : écoute…');
    await playTickMedia('L').catch(()=>{}); await wait(700);
    await playTickMedia('R').catch(()=>{}); await wait(900);
    if(await ask('Test 2/3 — Et maintenant, deux tops (gauche puis droite) ?')){
      settings.soundEngine = 'media'; saveSettings();
      say('Le son fonctionne avec la méthode de secours ✓ : c’est celle que j’utiliserai pour tes séances.' + vibLine()); return;
    }
    /* 3) bip long et fort : le problème est-il juste le volume ? */
    say('Test 3/3 : écoute…');
    const beep = new Audio(beepWavUrl()); beep.volume = 1;
    await beep.play().catch(()=>{}); await wait(1300);
    if(await ask('Test 3/3 — Un bip long, tu l’entends ?')){

      say('Les tops étaient trop faibles pour ton appareil : volume mis au maximum, méthode de secours activée.' + vibLine()); return;

    say('Aucun son ne t’arrive : ça vient de l’appareil ou du navigateur, pas du site. À vérifier : 1) volume du système et sortie audio (casque, Bluetooth, écran ?) ; 2) l’onglet n’est pas coupé (haut-parleur barré sur l’onglet : clic droit > Réactiver le son) ; 3) autorisations du site — Chrome : cadenas à gauche de l’adresse > Paramètres du site > Son : Autoriser ; Safari : menu Safari > Réglages pour ce site > Lecture automatique : Autoriser tout ; 4) essaie un autre navigateur.' + vibLine());
  } finally { soundTestRunning = false; }
}

let session=null, currentPhase=null, history=[];
let forwardAction=null, spaceAction=null;

/* Se souvenir du dernier écran "sûr" (listes/accueil) pour y revenir après un
   rafraîchissement — jamais une séance EMDR/R-TEP en cours ou un formulaire,
   dont l'état ne peut pas être reconstruit sans risque. */
const SS_LAST_PHASE = 'soloemdr_last_phase';
const RESTORABLE_PHASES = {
  home: renderHome, library: renderLibrary, embodiment: renderEmbodiment, sos: renderSos, rules: renderRules, groupchat: renderGroupChat, recentlibrary: renderRecentLibrary,
  select: renderSelect, rtep_select: renderRtepSelect, modechoice: renderModeChoice
};
function restorableTargetForPhase(phase){
  if(!phase) return null;
  if(!RTEP_ENABLED && (phase==='recentlibrary' || phase==='rtep_select')) return null;
  if(RESTORABLE_PHASES[phase]) return {phase, fn:RESTORABLE_PHASES[phase]};
  if(phase.indexOf('folder_')===0){
    const folderId = phase.slice('folder_'.length);
    if(folders.some(f=>f.id===folderId)) return {phase, fn:()=> renderFolderView(folderId)};
  }
  return null;
}
function persistPhaseIfRestorable(phase){
  const target = restorableTargetForPhase(phase);
  if(target) sessionStorage.setItem(SS_LAST_PHASE, phase);
  else sessionStorage.removeItem(SS_LAST_PHASE);
}

function goTo(phase, fn){
  pendingGateRerender = false; /* une navigation annule le réaffichage différé d'un écran "Connexion…" */
  if(currentPhase!==null){ history.push({phase:currentPhase, snap:JSON.parse(JSON.stringify(session||{})), fn:currentFn}); }
  currentPhase = phase; currentFn = fn;
  persistPhaseIfRestorable(phase);
  document.body.classList.remove('hide-r','hide-l');
  forwardAction=null; spaceAction=null;
  window.history.pushState({soloemdrNav:true}, '', location.href);
  fn();
  afterNavMusic(phase);
}
let currentFn = null;
function goBack(){
  if(!history.length) return;
  const h = history.pop();
  session = h.snap; currentPhase = h.phase; currentFn = h.fn;
  persistPhaseIfRestorable(h.phase);
  document.body.classList.remove('hide-r','hide-l');
  forwardAction=null; spaceAction=null;
  h.fn();
  afterNavMusic(h.phase);
}
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowLeft'){ e.preventDefault(); goBack(); }
  else if(e.key==='ArrowRight' || (e.key==='Enter' && !e.shiftKey)){ e.preventDefault(); if(forwardAction) forwardAction(); }
  else if(e.code==='Space'){ if(spaceAction){ e.preventDefault(); spaceAction(); } }
});

function parseEmbodimentList(text){
  const lines = text.split(/\r?\n/).map(l=> l.trim()).filter(Boolean);
  const bullet = /^([*•\-–]\s*)+(?=\S)/;
  let out = [];
  if(lines.some(l=> bullet.test(l))){
    lines.forEach(l=>{
      if(bullet.test(l)) out.push(l.replace(bullet,''));
      else if(out.length) out[out.length-1] += ' ' + l; /* suite d'une puce sur plusieurs lignes ; l'en-tête avant la 1re puce est ignoré */
    });
  } else out = lines;
  return out.filter(Boolean);
}

function openListModal(cfg, onClose){
  let items = cfg.get();
  const commit = ()=> cfg.save(items);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-panel" role="dialog" aria-label="${cfg.title}">
      <div class="modal-head"><h3>${cfg.title}</h3></div>
      <div class="modal-body" id="emb-list"></div>
      <div class="modal-import" id="emb-import" style="display:none;">
        <textarea id="emb-import-text" placeholder="${cfg.paste}"></textarea>
        <button type="button" id="emb-import-go">${cfg.addBtn}</button>
      </div>
      <div class="modal-foot">
        <button type="button" id="emb-add">${cfg.add}</button>
        <button type="button" id="emb-paste">Coller une liste</button>
        <button type="button" id="emb-done" class="primary">Terminer</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const listEl = overlay.querySelector('#emb-list');
  const auto = t=>{ t.style.height='auto'; t.style.height = t.scrollHeight+'px'; };
  function draw(focusId){
    if(!items.length){ listEl.innerHTML = `<p class="emb-empty">${cfg.empty}</p>`; return; }
    listEl.innerHTML = items.map((it,i)=>`
      <div class="emb-row">
        <textarea data-id="${it.id}" rows="2">${escapeHtml(it.text)}</textarea>
        <div class="emb-row-actions">
          <button type="button" data-up="${it.id}" title="Monter" ${i===0?'disabled':''}>↑</button>
          <button type="button" data-down="${it.id}" title="Descendre" ${i===items.length-1?'disabled':''}>↓</button>
          <button type="button" data-del="${it.id}" title="Supprimer">✕</button>
        </div>
      </div>`).join('');
    listEl.querySelectorAll('textarea').forEach(t=>{
      auto(t);
      t.addEventListener('input', ()=>{
        const it = items.find(x=>x.id===t.dataset.id);
        if(it){ it.text = t.value; commit(); }
        auto(t);
      });
    });
    const move = (id,dir)=>{
      const i = items.findIndex(x=>x.id===id), j = i+dir;
      if(i<0 || j<0 || j>=items.length) return;
      [items[i], items[j]] = [items[j], items[i]];
      commit(); draw();
    };
    listEl.querySelectorAll('[data-up]').forEach(b=> b.addEventListener('click', ()=> move(b.dataset.up,-1)));
    listEl.querySelectorAll('[data-down]').forEach(b=> b.addEventListener('click', ()=> move(b.dataset.down,1)));
    listEl.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=>{
      if(!b.classList.contains('armed')){
        b.classList.add('armed'); b.textContent = 'Supprimer ?';
        setTimeout(()=>{ if(b.isConnected){ b.classList.remove('armed'); b.textContent = '✕'; } }, 3000);
        return;
      }
      items = items.filter(x=>x.id!==b.dataset.del);
      commit(); draw();
    }));
    if(focusId){ const t = listEl.querySelector(`textarea[data-id="${focusId}"]`); if(t){ t.focus(); t.scrollIntoView({block:'nearest'}); } }
  }
  draw();
  const close = ()=>{
    items = items.filter(x=> x.text.trim());
    commit();
    overlay.remove();
    if(onClose) onClose();
  };
  /* le clavier ne doit pas piloter l'écran en dessous (Entrée = écran suivant, etc.) */
  overlay.addEventListener('keydown', (e)=>{ e.stopPropagation(); if(e.key==='Escape') close(); });
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#emb-done').addEventListener('click', close);
  overlay.querySelector('#emb-add').addEventListener('click', ()=>{
    const it = {id:cfg.newId(), text:''};
    items.push(it); commit(); draw(it.id);
  });
  const importBox = overlay.querySelector('#emb-import');
  overlay.querySelector('#emb-paste').addEventListener('click', ()=>{
    importBox.style.display = importBox.style.display==='none' ? 'flex' : 'none';
    if(importBox.style.display==='flex') overlay.querySelector('#emb-import-text').focus();
  });
  overlay.querySelector('#emb-import-go').addEventListener('click', ()=>{
    const ta = overlay.querySelector('#emb-import-text');
    const parsed = parseEmbodimentList(ta.value);
    if(!parsed.length) return;
    parsed.forEach(text=> items.push({id:cfg.newId(), text}));
    commit();
    ta.value = ''; importBox.style.display = 'none'; draw();
    listEl.scrollTop = listEl.scrollHeight;
  });
}

  s.innerHTML = `

  const listEl = s.querySelector('#es-list'), goBtn = s.querySelector('#es-go');
  const sel = session.sel;
  const textOf = id=>{ const it = embodimentItems.find(x=>x.id===id); return it ? it.text : null; };
  session.sel = sel.filter(x=> textOf(x.id)!==null);
  const list = ()=> session.sel;
  let dragId = null;
  function draw(){
    const L = list();
    listEl.innerHTML = L.map((x,i)=>`
      <div class="emb-sel-row${x.on?'':' off'}" draggable="true" data-id="${x.id}">
        <span class="emb-sel-grip" title="Glisser pour réordonner">⠿</span>
        <label class="emb-sel-text"><input type="checkbox" ${x.on?'checked':''} data-id="${x.id}"><span>${escapeHtml(textOf(x.id)).replace(/\n/g,'<br>')}</span></label>
        <span class="emb-sel-mv">
          <button type="button" data-up="${x.id}" title="Monter" ${i===0?'disabled':''}>↑</button>
          <button type="button" data-down="${x.id}" title="Descendre" ${i===L.length-1?'disabled':''}>↓</button>
        </span>
      </div>`).join('');
    const n = L.filter(x=>x.on).length;
    goBtn.disabled = !n;
    goBtn.textContent = n ? `Commencer (${n})` : 'Aucun état sélectionné';
    listEl.querySelectorAll('input[type=checkbox]').forEach(c=> c.addEventListener('change', ()=>{
      const x = L.find(y=>y.id===c.dataset.id); if(x){ x.on = c.checked; draw(); }
    }));
    const move = (id,dir)=>{
      const i = L.findIndex(x=>x.id===id), j = i+dir;
      if(i<0 || j<0 || j>=L.length) return;
      [L[i], L[j]] = [L[j], L[i]]; draw();
      const b = listEl.querySelector(`[data-${dir<0?'up':'down'}="${id}"]`); if(b && !b.disabled) b.focus();
    };
    listEl.querySelectorAll('[data-up]').forEach(b=> b.addEventListener('click', ()=> move(b.dataset.up,-1)));
    listEl.querySelectorAll('[data-down]').forEach(b=> b.addEventListener('click', ()=> move(b.dataset.down,1)));
    listEl.querySelectorAll('.emb-sel-row').forEach(r=>{
      r.addEventListener('dragstart', e=>{ dragId = r.dataset.id; r.classList.add('dragging'); try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', dragId); }catch(_){} });
      r.addEventListener('dragend', ()=>{ dragId = null; r.classList.remove('dragging'); listEl.querySelectorAll('.over').forEach(o=>o.classList.remove('over')); });
      r.addEventListener('dragover', e=>{ if(dragId){ e.preventDefault(); r.classList.add('over'); } });
      r.addEventListener('dragleave', ()=> r.classList.remove('over'));
      r.addEventListener('drop', e=>{
        e.preventDefault();
        if(!dragId || dragId===r.dataset.id) return;
        const from = L.findIndex(x=>x.id===dragId), to = L.findIndex(x=>x.id===r.dataset.id);
        if(from<0 || to<0) return;
        const [m] = L.splice(from,1); L.splice(to,0,m); dragId = null; draw();
      });
    });
  }
  draw();
  s.querySelector('#es-all').addEventListener('click', ()=>{ list().forEach(x=> x.on=true); draw(); });
  s.querySelector('#es-none').addEventListener('click', ()=>{ list().forEach(x=> x.on=false); draw(); });
  const start = ()=>{
    const ids = list().filter(x=>x.on).map(x=>x.id);
    if(!ids.length) return;
    session.ids = ids; session.index = 0;
    goTo('emb_point', renderEmbodimentPoint);
  };
  goBtn.addEventListener('click', start);
  forwardAction = start;
}

  const isLast = session.index >= session.ids.length-1;
  s.innerHTML = `
    <h2 class="instruction fs">Que voulez-vous faire ?</h2>
    <div class="fs" style="animation-delay:.4s; display:flex; gap:14px; justify-content:center; margin-top:14px; flex-wrap:wrap;">
      <button class="pill-btn" id="emb-same" style="font-size:14px; padding:10px 22px;">Reprendre avec le même</button>
      <button class="pill-btn" id="emb-next" style="font-size:14px; padding:10px 22px;">${isLast ? 'Terminer' : 'Point suivant'}</button>
    </div>
    ${isLast ? '' : `<button class="sel-alt fs" id="emb-quit" style="animation-delay:.6s;">Quitter</button>`}
  `;
  const next = ()=>{
    session.index++;
    if(session.index >= session.ids.length) endEmbodiment();
    else goTo('emb_point', renderEmbodimentPoint);
  };
  s.querySelector('#emb-same').addEventListener('click', ()=> goTo('emb_ball', ()=> showBall('embodiment')));
  s.querySelector('#emb-next').addEventListener('click', next);
  const q = s.querySelector('#emb-quit'); if(q) q.addEventListener('click', endEmbodiment);
  forwardAction = next;
}

/* ================= GROUPCHAT (dialogue entre participants, façon messagerie) ================= */
const GC_PALETTE = ['#E7A97C','#B9A6D9','#7FB0AC','#D98BA0','#8FB8E8','#C9D98B','#E5C16F','#9AD1A7'];
const GC_SHAKE = (n)=> `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg>`;
const GC_EMOJIS = ['👍','❤️','🤗','🙏','💪','😂','😮','😢','😡','😒','✨'];
const GC_RED = '#E0675A';
let gcJustAlert = null;
let gcSender = 'me', gcReplyTo = null, gcEditing = null, gcQuery = '', gcLimit = 200, gcDraft = '';

document.addEventListener('click', e=>{ if(!e.target.closest('.gc-picker, [data-react]')) document.querySelectorAll('.gc-picker').forEach(x=>x.remove()); });
function gcAlertAnim(m){
  const tw = gcWho(m.target);
  const el = document.createElement('div'); el.className = 'gc-alert-fx';
  el.innerHTML = `<div class="gc-alert-box"><div class="gc-alert-ico">⚠</div><div class="gc-alert-t">Alerte dérive !</div><div class="gc-alert-s">${escapeHtml(tw.name)} · ${escapeHtml(m.tag)}</div></div>`;
  document.body.appendChild(el); setTimeout(()=> el.remove(), 2300);
}
function gcActive(){ return groupchat.parts.filter(p=>!p.asleep); }
function gcNewId(){ return 'g_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function gcPart(id){ return groupchat.parts.find(p=>p.id===id) || null; }
function gcMeName(){ return ((typeof settings!=='undefined' && settings.firstName)||'').trim() || 'Moi'; }
function gcQWho(r){ return r.kind==='consensus' ? {name:'Consensus', color:null} : r.kind==='drift' ? {name:'Alerte dérive', color:GC_RED} : gcWho(r.from); }
function gcWho(from){
  if(from==='me') return {name:gcMeName(), color:null, photo:null, me:true};
  const p = gcPart(from);
  return p ? {name:p.name, color:p.color, photo:p.photo, me:false} : {name:'Participant supprimé', color:'#7d8a90', photo:null, me:false, gone:true};
}
function gcAvatar(w, size){
  const st = `width:${size}px;height:${size}px;`;
  if(w.photo) return `<img class="gc-av" style="${st}" src="${w.photo}" alt="">`;
  const c = w.color || 'var(--teal)';
  return `<span class="gc-av gc-av-i" style="${st}background:color-mix(in srgb, ${c} 55%, var(--bg));font-size:${Math.round(size*.45)}px">${escapeHtml((w.name||'?').trim().charAt(0).toUpperCase()||'?')}</span>`;
}
function gcFold(str){
  let n = '', map = [];
  for(let i=0;i<str.length;i++){
    const f = str[i].normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
    for(const ch of f){ n += ch; map.push(i); }
  }
  return {n, map};
}
function gcMatches(text, q){
  if(!q) return [];
  const f = gcFold(text), fq = gcFold(q).n;
  if(!fq) return [];
  const out = []; let i = f.n.indexOf(fq);
  while(i>=0){ out.push([f.map[i], f.map[i+fq.length-1]+1]); i = f.n.indexOf(fq, i+fq.length); }
  return out;
}
function gcMentionRanges(text){
  const names = groupchat.parts.filter(p=>p.name.trim()).map(p=>({id:p.id, color:p.color, fn:gcFold(p.name.trim()).n}))
    .concat([{id:'me', color:null, fn:'moi', alias:true}]);
  const mn = gcFold(gcMeName()).n; if(mn && mn!=='moi') names.push({id:'me', color:null, fn:mn});
  names.sort((x,y)=>y.fn.length-x.fn.length);
  const f = gcFold(text), out = [];
  for(let i=0;i<f.n.length;i++){
    if(f.n[i]!=='@') continue;
    for(const nm of names){
      if(!nm.fn || !f.n.startsWith(nm.fn, i+1)) continue;
      const end = i+1+nm.fn.length, nx = f.n[end];
      if(nx && /[\p{L}\p{N}_]/u.test(nx)) continue;
      out.push({a:f.map[i], b:f.map[end-1]+1, id:nm.id, color:nm.color, alias:!!nm.alias});
      i = end-1; break;
    }
  }
  return out;
}
function gcHighlight(text, q){
  const men = gcMentionRanges(text), ms = gcMatches(text, q);
  const mi = new Array(text.length).fill(-1), mm = new Array(text.length).fill(false);
  men.forEach((r,k)=>{ for(let i=r.a;i<r.b;i++) mi[i] = k; });
  ms.forEach(([a,b])=>{ for(let i=a;i<b;i++) mm[i] = true; });
  let out = '', i = 0;
  while(i<text.length){
    let j = i+1;
    while(j<text.length && mi[j]===mi[i] && mm[j]===mm[i]) j++;
    let seg = escapeHtml(text.slice(i,j)).replace(/\n/g,'<br>');
    if(mm[i]) seg = '<mark>'+seg+'</mark>';
    if(mi[i]>=0){ const r = men[mi[i]]; if(r.id==='me' && r.alias && gcMeName()!=='Moi') seg = '@'+escapeHtml(gcMeName()); seg = `<span class="gc-mention" style="color:${r.color||'var(--teal-deep)'}"${r.id!=='me'?` data-card="${r.id}"`:''}>${seg}</span>`; }
    out += seg; i = j;
  }
  return out;
}
function gcTime(ts){ return new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function gcDay(ts){
  const d = new Date(ts), t = new Date(); const k = x=> x.getFullYear()*400+x.getMonth()*32+x.getDate();
  const y = new Date(t); y.setDate(t.getDate()-1);
  if(k(d)===k(t)) return 'Aujourd’hui';
  if(k(d)===k(y)) return 'Hier';
  return d.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long', year: d.getFullYear()!==t.getFullYear() ? 'numeric' : undefined});
}
function gcDateTime(ts){ return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})+' · '+gcTime(ts); }
function gcSnippet(m, n){
  const t = (m.text||'').replace(/\s+/g,' ').trim();
  return t.length>n ? t.slice(0,n-1)+'…' : t;
}

function renderGroupChat(){

  const s = stageBase();

  s.innerHTML = `
    <div class="gc-wrap fs">
