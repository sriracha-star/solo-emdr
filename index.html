<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoloEMDR</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#EEF3F2; --bg-soft:#E3ECEA; --ink:#24313A; --ink-soft:#5B6B72;
    --teal:#3E7371; --teal-deep:#2A5654; --clay:#C9825F; --clay-soft:#E7C3AC;
    --line:#C9D6D3; --dusk:#0F1E27; --dusk-2:#16303B;
    --bg-violet:#EFEDF6; --bg-soft-violet:#E5E0EF; --teal-soft:#CFE3E0; --folder-neutral:#D7DEE6;
    --aurora-1:#4C8B88; --aurora-2:#E7A97C; --aurora-3:#B9A6D9; --aurora-4:#7FB0AC;
    --font-display: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:linear-gradient(120deg,var(--bg) 0%,var(--bg-soft) 50%,var(--bg) 100%); background-size:220% 220%;
    color:var(--ink); font-family:var(--font-body); overflow:hidden; animation:tide 40s ease-in-out infinite; }
  body.phase-positive{ background-image:linear-gradient(120deg,var(--bg-violet) 0%,var(--bg-soft-violet) 50%,var(--bg-violet) 100%); }
  @media (prefers-reduced-motion: reduce){ body{ animation:none; } }
  @keyframes tide{ 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
  #app{ height:100vh; width:100vw; position:relative; display:flex; flex-direction:column; }

  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .fs{ opacity:0; animation:fadeIn 0.9s ease forwards; }

  .icon-btn{ position:fixed; top:14px; z-index:60; background:none; border:none; cursor:pointer; opacity:.75; padding:6px; color:var(--ink); }
  .icon-btn:hover{ opacity:1; }
  .icon-btn svg{ display:block; }
  body.stage-dark .icon-btn{ color:#EFE8DA; }
  #homeIcon{ left:14px; }
  #libraryIcon{ left:56px; }
  #recentLibraryIcon{ left:98px; }
  #settingsIcon{ left:140px; }

  .account-wrap{ position:fixed; top:14px; right:14px; z-index:60; }
  .account-wrap #accountIcon{ position:static; }
  .conn-dot{ position:absolute; top:2px; right:2px; width:8px; height:8px; border-radius:50%; background:#b8b0a0; border:1.5px solid var(--bg,#fff); }
  .conn-dot.ok{ background:#5f9e7a; }
  .conn-dot.err{ background:#c0554a; }
  body.stage-dark .conn-dot{ border-color:var(--dusk,#0b0b0d); }
  #account-panel{ position:absolute; top:34px; right:-6px; width:220px; background:white; border:1px solid var(--line);
    border-radius:14px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.12); display:none; text-align:left; }
  #account-panel.open{ display:block; }
  #account-panel .sub{ margin:0 0 10px; font-size:12.5px; max-width:none; }
  #account-panel button{ width:100%; margin-top:0; }
  #account-panel button + button{ margin-top:8px; }

  #settings-panel{ position:fixed; top:56px; left:140px; z-index:60; width:290px; background:white; border:1px solid var(--line);
    border-radius:14px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,0.12); display:none; }
  #settings-panel.open{ display:block; }
  #settings-panel h3{ font-size:13px; margin:0 0 10px; }
  .control-group{ margin-bottom:12px; }
  .control-group label{ font-size:12.5px; color:var(--ink-soft); display:block; margin-bottom:4px; }
  select, textarea, input[type=text], input[type=password]{ width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    font-family:var(--font-body); font-size:13.5px; background:white; color:var(--ink); }
  textarea{ resize:vertical; min-height:70px; }
  input[type=range]{ width:100%; accent-color:var(--teal); }

  .chev{ position:fixed; top:50%; transform:translateY(-50%); z-index:40; background:none; border:none;
    font-size:28px; color:var(--ink-soft); opacity:.28; cursor:pointer; padding:14px; }
  .chev:hover{ opacity:.7; }
  #chevL{ left:2px; } #chevR{ right:2px; }
  body.hide-r #chevR{ display:none; }
  body.hide-l #chevL{ display:none; }

  #stage-wrap{ flex:1; position:relative; overflow:hidden; }
  #stage{ height:100%; width:100%; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px; overflow-y:auto; }
  .aurora-wrap{ position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .aurora-blob{ position:absolute; border-radius:50%; filter:blur(min(9vw,70px)); opacity:.45;
    animation:auroraFloat ease-in-out infinite alternate; }
  @keyframes auroraFloat{ from{ transform:translate(0,0) scale(1) rotate(0deg); } to{ transform:translate(var(--dx,40px), var(--dy,30px)) scale(var(--sc,1.1)) rotate(6deg); } }
  @media (prefers-reduced-motion: reduce){ .aurora-blob{ animation:none; } }
  .home-fg{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; }
  #stage h2.instruction{ font-family:var(--font-display); font-weight:600; font-size:clamp(21px,3vw,30px); margin:0 0 6px; max-width:640px; }
  #stage p.sub{ color:var(--ink-soft); font-size:14.5px; margin:0 0 22px; max-width:540px; }

  .breathe-circle{ width:140px; height:140px; border-radius:50%; background:radial-gradient(circle at 35% 35%, var(--clay-soft), var(--teal));
    animation:breathe 6s ease-in-out infinite; margin-bottom:26px; }
  @keyframes breathe{ 0%,100%{transform:scale(0.85);opacity:.85;} 50%{transform:scale(1.05);opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .breathe-circle{ animation:none; } }

  .free-text-wrap{ width:min(560px,90%); margin-top:6px; }
  .free-text-wrap textarea{ min-height:90px; font-size:15px; }
  .check-row{ display:flex; align-items:center; gap:8px; justify-content:center; margin:10px 0 4px; font-size:13.5px; color:var(--ink-soft); }

  .scale-wrap{ width:min(560px,90%); margin-top:6px; }
  .scale-label{ font-family:var(--font-display); font-size:22px; font-weight:600; color:var(--teal-deep); margin:4px 0 14px; min-height:28px; }
  .scale-numbers{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
  .scale-num{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:white; color:var(--ink);
    font-family:var(--font-body); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .scale-num:hover{ border-color:var(--teal); }
  .scale-num.selected{ background:var(--teal); border-color:var(--teal); color:white; }

  .priority-picker{ display:flex; gap:7px; }
  .priority-btn{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:white; color:var(--ink);
    font-family:var(--font-body); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .priority-btn:hover{ border-color:var(--teal); }
  .priority-btn.selected{ background:var(--teal); border-color:var(--teal); color:white; }
  .priority-btn:disabled{ cursor:default; opacity:.55; }
  .priority-btn:disabled:hover{ border-color:var(--line); }

  .hint-line{ font-size:12.5px; color:var(--ink-soft); margin-top:26px; }

  #bls-stage{ height:100%; width:100%; background:radial-gradient(ellipse at center, var(--dusk-2), var(--dusk)); position:relative; display:none; }
  #bls-inner{ height:100%; width:100%; position:relative; transition:opacity .35s ease; }
  #bls-dot{ position:absolute; width:34px; height:34px; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%);
    border:1px solid rgba(0,0,0,0.12); }
  #bls-instruction{ position:absolute; top:16%; left:50%; transform:translate(-50%,0); color:#EFE8DA; font-family:var(--font-display);
    font-size:19px; text-align:center; width:80%; max-width:520px; transition:opacity .5s ease; }
  .dark-form{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px; }
  .dark-form h2{ font-family:var(--font-display); color:#EFE8DA; font-size:22px; margin:0 0 18px; max-width:560px; }
  .dark-form textarea{ background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); color:#EFE8DA; }
  .dark-form textarea::placeholder{ color:rgba(239,232,218,0.4); }
  .dark-form .check-row{ color:rgba(239,232,218,0.6); }

  .countdown-num{ font-family:var(--font-display); font-size:64px; color:var(--teal-deep); }

  /* selection screen */
  #stage.select-view{ align-items:center; overflow:hidden; }
  #stage.select-view h2.instruction{ flex:0 0 auto; width:100%; margin:0 0 20px; }
  .sel-scroll{ flex:1 1 auto; min-height:0; width:100%; overflow-y:auto; display:flex; flex-direction:column; align-items:center; padding-bottom:12px; }
  .sel-list{ width:min(560px,92%); display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .sel-card{ background:white; border:1px solid var(--line); border-radius:12px; padding:12px 16px; text-align:left; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; }
  .sel-card:hover{ border-color:var(--teal); }
  .sel-card .t{ font-size:14.5px; font-weight:600; }
  .sel-card .actions{ display:flex; gap:6px; }
  .pill-btn, .sel-card .actions button, .lib-toolbar-actions button, .lib-add-top, #account-panel button{
    font-size:12.5px; padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg-soft);
    color:var(--ink); font-family:var(--font-body); cursor:pointer; white-space:nowrap; transition:background-color .15s ease; }
  .pill-btn:hover, .sel-card .actions button:hover, .lib-toolbar-actions button:hover, .lib-add-top:hover, #account-panel button:hover{
    background-color:color-mix(in srgb, var(--bg-soft), black 30%); }
  .sel-alt{ margin-top:18px; font-size:13.5px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; background:none; border:none; }
  .lib-toolbar-actions .toggle-folders-btn{ font-size:11px; padding:0; border:none; background:none; color:var(--ink-soft); text-decoration:underline; }
  .lib-toolbar-actions .toggle-folders-btn:hover{ color:var(--ink); background:none; }
  .sel-add{ margin-top:6px; font-size:13px; color:var(--teal-deep); background:none; border:none; cursor:pointer; }

  .sel-card.has-status{ display:flex; flex-direction:column; align-items:stretch; }
  .sel-card-top{ display:flex; justify-content:space-between; align-items:center; width:100%; }
  .sel-card-done{ opacity:.5; }

  /* collapsible picker rows: grid-rows trick so height always matches content, never clips */
  .status-picker, .folder-picker, .priority-card-picker, .sessions-history, .trauma-quick-actions, .linked-traumas{ display:grid; grid-template-rows:0fr; opacity:0; margin-top:0; padding-top:0;
    border-top:1px solid transparent;
    transition:grid-template-rows .25s ease, opacity .2s ease, margin-top .25s ease, padding-top .25s ease, border-color .25s ease; }
  .status-picker.open, .folder-picker.open, .priority-card-picker.open, .sessions-history.open, .trauma-quick-actions.open, .linked-traumas.open{ grid-template-rows:1fr; opacity:1; margin-top:10px; padding-top:10px; border-top-color:var(--line); }
  .status-picker > div, .folder-picker > div, .priority-card-picker > div, .sessions-history > div, .trauma-quick-actions > div, .linked-traumas > div{ overflow:hidden; min-height:0; display:flex; gap:8px; flex-wrap:wrap; }
  .sessions-history > div, .linked-traumas > div{ flex-direction:column; gap:6px; }
  .sessions-history-title{ font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); }
  .linked-traumas-names{ font-size:12.5px; color:var(--ink); line-height:1.5; }
  .session-entry{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12.5px; cursor:pointer; width:100%; }
  .session-entry-main{ display:flex; gap:10px; flex-wrap:wrap; }
  .session-entry .session-date{ color:var(--ink-soft); white-space:nowrap; }
  .session-chevron{ color:var(--ink-soft); transition:transform .15s ease; flex:0 0 auto; }
  .session-entry.open .session-chevron{ transform:rotate(90deg); }
  .session-detail{ display:none; flex-direction:column; gap:4px; width:100%; margin:2px 0 6px; padding:6px 0 0 10px; border-left:2px solid var(--line); font-size:11.5px; color:var(--ink-soft); }
  .session-detail.open{ display:flex; }
  .session-detail-row{ display:flex; justify-content:space-between; gap:10px; }
  .session-detail-row span:first-child{ font-weight:600; color:var(--ink); flex:0 0 auto; }
  .session-detail-row span:last-child{ text-align:right; }
  .status-opt{ flex:1; padding:7px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg-soft);
    color:var(--ink); font-family:var(--font-body); font-size:12.5px; cursor:pointer; }
  .status-opt:hover{ border-color:var(--teal); }
  .status-opt.selected{ background:var(--teal); border-color:var(--teal); color:white; }
  .folder-opt{ padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg-soft);
    color:var(--ink); font-family:var(--font-body); font-size:12.5px; cursor:pointer; }
  .folder-opt:hover{ border-color:var(--clay); }
  .folder-opt.selected{ background:var(--clay); border-color:var(--clay); color:white; }

  /* toolbar: search + sort + add actions */
  .lib-toolbar{ width:min(920px,96%); flex:0 0 auto; margin:0 0 26px; display:flex; align-items:center; justify-content:space-between; gap:28px; flex-wrap:wrap;
    position:relative; z-index:5; }
  .lib-toolbar input[type=text]{ flex:1 1 240px; max-width:380px; width:auto; font-size:13.5px; padding:8px 16px; border-radius:20px;
    border:1px solid var(--line); background:var(--bg-soft); color:var(--ink); }
  .lib-toolbar input::placeholder{ color:var(--ink-soft); }
  .lib-toolbar input:hover{ border-color:var(--teal); }
  .lib-toolbar input:focus{ outline:none; border-color:var(--teal); background:white; }
  .lib-toolbar-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .toolbar-icon-btn{ background:var(--bg-soft); border:1px solid var(--line); border-radius:8px; padding:8px; cursor:pointer;
    color:var(--ink); display:flex; align-items:center; justify-content:center; transition:background-color .15s ease; }
  .toolbar-icon-btn:hover{ background-color:color-mix(in srgb, var(--bg-soft), black 30%); }
  .toolbar-icon-btn svg{ display:block; }
  .lib-sort-wrap{ position:relative; }
  .lib-sort-panel{ position:absolute; top:44px; left:0; z-index:40; width:210px; background:white; border:1px solid var(--line);
    border-radius:14px; padding:8px; box-shadow:0 10px 30px rgba(0,0,0,.12); display:none; text-align:left; }
  .lib-sort-panel.open{ display:block; }
  .lib-sort-panel button{ display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; text-align:left;
    padding:8px 10px; border-radius:8px; border:none; background:none; color:var(--ink); font-family:var(--font-body); font-size:13px; cursor:pointer; }
  .lib-sort-panel button:hover{ background:var(--bg-soft); }
  .lib-sort-panel button.selected{ font-weight:600; color:var(--teal-deep); }
  .lib-sort-panel .sort-check{ opacity:0; flex:0 0 auto; }
  .lib-sort-panel button.selected .sort-check{ opacity:1; }
  .lib-sort-color-toggle{ display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; border-radius:8px;
    color:var(--ink); font-family:var(--font-body); font-size:13px; cursor:pointer; }
  .lib-sort-color-toggle:hover{ background:var(--bg-soft); }
  .lib-sort-color-toggle input{ cursor:pointer; }
  .lib-sort-divider{ height:1px; background:var(--line); margin:4px 6px; }

  .lib-add-top-wrap{ width:min(560px,92%); display:flex; justify-content:space-between; align-items:center; margin:0 0 12px; }

  /* folder grid */
  .folder-grid{ width:min(920px,96%); display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px; margin:0 0 24px; }
  .folder-tile{ position:relative; cursor:pointer; min-height:104px; border-radius:14px; padding:14px; text-align:left;
    background:var(--folder-neutral); display:flex; flex-direction:column; justify-content:flex-start; }
  .folder-tile.all-done{ background:var(--teal-soft); }
  .folder-name{ font-weight:600; font-size:14px; color:var(--ink); word-break:break-word; }
  .folder-count{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; }
  .folder-actions{ position:absolute; bottom:8px; right:8px; display:flex; gap:4px; opacity:0; transition:opacity .15s ease; }
  .folder-tile:hover .folder-actions{ opacity:1; }
  .folder-actions button{ width:24px; height:24px; border-radius:50%; border:1px solid rgba(0,0,0,.08); background:rgba(255,255,255,.75);
    cursor:pointer; font-size:11px; line-height:1; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
  .folder-actions button:hover{ background:white; color:var(--ink); }

  .skip-link{ position:fixed; bottom:24px; right:24px; z-index:45; background:none; border:none; color:rgba(239,232,218,0.5);
    font-size:12.5px; cursor:pointer; text-decoration:underline; }
  .skip-link:hover{ color:rgba(239,232,218,0.9); }

  .form-error{ color:#B3423E; font-size:12.5px; margin-top:10px; min-height:16px; max-width:420px; }
</style>
</head>
<body>
<div id="app">
  <button id="homeIcon" class="icon-btn" title="Accueil">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3a3 3 0 00-3 3v1a3 3 0 00-2 2.8V12a3 3 0 002 2.8v1A3 3 0 008 19h1V3H8z"/><path d="M16 3a3 3 0 013 3v1a3 3 0 012 2.8V12a3 3 0 01-2 2.8v1a3 3 0 01-3 3.2h-1V3h1z"/></svg>
  </button>
  <button id="libraryIcon" class="icon-btn" title="Vos souvenirs">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3.5a1 1 0 011-1h10a1 1 0 011 1V20l-6-3.6L6 20V3.5z"/></svg>
  </button>
  <button id="recentLibraryIcon" class="icon-btn" title="Traumas récents (R-TEP)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2l1 6 5-3-3 5 6 1-6 1 3 5-5-3-1 6-1-6-5 3 3-5-6-1 6-1-3-5 5 3z"/></svg>
  </button>
  <button id="settingsIcon" class="icon-btn" title="Réglages">
    <svg width="20" height="20" viewBox="0 0 20 20"><line x1="2" y1="5" x2="18" y2="5" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="5" r="2" fill="currentColor"/><line x1="2" y1="10" x2="18" y2="10" stroke="currentColor" stroke-width="1.6"/><circle cx="13" cy="10" r="2" fill="currentColor"/><line x1="2" y1="15" x2="18" y2="15" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="15" r="2" fill="currentColor"/></svg>
  </button>
  <div class="account-wrap">
    <button id="accountIcon" class="icon-btn" title="Compte">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      <span id="connDot" class="conn-dot" title=""></span>
    </button>
    <div id="account-panel"></div>
  </div>
  <button class="chev" id="chevL">‹</button>
  <button class="chev" id="chevR">›</button>
  <div id="settings-panel">
    <h3>Réglages de la stimulation</h3>
    <div class="control-group"><label>Vitesse : <span id="speed-val">30</span> passages/min</label><input type="range" id="bls-speed" min="10" max="70" value="30"></div>
    <div class="control-group"><label>Taille du point</label><input type="range" id="bls-size" min="18" max="60" value="34"></div>
    <div class="control-group"><label>Couleur du point</label><input type="color" id="bls-color" value="#F4E3C1" style="width:100%;height:34px;padding:2px;cursor:pointer;"></div>
    <div class="control-group"><label>Durée d'une série : <span id="duration-val">90</span> s</label><input type="range" id="bls-duration" min="20" max="180" value="90"></div>
    <div class="control-group"><label><input type="checkbox" id="bls-audio" checked> Tonalité audio alternée</label></div>
    <div class="control-group"><label><input type="checkbox" id="bls-haptic"> Vibration alternée</label></div>
    <button id="settings-save" class="sel-add" style="width:100%; border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:4px;">Enregistrer</button>
  </div>

  <div id="stage-wrap">
    <div id="stage"></div>
    <div id="bls-stage"><div id="bls-inner"></div></div>
  </div>
</div>

<script>
const LS_TRAUMAS='soloemdr_traumas', LS_SETTINGS='soloemdr_settings', LS_FOLDERS='soloemdr_folders', LS_RECENT_TRAUMAS='soloemdr_recent_traumas';
const $ = id => document.getElementById(id);
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function loadTraumas(){ try{ return JSON.parse(localStorage.getItem(LS_TRAUMAS))||[]; }catch(e){ return []; } }
function saveTraumas(list){ localStorage.setItem(LS_TRAUMAS, JSON.stringify(list)); scheduleSync(); }
let traumas = loadTraumas();
function loadFolders(){ try{ return JSON.parse(localStorage.getItem(LS_FOLDERS))||[]; }catch(e){ return []; } }
function saveFolders(list){ localStorage.setItem(LS_FOLDERS, JSON.stringify(list)); scheduleSync(); }
let folders = loadFolders();
/* traumas récents (protocole R-TEP) : même forme que `traumas`, coffre séparé mais

/* ==================================================================
   Cloud sync: zero-knowledge encrypted vault (Supabase + Web Crypto)
   The DEK (data encryption key) is generated once per account, then
   wrapped once with a key derived from the password and once with a
   key derived from the recovery phrase. Only the wrapped copies and
   the encrypted vault ever reach the server — the DEK itself, the
   password and the recovery phrase never leave this browser.
   ================================================================== */

const cryptoEnc = new TextEncoder();
const cryptoDec = new TextDecoder();
function b64enc(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64dec(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }
function randBytes(n){ return crypto.getRandomValues(new Uint8Array(n)); }

async function deriveKekFromPassphrase(passphrase, saltB64){
  const salt = b64dec(saltB64);
  const baseKey = await crypto.subtle.importKey('raw', cryptoEnc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'},
    baseKey, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']
  );
}
async function generateDEK(){ return crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt','decrypt']); }
async function wrapDEK(dek, kek){
  const raw = await crypto.subtle.exportKey('raw', dek);
  const iv = randBytes(12);
  const wrapped = await crypto.subtle.encrypt({name:'AES-GCM', iv}, kek, raw);
  return {ivB64:b64enc(iv), wrappedB64:b64enc(wrapped)};
}
async function unwrapDEK(ivB64, wrappedB64, kek){
  const raw = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64dec(ivB64)}, kek, b64dec(wrappedB64));
  return crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, true, ['encrypt','decrypt']);
}
async function encryptWithDEK(dek, plaintextStr){
  const iv = randBytes(12);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, dek, cryptoEnc.encode(plaintextStr));
  return {ivB64:b64enc(iv), ctB64:b64enc(ct)};
}
async function decryptWithDEK(dek, ivB64, ctB64){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64dec(ivB64)}, dek, b64dec(ctB64));
  return cryptoDec.decode(pt);
}
function generateRecoveryPhrase(){
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = randBytes(24);
  let out = '';
  for(let i=0;i<bytes.length;i++){ out += alphabet[bytes[i] % alphabet.length]; }
  return out.match(/.{1,4}/g).join('-');
}
function normalizeRecoveryPhrase(s){ return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

/* ---------- cache DEK entre rechargements (IndexedDB, clé non-exportable) ----------
   Le DEK en mémoire (vault.dek) est perdu à chaque rechargement de page ; sans ce
   cache, ça revient à se retrouver "déconnecté" silencieusement à chaque fois,
   avec la synchronisation qui s'arrête sans aucun avertissement. Une copie
   non-exportable (utilisable pour chiffrer/déchiffrer, mais jamais lisible en
   clair) est donc gardée dans IndexedDB, et re-validée contre la session
   Supabase réelle à chaque démarrage avant d'être réutilisée. */
const IDB_NAME = 'soloemdr_session', IDB_STORE = 'dek';
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(IDB_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function cacheSessionDEK(dek, userId, email){
  try{
    const raw = await crypto.subtle.exportKey('raw', dek);
    const lockedDek = await crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
    const db = await idbOpen();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put({dek:lockedDek, userId, email}, 'current');
      tx.oncomplete = resolve; tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){}
}
async function readCachedDEK(){
  try{
    const db = await idbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readonly');
      const req = tx.objectStore(IDB_STORE).get('current');
      req.onsuccess = ()=> resolve(req.result || null);
      req.onerror = ()=> reject(req.error);
    });
  }catch(e){ return null; }
}
async function clearSessionDEK(){
  try{
    const db = await idbOpen();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete('current');
      tx.oncomplete = resolve; tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){}
}
/* Essaie de restaurer une session déjà déverrouillée, sans redemander le mot de
   passe — seulement si la session Supabase sous-jacente est toujours valide et
   correspond bien au DEK mis en cache. */
async function restoreVaultFromCache(){
  if(!supa) return false;
  const rec = await readCachedDEK();
  if(!rec) return false;
  try{
    const {data:{session}} = await supa.auth.getSession();
    if(!session || session.user.id !== rec.userId){ await clearSessionDEK(); return false; }
  }catch(e){ return false; }
  vault.dek = rec.dek; vault.userId = rec.userId; vault.email = rec.email;
  return true;
}

let vault = { dek:null, userId:null, email:null };
const LS_SYNCED = 'soloemdr_synced_before';
function vaultReady(){ return !!(supa && vault.dek && vault.userId); }
let lastSyncError = false;

let syncTimer = null;
function scheduleSync(){
  if(!vaultReady()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(vaultPush, 1000);
}
/* Un changement peut rester "en attente" jusqu'à 1s (debounce) avant d'être
   réellement envoyé — si l'onglet se ferme ou passe en arrière-plan pendant
   cette fenêtre, on force l'envoi immédiatement plutôt que de le perdre. */
function flushPendingSync(){
  if(syncTimer){ clearTimeout(syncTimer); syncTimer = null; vaultPush(); }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushPendingSync(); });
window.addEventListener('pagehide', flushPendingSync);
async function vaultPush(){
  if(!vaultReady()) return;
  try{
    const payload = JSON.stringify({traumas, folders, settings, recentTraumas});
    const {ivB64, ctB64} = await encryptWithDEK(vault.dek, payload);
    const {error} = await supa.from('vaults').update({data_iv:ivB64, ciphertext:ctB64, updated_at:new Date().toISOString()}).eq('user_id', vault.userId);
    if(error) throw error;
    lastSyncError = false;
  }catch(e){
    lastSyncError = true;
  }
  updateConnDot();
}
async function vaultPull(row){
  const json = await decryptWithDEK(vault.dek, row.data_iv, row.ciphertext);
  const parsed = JSON.parse(json);
  traumas = parsed.traumas||[]; folders = parsed.folders||[];
  recentTraumas = parsed.recentTraumas||[];
  settings = Object.assign(settings, parsed.settings||{});
  localStorage.setItem(LS_TRAUMAS, JSON.stringify(traumas));
  localStorage.setItem(LS_FOLDERS, JSON.stringify(folders));
  localStorage.setItem(LS_RECENT_TRAUMAS, JSON.stringify(recentTraumas));
  localStorage.setItem(LS_SETTINGS, JSON.stringify(settings));
  refreshSettingsPanelInputs();
}

async function ensureVaultCreated(userId, email, password){
  const {data: row} = await supa.from('vaults').select('*').eq('user_id', userId).maybeSingle();
  if(row) return {created:false, row};
  const dek = await generateDEK();
  const saltPw = b64enc(randBytes(16));
  const saltRec = b64enc(randBytes(16));
  const recoveryPhrase = generateRecoveryPhrase();
  const kekPw = await deriveKekFromPassphrase(password, saltPw);
  const kekRec = await deriveKekFromPassphrase(normalizeRecoveryPhrase(recoveryPhrase), saltRec);
  const wrapPw = await wrapDEK(dek, kekPw);
  const wrapRec = await wrapDEK(dek, kekRec);
  const payload = JSON.stringify({traumas, folders, settings, recentTraumas});
  const {ivB64, ctB64} = await encryptWithDEK(dek, payload);
  const newRow = { user_id:userId, salt_pw:saltPw, iv_pw:wrapPw.ivB64, wrapped_dek_pw:wrapPw.wrappedB64,
    salt_rec:saltRec, iv_rec:wrapRec.ivB64, wrapped_dek_rec:wrapRec.wrappedB64, data_iv:ivB64, ciphertext:ctB64 };
  const {error: insErr} = await supa.from('vaults').insert(newRow);
  if(insErr) throw insErr;
  vault.dek = dek; vault.userId = userId; vault.email = email;
  await cacheSessionDEK(dek, userId, email);
  localStorage.setItem(LS_SYNCED, '1');
  renderAccountPanel();
  return {created:true, recoveryPhrase, row:newRow};
}

async function vaultSignUp(email, password){
  const {data, error} = await supa.auth.signUp({email, password, options:{emailRedirectTo: location.origin+location.pathname}});
  if(error) throw error;
  if(!data.session) return {needsConfirmation:true};
  const result = await ensureVaultCreated(data.user.id, email, password);
  return {needsConfirmation:false, recoveryPhrase:result.recoveryPhrase};
}

async function vaultLogin(email, password){
  const {data, error} = await supa.auth.signInWithPassword({email, password});
  if(error) throw error;
  const userId = data.user.id;
  const result = await ensureVaultCreated(userId, email, password);
  if(result.created){
    return {conflict:false, freshlyCreated:true, recoveryPhrase:result.recoveryPhrase};
  }
  const row = result.row;
  const kekPw = await deriveKekFromPassphrase(password, row.salt_pw);
  const dek = await unwrapDEK(row.iv_pw, row.wrapped_dek_pw, kekPw);
  vault.dek = dek; vault.userId = userId; vault.email = email;
  await cacheSessionDEK(dek, userId, email);
  renderAccountPanel();
  const hasLocalData = traumas.length>0 || folders.length>0 || recentTraumas.length>0;
  if(hasLocalData){ return {conflict:true, row}; }
  await vaultPull(row);
  localStorage.setItem(LS_SYNCED, '1');
  return {conflict:false};
}

async function completeRecovery(recoveryPhrase, newPassword){
  const {data:{user}} = await supa.auth.getUser();
  if(!user) throw new Error('Session de récupération invalide, redemande un lien.');
  const {data: row, error} = await supa.from('vaults').select('*').eq('user_id', user.id).single();
  if(error) throw error;
  const kekRec = await deriveKekFromPassphrase(normalizeRecoveryPhrase(recoveryPhrase), row.salt_rec);
  let dek;
  try{ dek = await unwrapDEK(row.iv_rec, row.wrapped_dek_rec, kekRec); }
  catch(e){ throw new Error('Phrase de récupération incorrecte.'); }
  const {error: updErr} = await supa.auth.updateUser({password:newPassword});
  if(updErr) throw updErr;
  const saltPw = b64enc(randBytes(16));
  const kekPw = await deriveKekFromPassphrase(newPassword, saltPw);
  const wrapPw = await wrapDEK(dek, kekPw);
  const {error: updRowErr} = await supa.from('vaults').update({salt_pw:saltPw, iv_pw:wrapPw.ivB64, wrapped_dek_pw:wrapPw.wrappedB64}).eq('user_id', user.id);
  if(updRowErr) throw updRowErr;
  vault.dek = dek; vault.userId = user.id; vault.email = user.email;
  await cacheSessionDEK(dek, user.id, user.email);
  renderAccountPanel();
  await vaultPull(row);
  localStorage.setItem(LS_SYNCED, '1');
}

function translateAuthError(e){
  const msg = (e && e.message) || String(e);
  if(/already registered|already exists/i.test(msg)) return 'Un compte existe déjà avec cet email.';
  if(/invalid login credentials/i.test(msg)) return 'Email ou mot de passe incorrect.';
  if(/password.*least/i.test(msg)) return 'Le mot de passe doit faire au moins 6 caractères.';
  return msg;
}

let session=null, currentPhase=null, history=[];
let forwardAction=null, spaceAction=null;

/* Se souvenir du dernier écran "sûr" (listes/accueil) pour y revenir après un
   rafraîchissement — jamais une séance EMDR/R-TEP en cours ou un formulaire,
   dont l'état ne peut pas être reconstruit sans risque. */
const SS_LAST_PHASE = 'soloemdr_last_phase';
const RESTORABLE_PHASES = {
  home: renderHome, library: renderLibrary, recentlibrary: renderRecentLibrary,
  select: renderSelect, rtep_select: renderRtepSelect, modechoice: renderModeChoice
};
function restorableTargetForPhase(phase){
  if(!phase) return null;
  if(RESTORABLE_PHASES[phase]) return {phase, fn:RESTORABLE_PHASES[phase]};
  if(phase.indexOf('folder_')===0){
    const folderId = phase.slice('folder_'.length);
    if(folders.some(f=>f.id===folderId)) return {phase, fn:()=> renderFolderView(folderId)};
  }
  return null;
}
function persistPhaseIfRestorable(phase){
  const target = restorableTargetForPhase(phase);
  if(target) sessionStorage.setItem(SS_LAST_PHASE, phase);
  else sessionStorage.removeItem(SS_LAST_PHASE);
}

function goTo(phase, fn){
  if(currentPhase!==null){ history.push({phase:currentPhase, snap:JSON.parse(JSON.stringify(session||{})), fn:currentFn}); }
  currentPhase = phase; currentFn = fn;
  persistPhaseIfRestorable(phase);
  document.body.classList.remove('hide-r','hide-l');
  forwardAction=null; spaceAction=null;
  window.history.pushState({soloemdrNav:true}, '', location.href);
  fn();
}
let currentFn = null;
function goBack(){
  if(!history.length) return;
  const h = history.pop();
  session = h.snap; currentPhase = h.phase; currentFn = h.fn;
  persistPhaseIfRestorable(h.phase);
  document.body.classList.remove('hide-r','hide-l');
  forwardAction=null; spaceAction=null;
  h.fn();
}
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowLeft'){ e.preventDefault(); goBack(); }
  else if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); if(forwardAction) forwardAction(); }
  else if(e.code==='Space'){ if(spaceAction){ e.preventDefault(); spaceAction(); } }
});
$('chevL').addEventListener('click',goBack);
$('chevR').addEventListener('click',()=>{ if(forwardAction) forwardAction(); });
/* keep the browser's own back button inside the app instead of leaving the page */

function renderOfflineGate(freeSessionFn){
  const s = stageBase();
  s.innerHTML = `
    <h2 class="instruction fs">Vous n'êtes pas connecté·e</h2>
    <p class="sub fs" style="animation-delay:.3s">Connectez-vous pour accéder à vos souvenirs.</p>

function isDarkColor(hex){
  if(!hex) return false;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b)/255 < 0.55;
}

const LS_LIBSORT = 'soloemdr_libsort';
const LS_LIBSORT_COLOR = 'soloemdr_libsort_color';
const LS_HIDE_FOLDERS = 'soloemdr_hide_folders';
let libSortCriterion = localStorage.getItem(LS_LIBSORT) || 'alpha';
let libSortColor = localStorage.getItem(LS_LIBSORT_COLOR) === '1';
let hideFolders = localStorage.getItem(LS_HIDE_FOLDERS) === '1';
function toggleFoldersBtnHtml(){

function wireToggleFoldersBtn(container, refreshFn){

  if(!btn) return;

    refreshFn();

if(libSortCriterion==='color'){ libSortColor = true; libSortCriterion = 'alpha'; }
const SORT_OPTIONS = [
  {value:'alpha', label:'Alphabétique'},
  {value:'created', label:'Date de création'},
  {value:'modified', label:'Date de modification'},
  {value:'count', label:'Nombre de souvenirs'},
  {value:'status', label:'Statut'},
  {value:'priority', label:'Priorité'},
];
const STATUS_ORDER = {a_traiter:0, en_cours:1, traite:2};

function folderCompareFn(criterion){
  const countOf = f=> traumas.filter(t=>t.folderId===f.id).length;
  const isDone = f=>{ const items = traumas.filter(t=>t.folderId===f.id); return items.length>0 && items.every(t=>t.status==='traite'); };
  if(criterion==='created') return (a,b)=> (b.createdAt||0) - (a.createdAt||0);
  if(criterion==='modified') return (a,b)=> (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0);
  if(criterion==='count') return (a,b)=> countOf(b) - countOf(a);
  if(criterion==='priority') return (a,b)=> (b.priority||0) - (a.priority||0) || a.name.localeCompare(b.name);
  if(criterion==='status') return (a,b)=> (isDone(a)?1:0) - (isDone(b)?1:0) || a.name.localeCompare(b.name);
  return (a,b)=> a.name.localeCompare(b.name);
}

function sortFolders(list, criterion, byColor){
  const arr = [...list];
  const cmp = folderCompareFn(criterion);
  if(!byColor){ arr.sort(cmp); return arr; }
  const groups = new Map();
  arr.forEach(f=>{
    const key = f.color || 'default';
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(f);
  });
  const groupList = [...groups.entries()].map(([key, items])=>{
    items.sort(cmp);
    return {items, isDefault: key==='default'};
  });
  groupList.sort((a,b)=> (a.isDefault?1:0) - (b.isDefault?1:0) || cmp(a.items[0], b.items[0]));
  return groupList.flatMap(g=> g.items);
}
function sortTraumas(list, mode){
  const arr = [...list];
  if(mode==='alpha') arr.sort((a,b)=> a.title.localeCompare(b.title));
  else if(mode==='created') arr.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  else if(mode==='modified') arr.sort((a,b)=> (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0));
  else if(mode==='status') arr.sort((a,b)=> (STATUS_ORDER[a.status]??0) - (STATUS_ORDER[b.status]??0));
  else if(mode==='priority') arr.sort((a,b)=> (b.priority||0) - (a.priority||0) || a.title.localeCompare(b.title));
  if(mode!=='status'){ arr.sort((a,b)=> (a.status==='traite'?1:0) - (b.status==='traite'?1:0)); }
  return arr;
}

function traumaListByKind(kind){ return kind==='recent' ? recentTraumas : traumas; }
function traumaSaveFnByKind(kind){ return kind==='recent' ? saveRecentTraumas : saveTraumas; }
function addCrossLink(idA, kindA, idB, kindB){
  const a = traumaListByKind(kindA).find(x=>x.id===idA);
  const b = traumaListByKind(kindB).find(x=>x.id===idB);
  if(!a || !b) return;
  if(!a.linkedTraumas) a.linkedTraumas = [];
  if(!b.linkedTraumas) b.linkedTraumas = [];
  if(!a.linkedTraumas.some(l=>l.id===idB && l.kind===kindB)) a.linkedTraumas.push({id:idB, kind:kindB});
  if(!b.linkedTraumas.some(l=>l.id===idA && l.kind===kindA)) b.linkedTraumas.push({id:idA, kind:kindA});
  traumaSaveFnByKind(kindA)(traumaListByKind(kindA));
  if(kindA!==kindB) traumaSaveFnByKind(kindB)(traumaListByKind(kindB));
}
function removeCrossLink(idA, kindA, idB, kindB){
  const a = traumaListByKind(kindA).find(x=>x.id===idA);
  const b = traumaListByKind(kindB).find(x=>x.id===idB);
  if(a && a.linkedTraumas) a.linkedTraumas = a.linkedTraumas.filter(l=> !(l.id===idB && l.kind===kindB));
  if(b && b.linkedTraumas) b.linkedTraumas = b.linkedTraumas.filter(l=> !(l.id===idA && l.kind===kindA));
  traumaSaveFnByKind(kindA)(traumaListByKind(kindA));
  if(kindA!==kindB) traumaSaveFnByKind(kindB)(traumaListByKind(kindB));
}
function unlinkTraumaEverywhere(id, kind){
  [traumas, recentTraumas].forEach(list=>{
    list.forEach(t=>{ if(t.linkedTraumas) t.linkedTraumas = t.linkedTraumas.filter(l=> !(l.id===id && l.kind===kind)); });
  });
  saveTraumas(traumas); saveRecentTraumas(recentTraumas);
}
function linkedTraumasHtml(t){
  const links = t.linkedTraumas || [];
  const names = links.map(l=>{
    const item = traumaListByKind(l.kind).find(x=>x.id===l.id);
    return item ? escapeHtml(item.title) : null;
  }).filter(Boolean);
  if(!names.length) return '';
  return `<div class="linked-traumas"><div><div class="sessions-history-title">Souvenir${names.length>1?'s':''} lié${names.length>1?'s':''}</div><div class="linked-traumas-names">${names.join(', ')}</div></div></div>`;
}

function renderConfirmDelete(kind, id, returnPhase, returnFn){
  const s = stageBase();
  const isFolder = kind==='folder';

  const list = isRecent ? recentTraumas : traumas;

  const label = item ? (isFolder ? item.name : item.title) : '';
  s.innerHTML = `

    <p class="sub fs" style="animation-delay:.3s">${isFolder ? "Les souvenirs qu'il contient ne seront pas supprimés : ils redeviendront simplement sans dossier." : 'Cette action est irréversible.'}</p>

      <button class="sel-add" id="confirm-cancel">Annuler</button>

    </div>
  `;
  document.body.classList.add('hide-r');
  const cancel = ()=>{ history.pop(); currentPhase=returnPhase; currentFn=returnFn; returnFn(); };

  });
  forwardAction = cancel;
}

const VOC_SCALE_KEYS = new Set(['level2','endVoc']);
function renderScaleScreen(title, storeKey, detailKey, nextPhase, nextFn, showDetail, introHtml){
  const s = stageBase();
  const labelFn = VOC_SCALE_KEYS.has(storeKey) ? bucketLabelPresence : bucketLabelDistress;
  const numbersHtml = Array.from({length:11},(_,i)=>i).map(n=>`<button class="scale-num" data-v="${n}">${n}</button>`).join('');
  s.innerHTML = `
    <h2 class="instruction fs">${title}</h2>
    ${introHtml ? `<p class="sub fs" style="animation-delay:.5s">${introHtml}</p>` : ''}
    <div class="scale-wrap fs" style="animation-delay:.9s">

      ${showDetail!==false ? `<div class="free-text-wrap" style="width:100%; margin-top:16px;"><textarea id="sl-detail" placeholder="Vous pouvez préciser si vous voulez (facultatif).">${session[detailKey]||''}</textarea></div>` : ''}
    </div>
  `;
  let touched = session[storeKey]!=null;
  let currentValue = touched ? session[storeKey] : null;
  const buttons = s.querySelectorAll('.scale-num');
  function selectValue(v){
    buttons.forEach(b=> b.classList.toggle('selected', +b.dataset.v===v));
    s.querySelector('#sl-label').textContent = labelFn(v);
  }
  if(touched) selectValue(currentValue);
  buttons.forEach(b=> b.addEventListener('click', ()=>{
    touched = true; currentValue = +b.dataset.v;
    selectValue(currentValue);
  }));
  forwardAction = ()=>{
    session[storeKey] = touched ? currentValue : null;
    if(showDetail!==false){ session[detailKey] = s.querySelector('#sl-detail').value; }
    goTo(nextPhase, nextFn);
  };
}

function renderReconnect(mode){
  const s = stageBase();
  const isPosLike = mode==='pos' || mode==='rtep_pos';

  const affirmation = isPosLike && session.desiredText ? escapeHtml(session.desiredText) : '';

function renderCountdown(mode){

let bls = { running:false, mode:null, accumulated:0, resumeTime:0, lastSide:null, anim:null, timer:null, audioCtx:null };

function computeXY(t){
  const swing=Math.sin(t*Math.PI*2);
  return {x:0.5+swing*0.42, y:0.5};
}
function ensureAudioCtx(){
  try{
    if(!bls.audioCtx) bls.audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(bls.audioCtx.state==='suspended') bls.audioCtx.resume();
  }catch(e){}
  return bls.audioCtx;
}
/* débloque le contexte audio dès la toute première interaction avec la page, pas seulement
   au lancement d'une série : certains navigateurs n'autorisent la lecture que si le contexte
   a été créé/repris tôt, au plus près d'un vrai geste utilisateur. */
['keydown','pointerdown','touchstart'].forEach(evt=>{
  document.addEventListener(evt, function unlockAudioOnFirstGesture(){ if(settings.audio) ensureAudioCtx(); }, {capture:true});
});
function playTick(side){
  if(!settings.audio) return;
  try{
    const ctx=ensureAudioCtx();
    if(!ctx || ctx.state!=='running') return;
    const osc=ctx.createOscillator(), gain=ctx.createGain(), pan=ctx.createStereoPanner();
    osc.type='sine'; osc.frequency.value=420; pan.pan.value=side==='L'?-1:1;
    const now=ctx.currentTime;
    gain.gain.setValueAtTime(0,now); gain.gain.linearRampToValueAtTime(0.18,now+0.012); gain.gain.exponentialRampToValueAtTime(0.0001,now+0.11);
    osc.connect(gain).connect(pan).connect(ctx.destination); osc.start(now); osc.stop(now+0.13);
  }catch(e){}
}

const RTEP_HOTSPOT_DURATION = 20; /* secondes — "série courte", ~8-12 passages */
function showBall(mode, resp){
  document.body.classList.add('hide-l','hide-r','stage-dark');
  $('stage').style.display='none'; $('bls-stage').style.display='block';
  const inner = $('bls-inner');
  const isFirst = resp === undefined;
  const currentHotspot = mode==='rtep_hotspot' ? session.hotspots[session.hotspotIndex] : null;
  const txt = mode==='neg' ? 'Plongez dans le souvenir.'
    : (mode==='pos' || mode==='rtep_pos') ? 'Plongez dans le souvenir en restant sur cette fréquence.'
    : mode==='rtep_hotspot' ? 'Plongez dans ce point chaud.'
    : mode==='rtep_worst' ? 'Plongez dans ce moment.'
    : mode==='bodyscan' ? 'Scannez votre corps.' : 'Suivez le point des yeux.';
  const count = mode==='neg' ? session.negSets
    : mode==='pos' ? session.posSets
    : mode==='rtep_worst' ? session.negSets
    : mode==='rtep_pos' ? session.posSets
    : mode==='rtep_hotspot' ? (currentHotspot ? (session.hotspotWork[currentHotspot.id]?.sets||0) : 0)
    : 1;
  inner.innerHTML = `
    ${isFirst ? `<div id="bls-instruction">${txt}</div>` : ''}
    <div id="bls-dot"></div>
    ${count>=1 && (mode==='neg'||mode==='pos') ? `<button class="skip-link" id="skip-link">passer</button>` : ''}
  `;
  const dot = $('bls-dot');
  dot.style.width=settings.size+'px'; dot.style.height=settings.size+'px'; dot.style.background=settings.color;
  const skipBtn = $('skip-link');
  if(skipBtn) skipBtn.addEventListener('click', ()=>{
    if(mode==='neg') goTo('reconnect_pos', ()=>renderReconnect('pos'));
    else if(mode==='pos') goTo('vocrecap', renderVocRecap);
  });
  spaceAction = ()=> startBLS(mode);
}

function startBLS(mode){
  if(settings.audio) ensureAudioCtx();
  spaceAction = ()=> requestStop();
  bls.mode=mode; bls.running=true; bls.accumulated=0; bls.resumeTime=performance.now(); bls.lastSide=null;
  if(mode==='neg') session.negSets++;
  else if(mode==='pos') session.posSets++;
  else if(mode==='rtep_worst') session.negSets++;
  else if(mode==='rtep_pos') session.posSets++;
  else if(mode==='rtep_hotspot'){
    const h = session.hotspots[session.hotspotIndex];
    if(h){
      if(!session.hotspotWork[h.id]) session.hotspotWork[h.id] = {sensation:'', sud:null, negCognition:'', sets:0, lastSud:null};
      session.hotspotWork[h.id].sets++;
    }
  }
  const ins = $('bls-instruction'); if(ins) ins.style.opacity='0';
  const duration = mode==='rtep_hotspot' ? RTEP_HOTSPOT_DURATION : settings.duration;
  bls.timer = setTimeout(()=> requestStop(), duration*1000);
  runLoop();
}

function runLoop(){
  const dot=$('bls-dot'); const bstage=$('bls-stage');
  const speed=settings.speed, periodMs=60000/speed;
  function frame(now){
    if(!bls.running) return;
    const elapsed = bls.accumulated + (now-bls.resumeTime);
    const t = (elapsed%periodMs)/periodMs;
    const {x,y} = computeXY(t);
    const w=bstage.clientWidth, h=bstage.clientHeight;
    dot.style.left=(x*w)+'px'; dot.style.top=(y*h)+'px';
    const side = x<0.5?'L':'R';
    if(side!==bls.lastSide){
      if(bls.lastSide!==null){ playTick(side); if(settings.haptic && navigator.vibrate) navigator.vibrate(25); }
      bls.lastSide=side;
    }
    bls.anim = requestAnimationFrame(frame);
  }
  bls.anim = requestAnimationFrame(frame);
}

function requestStop(){
  if(!bls.running) return;
  bls.running=false; spaceAction=null;
  if(bls.timer) clearTimeout(bls.timer);
  if(bls.anim) cancelAnimationFrame(bls.anim);
  const dot=$('bls-dot'), bstage=$('bls-stage');
  const startLeft=parseFloat(dot.style.left)||bstage.clientWidth/2, startTop=parseFloat(dot.style.top)||bstage.clientHeight/2;
  const cx=bstage.clientWidth/2, cy=bstage.clientHeight/2, dur=1200, t0=performance.now();
  function decel(now){
    let p=Math.min(1,(now-t0)/dur); const ease=1-Math.pow(1-p,3);
    dot.style.left=(startLeft+(cx-startLeft)*ease)+'px'; dot.style.top=(startTop+(cy-startTop)*ease)+'px';
    if(p<1) requestAnimationFrame(decel); else afterStop();
  }
  requestAnimationFrame(decel);
}

function afterStop(){
  const mode = bls.mode;
  if(mode==='rtep_hotspot'){ $('bls-stage').style.display='none'; $('stage').style.display='flex'; document.body.classList.remove('hide-l','hide-r'); crossfadeToFormRtepHotspot(); return; }
  if(mode==='bodyscan'){ $('bls-stage').style.display='none'; $('stage').style.display='flex'; document.body.classList.remove('hide-l','hide-r'); renderBodyScan(); return; }
  if(mode==='simple'){ showBall('simple'); return; }
  crossfadeToForm(mode);
}

    inner.innerHTML = `
      <div class="dark-form">

      </div>`;

    document.body.classList.add('hide-l','hide-r');
    function proceedResponse(nothing){

/* ==================================================================
   R-TEP — protocole dédié aux traumas récents.
   Réutilise les mécaniques BLS/checkpoint partagées ci-dessus (modes
   'rtep_hotspot' / 'rtep_worst' / 'rtep_pos') ainsi que la fin de
   parcours EMDR (renderVocRecap -> renderEndDistress -> renderBodyScan
   -> renderClosure -> renderSessionEnd, tous génériques via session.kind).
   ================================================================== */
/* Une séance R-TEP peut s'étaler sur plusieurs fois : la liste des points
   chauds (et le travail déjà fait dessus) est donc réenregistrée sur le
   trauma lui-même au fil de l'eau, séparément de l'historique des séances
   terminées, pour ne jamais perdre ce travail si la séance n'est pas finie
   d'un coup. */
function saveRtepProgress(){
  if(!session || session.kind!=='rtep' || !session.traumaId) return;
  const t = recentTraumas.find(x=>x.id===session.traumaId);
  if(!t) return;
  t.rtepProgress = { hotspots: session.hotspots, hotspotWork: session.hotspotWork, hotspotIndex: session.hotspotIndex, updatedAt: Date.now() };
  if(t.status!=='traite') t.status = 'en_cours';
  t.updatedAt = Date.now();
  saveRecentTraumas(recentTraumas);
}

function beginRtepSession(traumaId, title, description){
  const t = traumaId ? recentTraumas.find(x=>x.id===traumaId) : null;
  const progress = t && t.rtepProgress;
  session = { kind:'rtep', traumaId, title, description,
    hotspots: progress ? progress.hotspots : [], hotspotIndex: progress ? progress.hotspotIndex : 0,
    hotspotWork: progress ? progress.hotspotWork : {},
    hotspotSudScratch: null, hotspotSudScratchDetail: '',
    worstMoments: [], negSets: 0,
    desiredText:'', level2:null, level2Detail:'', posSets:0,
    endVoc:null, endVocDetail:'', endDistress:null, endDistressDetail:'',
    startDistress: null, recontextText:'', stagedLinks: [],
    feltText:'' };
  if(t){ if(t.status!=='traite') t.status = 'en_cours'; t.updatedAt = Date.now(); saveRecentTraumas(recentTraumas); }
  goTo('rtep_loading1', ()=> renderLoading({phase:'rtep_stabilize', fn:renderRtepStabilize}));
}

  const isLast = session.hotspotIndex >= session.hotspots.length-1;
  const s = stageBase();
  s.innerHTML = `
    <h2 class="instruction fs">${low ? "Ce point chaud semble s'être apaisé." : "Souhaitez-vous..."}</h2>
    <div class="fs" style="animation-delay:.5s; display:flex; gap:12px; justify-content:center; margin-top:10px;">

      <button class="sel-add" id="hs-next">${isLast ? "C'est bon, passer à la suite" : 'Point chaud suivant'}</button>
    </div>
  `;
  const advance = ()=>{
    session.hotspotIndex++;
    saveRtepProgress();
    if(session.hotspotIndex < session.hotspots.length){ goTo('rtep_hotspot_intro', renderRtepHotspotIntro); }
    else{ goTo('rtep_worst_intro', renderRtepWorstIntro); }
  };
  const more = ()=> goTo('rtep_hotspot_reconnect', ()=> renderReconnect('rtep_hotspot'));
  s.querySelector('#hs-more').addEventListener('click', more);
  s.querySelector('#hs-next').addEventListener('click', advance);
  forwardAction = advance;
}

/* ---- étape 12 : pont optionnel vers du matériel ancien ---- */
function renderRtepLinkStep(){
  const s = stageBase();
  const oldCandidates = traumas.filter(t=> !(session.traumaId && t.id===session.traumaId));
  const recentCandidates = recentTraumas.filter(t=> !(session.traumaId && t.id===session.traumaId));
  s.innerHTML = `
    <h2 class="instruction fs">Un pont apparaît-il vers un souvenir plus ancien de même thème ?</h2>
    <p class="sub fs" style="animation-delay:.3s">Vous pouvez le lier ici pour une future séance séparée, sans l'ouvrir maintenant. Facultatif.</p>
    <div class="free-text-wrap fs" style="animation-delay:.4s; width:min(560px,92%);"><input type="text" id="rtep-link-search" placeholder="Rechercher un souvenir..."></div>
    <div id="rtep-link-list" style="max-height:min(38vh,300px); overflow-y:auto; margin:10px 0; width:min(560px,92%);"></div>
    <div id="rtep-link-selected" style="width:min(560px,92%);"></div>
  `;
  document.body.classList.add('hide-l');
  const listEl = s.querySelector('#rtep-link-list');
  const selectedEl = s.querySelector('#rtep-link-selected');
  function renderSelected(){
    selectedEl.innerHTML = session.stagedLinks.length ? `<p class="sub" style="margin-top:8px;">Liés : ${session.stagedLinks.map(l=> escapeHtml(l.title)).join(', ')}</p>` : '';
  }
  function renderList(query){
    const q=(query||'').trim().toLowerCase();
    const rows = [
      ...oldCandidates.filter(t=>!q||t.title.toLowerCase().includes(q)).map(t=>({id:t.id,kind:'old',title:t.title})),
      ...recentCandidates.filter(t=>!q||t.title.toLowerCase().includes(q)).map(t=>({id:t.id,kind:'recent',title:t.title})),
    ];
    listEl.innerHTML = rows.map(r=>`
      <div class="sel-card" data-id="${r.id}" data-kind="${r.kind}">
        <div><div class="t">${escapeHtml(r.title)}</div></div>
        <div class="actions"><button data-pick="${r.id}" data-pick-kind="${r.kind}">${session.stagedLinks.some(l=>l.id===r.id&&l.kind===r.kind)?'Retirer':'Lier'}</button></div>
      </div>`).join('') || `<p class="sub">Aucun résultat.</p>`;
    listEl.querySelectorAll('[data-pick]').forEach(b=> b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id=b.dataset.pick, kind=b.dataset.pickKind;
      const idx = session.stagedLinks.findIndex(l=>l.id===id&&l.kind===kind);
      if(idx>=0) session.stagedLinks.splice(idx,1);
      else{ const item = kind==='old'?traumas.find(t=>t.id===id):recentTraumas.find(t=>t.id===id); if(item) session.stagedLinks.push({id,kind,title:item.title}); }
      renderList(q); renderSelected();
    }));
  }
  renderList(''); renderSelected();
  s.querySelector('#rtep-link-search').addEventListener('input', (e)=> renderList(e.target.value));
  forwardAction = ()=> goTo('vocrecap', renderVocRecap);
}

const CLOSURE_STEPS = [
  {title:"Concentrez-vous sur votre respiration, sans chercher à la contrôler."},

  {title:"Remarquez 5 choses que vous voyez."},

  {title:"Prenez-vous dans vos bras. « Tu n'as rien à prouver. » « Tu as de la valeur comme tu es. » « Tu es en sécurité. »"}

function renderClosure(i){
  goTo('closure'+i, ()=>{
    const s = stageBase();

function renderSessionEnd(){
  const s = stageBase();
  document.body.classList.add('hide-r');
  s.innerHTML = `
    <h2 class="instruction fs">Séance terminée</h2>
    <p class="sub fs" style="animation-delay:.4s">Prenez un moment avant de vous relever.</p>
    <div class="btn-row fs" id="status-row" style="animation-delay:.7s; display:flex; gap:10px;"></div>
  `;
  const finish = ()=>{ session=null; history=[]; currentPhase=null; goTo('loading0final', ()=> renderLoading({phase:'home',fn:renderHome})); };
  let autoAdvance = true;
  const kind = session.kind==='rtep' ? 'recent' : 'old';
  const list = traumaListByKind(kind);
  const save = traumaSaveFnByKind(kind);
  if(session.traumaId){
    const t = list.find(x=>x.id===session.traumaId);
    if(t){
      if(!t.sessions) t.sessions = [];
      t.sessions.push({
        at: Date.now(),
        startDistress: session.startDistress,
        endDistress: session.endDistress,
        level2: session.level2,
        endVoc: session.endVoc,
        feltText: session.feltText,
        desiredText: session.desiredText,
        negSets: session.negSets,
        posSets: session.posSets
      });
      t.status = 'en_cours'; t.updatedAt = Date.now();
      if(kind==='recent') delete t.rtepProgress;
      if(session.stagedLinks && session.stagedLinks.length){
        session.stagedLinks.forEach(l=> addCrossLink(t.id, kind, l.id, l.kind));
      }
      save(list);
      const success = session.endDistress!=null && session.endDistress<=1;
      if(success){
        autoAdvance = false;
        s.querySelector('#status-row').innerHTML = `
          <div class="fs" style="animation-delay:.7s; text-align:center;">
            <p class="sub" style="margin-bottom:10px;">Félicitations, ce souvenir ne semble plus vous déranger. On le marque comme traité ?</p>
            <div style="display:flex; gap:10px; justify-content:center;">
              <button class="sel-add" id="mark-done">Marquer comme traité</button>
              <button class="sel-add" id="mark-not-yet">Pas encore</button>
            </div>
          </div>`;
        s.querySelector('#mark-done').addEventListener('click', ()=>{ t.status='traite'; t.updatedAt=Date.now(); save(list); finish(); });
        s.querySelector('#mark-not-yet').addEventListener('click', finish);
      } else {
        s.querySelector('#status-row').innerHTML = '<p class="sub">Souvenir marqué : en cours.</p>';
      }
    }
  }
  if(autoAdvance) setTimeout(finish, 6000);
}

function updateConnDot(){
  const dot = $('connDot');
  if(!dot) return;
  if(!supa){ dot.className = 'conn-dot'; dot.title = 'Synchronisation non configurée'; return; }
  if(!vault.userId){ dot.className = 'conn-dot'; dot.title = "Non connecté·e — vos souvenirs restent uniquement sur cet appareil"; return; }
  if(lastSyncError){ dot.className = 'conn-dot err'; dot.title = 'La dernière synchronisation a échoué'; return; }
  dot.className = 'conn-dot ok'; dot.title = 'Connecté·e et synchronisé·e';
}

function accountBackupHtml(){
  return `
  <div class="account-backup">
    <button type="button" id="acc-export-btn">Télécharger une sauvegarde</button>
    <button type="button" id="acc-import-btn">Restaurer une sauvegarde</button>
    <input type="file" id="acc-import-input" accept="application/json" style="display:none;">
    <p class="sub" id="acc-import-status" style="font-size:11px;margin:6px 0 0;"></p>
  </div>`;
}

function wireBackupControls(panel){
  panel.querySelector('#acc-export-btn').addEventListener('click', ()=>{
    const data = {traumas, folders, recentTraumas, settings};
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'soloemdr_sauvegarde_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  const importInput = panel.querySelector('#acc-import-input');
  panel.querySelector('#acc-import-btn').addEventListener('click', ()=> importInput.click());
  importInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    const statusEl = panel.querySelector('#acc-import-status');
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!Array.isArray(data.traumas) && !Array.isArray(data.recentTraumas) && !Array.isArray(data.folders)){
        statusEl.textContent = 'Fichier invalide.';
        return;
      }
      traumas = data.traumas || [];
      folders = data.folders || [];
      recentTraumas = data.recentTraumas || [];
      if(data.settings) settings = Object.assign(settings, data.settings);
      saveTraumas(traumas);
      saveFolders(folders);
      saveRecentTraumas(recentTraumas);
      saveSettings();
      refreshSettingsPanelInputs();
      statusEl.textContent = `Restauré : ${traumas.length} souvenir(s), ${folders.length} dossier(s), ${recentTraumas.length} trauma(s) récent(s).` +
        (vault.userId ? ' Synchronisation avec votre compte en cours...' : ' (non connecté·e pour le moment : restera uniquement sur cet appareil tant que vous ne vous connectez pas)');
    }catch(err){
      statusEl.textContent = 'Erreur de lecture du fichier : ' + err.message;
    }
    importInput.value = '';
  });
}

  const panel = $('account-panel');
  updateConnDot();
  if(!supa){
    panel.innerHTML = `<p class="sub">Synchronisation non configurée.</p>` + accountBackupHtml();

    }catch(e){ errEl.textContent = translateAuthError(e); }
  };
  s.querySelector('#rec-submit').addEventListener('click', submit);
  forwardAction = submit;
}

function renderSyncChoice(row){
  const s = stageBase();
  s.innerHTML = `
    <h2 class="instruction fs">Des souvenirs existent aux deux endroits</h2>
    <p class="sub fs" style="animation-delay:.3s">Cet appareil a déjà des souvenirs en local, et ton compte en a aussi. Lequel veux-tu garder ? L'autre sera remplacé.</p>
    <div class="fs" style="animation-delay:.5s; display:flex; gap:12px; justify-content:center; margin-top:10px;">
      <button class="sel-add" id="sync-local">Garder ceux de cet appareil</button>
      <button class="sel-add" id="sync-cloud">Garder ceux du compte</button>
    </div>
  `;
  document.body.classList.add('hide-l','hide-r');
  s.querySelector('#sync-local').addEventListener('click', async ()=>{
    await vaultResolveKeepLocal();
    session=null; history=[]; currentPhase=null;
    goTo('home', renderHome);
  });
  s.querySelector('#sync-cloud').addEventListener('click', async ()=>{
    await vaultResolveUseCloud(row);
    session=null; history=[]; currentPhase=null;
    goTo('home', renderHome);
  });
}

/* boot : on attend d'avoir tenté de restaurer la session avant de choisir l'écran
   de destination, pour ne jamais afficher un instant l'écran "non connecté·e"
   à quelqu'un qui l'est en fait (juste le temps que la restauration se résolve). */
vaultRestorePromise.then(()=>{
  const restored = restorableTargetForPhase(sessionStorage.getItem(SS_LAST_PHASE));
  goTo(restored ? restored.phase : 'home', restored ? restored.fn : renderHome);
});
function renderPhase(phase){ }
</script>
